name: NSE Delivery Momentum v1.4.0 THREE ENGINE
on:
  workflow_dispatch:
  push:
    branches: [nse-delivery-momentum-v1-build-final]
    paths:
      - '.github/scripts/delivery_momentum_v140_vu_ui_patch.py.gz.b64'
      - '.github/workflows/delivery-momentum-v140.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Publish run id
        run: |
          echo "${GITHUB_RUN_ID}" > .delivery-momentum-v140-run-id.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .delivery-momentum-v140-run-id.txt
          git commit -m "Record Delivery Momentum v1.4.0 build ${GITHUB_RUN_ID}" || true
          git push origin HEAD:nse-delivery-momentum-v1-build-final || true
      - name: Materialize application source
        run: |
          set -e
          cat .github/payloads/delivery-momentum-v1.part* | base64 -d | tar -xz
          test -f delivery-momentum/app/src/main/java/com/suhas/nsedeliverymomentum/MainActivity.java
      - name: Android compile compatibility fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('delivery-momentum/app/src/main/java/com/suhas/nsedeliverymomentum/GrowwClient.java')
          s=p.read_text()
          old='JSONObject p=j.optJSONObject("payload"); Map<String,Ohlc> out=new HashMap<>(); if(p!=null)for(String k:p.keySet()){String s=k.startsWith("NSE_")?k.substring(4):k; out.put(s,parseOhlc(String.valueOf(p.opt(k))));} return ApiResult.ok(out);'
          new='JSONObject p=j.optJSONObject("payload"); Map<String,Ohlc> out=new HashMap<>(); if(p!=null){Iterator<String> it=p.keys();while(it.hasNext()){String k=it.next();String s=k.startsWith("NSE_")?k.substring(4):k;out.put(s,parseOhlc(String.valueOf(p.opt(k))));}} return ApiResult.ok(out);'
          if old not in s: raise SystemExit('GrowwClient JSONObject anchor not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Apply v1 runtime and UI chain
        run: |
          python .github/scripts/delivery_momentum_v1_runtime_fix.py
          python .github/scripts/delivery_momentum_v11_ui_patch.py
          python .github/scripts/delivery_momentum_v11_insets_fix.py
          python .github/scripts/delivery_momentum_v111_ohlc_health_fix.py
          python .github/scripts/delivery_momentum_v120_all_nse_patch.py
          python .github/scripts/delivery_momentum_v130_trajectory_patch.py
          python .github/scripts/delivery_momentum_v130_low_price_fix.py
          python .github/scripts/delivery_momentum_v131_trajectory_calibration.py
      - name: Apply v1.4 V-U engine and compact UI
        run: |
          base64 -d .github/scripts/delivery_momentum_v140_vu_ui_patch.py.gz.b64 | gzip -d > /tmp/v140.py
          python /tmp/v140.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Full clean validation
        run: |
          set -e
          gradle --no-daemon --console=plain -p delivery-momentum clean testDebugUnitTest lintDebug assembleDebug assembleRelease
          mkdir -p delivery-momentum/out
          cp delivery-momentum/app/build/outputs/apk/release/app-release-unsigned.apk delivery-momentum/out/NSE-Delivery-Momentum-S24-v1.4.0-THREE-ENGINE-UNSIGNED.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging delivery-momentum/out/NSE-Delivery-Momentum-S24-v1.4.0-THREE-ENGINE-UNSIGNED.apk | tee delivery-momentum/out/APK-BADGING.txt
          grep -q "package: name='com.suhas.nsedeliverymomentum'" delivery-momentum/out/APK-BADGING.txt
          grep -q "versionName='1.4.0'" delivery-momentum/out/APK-BADGING.txt
          grep -q 'class ReversalMath' delivery-momentum/app/src/main/java/com/suhas/nsedeliverymomentum/ReversalMath.java
          grep -q 'reversal_cards' delivery-momentum/app/src/main/java/com/suhas/nsedeliverymomentum/DeliveryMomentumService.java
          grep -q 'V/U BUY' delivery-momentum/app/src/main/java/com/suhas/nsedeliverymomentum/DeliveryMomentumService.java
          grep -q 'UPWARD TRAJECTORY' delivery-momentum/app/src/main/java/com/suhas/nsedeliverymomentum/MainActivity.java
          grep -q 'V / U REVERSAL MOMENTUM' delivery-momentum/app/src/main/java/com/suhas/nsedeliverymomentum/MainActivity.java
          grep -q 'compactRow' delivery-momentum/app/src/main/java/com/suhas/nsedeliverymomentum/MainActivity.java
          grep -q '"product","CNC"' delivery-momentum/app/src/main/java/com/suhas/nsedeliverymomentum/GrowwClient.java
          grep -q '"order_type","MARKET"' delivery-momentum/app/src/main/java/com/suhas/nsedeliverymomentum/GrowwClient.java
          cp delivery-momentum/app/build/reports/lint-results-debug.html delivery-momentum/out/LINT.html
          cp -r delivery-momentum/app/build/reports/tests/testDebugUnitTest delivery-momentum/out/UNIT-TESTS
      - name: Sign fresh-install release
        run: |
          set -e
          STORE_PASS='FreshDeliveryMomentumV140!'
          ALIAS='nse-delivery-momentum-v140'
          keytool -genkeypair -v -keystore /tmp/delivery-momentum-v140.jks -storepass "$STORE_PASS" -keypass "$STORE_PASS" -alias "$ALIAS" -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=NSE Delivery Momentum v1.4.0, OU=Private Fresh Install, O=Delivery Momentum, L=Bengaluru, ST=Karnataka, C=IN"
          $ANDROID_HOME/build-tools/35.0.0/apksigner sign --ks /tmp/delivery-momentum-v140.jks --ks-key-alias "$ALIAS" --ks-pass pass:"$STORE_PASS" --key-pass pass:"$STORE_PASS" --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out delivery-momentum/out/NSE-Delivery-Momentum-S24-v1.4.0-THREE-ENGINE-FRESH-SIGNED.apk delivery-momentum/out/NSE-Delivery-Momentum-S24-v1.4.0-THREE-ENGINE-UNSIGNED.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs delivery-momentum/out/NSE-Delivery-Momentum-S24-v1.4.0-THREE-ENGINE-FRESH-SIGNED.apk | tee delivery-momentum/out/SIGNATURE-VERIFICATION.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' delivery-momentum/out/SIGNATURE-VERIFICATION.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' delivery-momentum/out/SIGNATURE-VERIFICATION.txt
          sha256sum delivery-momentum/out/NSE-Delivery-Momentum-S24-v1.4.0-THREE-ENGINE-FRESH-SIGNED.apk > delivery-momentum/out/SHA256.txt
      - name: Package source and notes
        run: |
          cat > delivery-momentum/out/RELEASE-NOTES.txt <<'EOF'
          NSE DELIVERY MOMENTUM v1.4.0 — THREE ENGINE / V-U REVERSAL + COMPACT UI

          ENGINE 1 — CONTINUATION TOP 5
          Existing ALL-NSE continuation engine retained.

          ENGINE 2 — UPWARD TRAJECTORY TOP 5
          Existing calibrated persistent-climb engine retained.

          ENGINE 3 — V/U REVERSAL MOMENTUM TOP 5
          New independent detector for large intraday V or U structures.
          It looks for a meaningful left-side decline, trough/basin, rebound depth, recovery ratio,
          positive recovery-leg slope, day-range location, volume impulse, liquidity/spread and swing count.
          States: V/U BUY, REVERSING, WATCH. It does not buy while the price is still falling.

          UI
          All three sections now use compact two-line rows so five stocks per section fit with much less scrolling.
          Tap a row to open the full metrics/reason dialog.

          EXECUTION
          Delivery only: Groww CASH + CNC + MARKET BUY. No MIS/F&O. No automatic sell.
          LIVE OFF remains paper learning. LIVE ON can act only on qualified BUY / UPTREND / V-U BUY states.
          EOF
          (cd delivery-momentum && zip -qr out/NSE-Delivery-Momentum-v1.4.0-SOURCE.zip app build.gradle settings.gradle gradle.properties)
      - uses: actions/upload-artifact@v4
        with:
          name: NSE-Delivery-Momentum-S24-v1.4.0-THREE-ENGINE
          path: delivery-momentum/out/**
          retention-days: 30
