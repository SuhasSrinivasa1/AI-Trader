name: TEMP Secure NSE Intraday Momentum v1.8.0 Build

on:
  push:
    branches: [nse-delivery-momentum-v1-build-final]
    paths:
      - '.github/workflows/delivery-momentum-v140.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout builder branch
        uses: actions/checkout@v4

      - name: Publish one-time RSA public key
        shell: bash
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out /tmp/v180-private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/v180-private.pem -pubout -out /tmp/v180-public.pem
          base64 -w0 /tmp/v180-public.pem > v180-public-key.b64
          echo "${GITHUB_RUN_ID}" > v180-secure-run-id.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v180-public-key.b64 v180-secure-run-id.txt
          git commit -m "Publish one-time v1.8.0 secure build key ${GITHUB_RUN_ID}"
          git push origin HEAD:nse-delivery-momentum-v1-build-final
          chmod 600 /tmp/v180-private.pem

      - name: Wait for encrypted source bundle
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for i in $(seq 1 120); do
            git fetch -q origin nse-delivery-momentum-v1-build-final
            if git cat-file -e origin/nse-delivery-momentum-v1-build-final:v180-source.enc.b64 2>/dev/null && \
               git cat-file -e origin/nse-delivery-momentum-v1-build-final:v180-keys.enc.b64 2>/dev/null; then
              found=1
              break
            fi
            sleep 5
          done
          test "$found" = "1"
          git show origin/nse-delivery-momentum-v1-build-final:v180-source.enc.b64 | tr -d '\r\n' | base64 -d > /tmp/v180-source.enc
          git show origin/nse-delivery-momentum-v1-build-final:v180-keys.enc.b64 | tr -d '\r\n' | base64 -d > /tmp/v180-keys.enc
          test -s /tmp/v180-source.enc
          test -s /tmp/v180-keys.enc

      - name: Decrypt v1.8.0 source only inside runner
        shell: bash
        run: |
          set -euo pipefail
          openssl pkeyutl -decrypt -inkey /tmp/v180-private.pem \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -in /tmp/v180-keys.enc -out /tmp/v180-keys.txt
          SOURCE_PASS="$(grep '^SOURCE_PASS=' /tmp/v180-keys.txt | cut -d= -f2-)"
          OUTPUT_PASS="$(grep '^OUTPUT_PASS=' /tmp/v180-keys.txt | cut -d= -f2-)"
          test -n "$SOURCE_PASS"
          test -n "$OUTPUT_PASS"
          echo "::add-mask::$SOURCE_PASS"
          echo "::add-mask::$OUTPUT_PASS"
          echo "OUTPUT_PASS=$OUTPUT_PASS" >> "$GITHUB_ENV"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass pass:"$SOURCE_PASS" \
            -in /tmp/v180-source.enc -out /tmp/NSE-Intraday-Momentum-v1.8.0-SOURCE.zip
          mkdir -p private-v180
          unzip -q /tmp/NSE-Intraday-Momentum-v1.8.0-SOURCE.zip -d private-v180
          test -f private-v180/nse-delivery-v180/app/build.gradle
          grep -q "versionCode 180" private-v180/nse-delivery-v180/app/build.gradle
          grep -q "versionName '1.8.0'" private-v180/nse-delivery-v180/app/build.gradle
          grep -q 'android.permission.POST_NOTIFICATIONS' private-v180/nse-delivery-v180/app/src/main/AndroidManifest.xml
          grep -q 'notifySignal("LONG"' private-v180/nse-delivery-v180/app/src/main/java/com/suhas/nsedeliverymomentum/DeliveryMomentumService.java
          grep -q 'notifySignal("SHORT"' private-v180/nse-delivery-v180/app/src/main/java/com/suhas/nsedeliverymomentum/DeliveryMomentumService.java
          rm -f /tmp/v180-keys.txt /tmp/v180-source.enc /tmp/v180-keys.enc

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Test lint and assemble v1.8.0
        working-directory: private-v180/nse-delivery-v180
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --console=plain clean testDebugUnitTest lintDebug assembleRelease

      - name: Fresh-sign and verify v1.8.0 APK
        working-directory: private-v180/nse-delivery-v180
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          UNSIGNED='app/build/outputs/apk/release/app-release-unsigned.apk'
          SIGNED='out/NSE-Intraday-Momentum-S24-v1.8.0-FRESH-SIGNED.apk'
          test -s "$UNSIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$UNSIGNED" | tee out/APK-BADGING.txt
          grep -q "package: name='com.suhas.nsedeliverymomentum'" out/APK-BADGING.txt
          grep -q "versionCode='180'" out/APK-BADGING.txt
          grep -q "versionName='1.8.0'" out/APK-BADGING.txt
          keytool -genkeypair -v \
            -keystore /tmp/nse-intraday-v180.jks \
            -storepass changeit \
            -keypass changeit \
            -alias nse-v180 \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname 'CN=NSE Intraday Momentum v1.8.0, OU=Fresh Install, O=NSE Intraday Momentum, L=Bengaluru, ST=Karnataka, C=IN'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks /tmp/nse-intraday-v180.jks \
            --ks-key-alias nse-v180 \
            --ks-pass pass:changeit \
            --key-pass pass:changeit \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$SIGNED" "$UNSIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$SIGNED" | tee out/APK-SIGNATURE-VERIFY.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' out/APK-SIGNATURE-VERIFY.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' out/APK-SIGNATURE-VERIFY.txt
          sha256sum "$SIGNED" | tee out/SHA256.txt
          printf 'versionName=1.8.0\nversionCode=180\npackage=com.suhas.nsedeliverymomentum\nmode=INTRADAY LONG + LONG + SHORT\n' > out/VERSION.txt

      - name: Encrypt signed APK for artifact transport
        working-directory: private-v180/nse-delivery-v180
        shell: bash
        run: |
          set -euo pipefail
          openssl enc -aes-256-cbc -salt -pbkdf2 -pass pass:"$OUTPUT_PASS" \
            -in out/NSE-Intraday-Momentum-S24-v1.8.0-FRESH-SIGNED.apk \
            -out out/NSE-Intraday-Momentum-S24-v1.8.0-FRESH-SIGNED.apk.enc
          rm -f out/NSE-Intraday-Momentum-S24-v1.8.0-FRESH-SIGNED.apk /tmp/nse-intraday-v180.jks /tmp/v180-private.pem /tmp/NSE-Intraday-Momentum-v1.8.0-SOURCE.zip

      - name: Upload encrypted verified APK
        uses: actions/upload-artifact@v4
        with:
          name: NSE-Intraday-Momentum-v1.8.0-ENCRYPTED
          path: |
            private-v180/nse-delivery-v180/out/NSE-Intraday-Momentum-S24-v1.8.0-FRESH-SIGNED.apk.enc
            private-v180/nse-delivery-v180/out/APK-SIGNATURE-VERIFY.txt
            private-v180/nse-delivery-v180/out/APK-BADGING.txt
            private-v180/nse-delivery-v180/out/SHA256.txt
            private-v180/nse-delivery-v180/out/VERSION.txt
          if-no-files-found: error
          retention-days: 1
