# v3.1.1 Multyfi-style Groww settings/auth fix • fresh-install signed release
name: NSE Unified Scanner v3.1.1 Settings Fix
on:
  push:
    branches: [nse-unified-scanner-v3.1.0-quality-cash]
    paths: ['.github/workflows/unified-scanner-build-v310.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Publish run id early
        run: |
          echo "${GITHUB_RUN_ID}" > .scanner-v3.1.1-run-id.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .scanner-v3.1.1-run-id.txt
          git commit -m "Record NSE scanner v3.1.1 build run ${GITHUB_RUN_ID}" || true
          git push origin HEAD:nse-unified-scanner-v3.1.0-quality-cash || true

      - name: Reconstruct v3 production baseline
        run: |
          set +e
          python .github/scripts/scanner_v12_patch.py > /tmp/v12patch.log 2>&1
          set -e
          cat /tmp/v12patch.log
          python .github/scripts/scanner_v12_tail.py
          set +e
          python .github/scripts/scanner_v13_patch.py > /tmp/v13patch.log 2>&1
          set -e
          cat /tmp/v13patch.log
          python .github/scripts/scanner_v13_tail.py
          python .github/scripts/scanner_v14_patch.py
          python .github/scripts/scanner_v15_patch.py
          set +e
          python .github/scripts/scanner_v16_patch.py > /tmp/v16patch.log 2>&1
          set -e
          cat /tmp/v16patch.log
          python .github/scripts/scanner_v16_tail.py
          python .github/scripts/scanner_v16_ui_fix.py
          python .github/scripts/scanner_v161_patch.py
          python .github/scripts/scanner_v162_patch.py
          python .github/scripts/scanner_v163_patch.py
          python .github/scripts/scanner_v164_patch.py
          python .github/scripts/scanner_v165_patch.py
          python .github/scripts/scanner_v20_patch.py
          python .github/scripts/scanner_v20_compile_fix.py
          python .github/scripts/scanner_v300_patch.py
          python .github/scripts/scanner_v300_compile_fix.py

      - name: Apply v3.1.0 Quality Momentum / Cash EQ patch
        run: |
          cat .github/scripts/v310_payload/part* | base64 -d | gzip -dc > /tmp/scanner_v310_patch.py
          python /tmp/scanner_v310_patch.py

      - name: Apply v3.1.1 Groww settings/auth patch
        run: |
          base64 -d .github/scripts/scanner_v311_settings_patch.py.gz.b64 | gzip -dc > /tmp/scanner_v311_settings_patch.py
          python /tmp/scanner_v311_settings_patch.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Full validation and release assembly
        run: |
          gradle --no-daemon --console=plain -p unified-scanner clean testDebugUnitTest lintDebug assembleDebug assembleRelease
          mkdir -p unified-scanner/out
          cp unified-scanner/app/build/outputs/apk/release/app-release-unsigned.apk unified-scanner/out/NSE-Unified-Scanner-S24-v3.1.1-SETTINGS-FIX-UNSIGNED.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging unified-scanner/out/NSE-Unified-Scanner-S24-v3.1.1-SETTINGS-FIX-UNSIGNED.apk | grep "versionName='3.1.1'"
          grep -q 'versionCode 311' unified-scanner/app/build.gradle
          grep -q 'SAVE API CREDENTIALS' unified-scanner/app/src/main/java/com/suhas/nseunifiedscanner/MainActivity.java
          grep -q 'REFRESH TOKEN' unified-scanner/app/src/main/java/com/suhas/nseunifiedscanner/MainActivity.java
          grep -q 'AUTHENTICATE' unified-scanner/app/src/main/java/com/suhas/nseunifiedscanner/MainActivity.java
          grep -q 'SAVE + VERIFY STATIC IP' unified-scanner/app/src/main/java/com/suhas/nseunifiedscanner/MainActivity.java
          grep -q 'ACTION_REFRESH_TOKEN' unified-scanner/app/src/main/java/com/suhas/nseunifiedscanner/UnifiedService.java
          grep -q 'GrowwSessionLogicTest' <(find unified-scanner/app/src/test -type f -printf '%f\n')
          cp unified-scanner/app/build/reports/lint-results-debug.html unified-scanner/out/LINT.html

      - name: Sign fresh-install release APK
        run: |
          set -e
          STORE_PASS='TempFresh311BuildOnly!'
          ALIAS='nse-scanner-v311-fresh'
          keytool -genkeypair -v \
            -keystore /tmp/nse-v311-fresh.jks \
            -storepass "$STORE_PASS" \
            -keypass "$STORE_PASS" \
            -alias "$ALIAS" \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname "CN=NSE Unified Scanner v3.1.1, OU=Private Fresh Install, O=NSE Scanner, L=Bengaluru, ST=Karnataka, C=IN"
          $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
            --ks /tmp/nse-v311-fresh.jks \
            --ks-key-alias "$ALIAS" \
            --ks-pass pass:"$STORE_PASS" \
            --key-pass pass:"$STORE_PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out unified-scanner/out/NSE-Unified-Scanner-S24-v3.1.1-SETTINGS-FIX-FRESH-SIGNED.apk \
            unified-scanner/out/NSE-Unified-Scanner-S24-v3.1.1-SETTINGS-FIX-UNSIGNED.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs \
            unified-scanner/out/NSE-Unified-Scanner-S24-v3.1.1-SETTINGS-FIX-FRESH-SIGNED.apk \
            > unified-scanner/out/SIGNATURE-VERIFICATION-v3.1.1.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' unified-scanner/out/SIGNATURE-VERIFICATION-v3.1.1.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' unified-scanner/out/SIGNATURE-VERIFICATION-v3.1.1.txt
          sha256sum unified-scanner/out/NSE-Unified-Scanner-S24-v3.1.1-SETTINGS-FIX-FRESH-SIGNED.apk > unified-scanner/out/SHA256-v3.1.1.txt

      - uses: actions/upload-artifact@v4
        with:
          name: NSE-Unified-Scanner-S24-v3.1.1-SETTINGS-FIX-FRESH-SIGNED
          path: |
            unified-scanner/out/NSE-Unified-Scanner-S24-v3.1.1-SETTINGS-FIX-FRESH-SIGNED.apk
            unified-scanner/out/NSE-Unified-Scanner-S24-v3.1.1-SETTINGS-FIX-UNSIGNED.apk
            unified-scanner/out/SIGNATURE-VERIFICATION-v3.1.1.txt
            unified-scanner/out/SHA256-v3.1.1.txt
            unified-scanner/out/LINT.html
            unified-scanner/app/build/reports/tests/testDebugUnitTest/**
          retention-days: 30
