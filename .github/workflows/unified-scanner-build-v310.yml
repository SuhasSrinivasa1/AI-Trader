# retry 4: produce fresh-install signed standalone APK
name: NSE Unified Scanner v3.1.0 Quality Momentum Fresh Signed
on:
  push:
    branches: [nse-unified-scanner-v3.1.0-quality-cash]
    paths: ['.github/workflows/unified-scanner-build-v310.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Publish run id early
        run: |
          echo "${GITHUB_RUN_ID}" > .scanner-v3.1.0-run-id.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .scanner-v3.1.0-run-id.txt
          git commit -m "Record NSE scanner v3.1.0 fresh-signed build run ${GITHUB_RUN_ID}" || true
          git push origin HEAD:nse-unified-scanner-v3.1.0-quality-cash || true

      - name: Reconstruct v3 production baseline
        run: |
          set +e
          python .github/scripts/scanner_v12_patch.py > /tmp/v12patch.log 2>&1
          set -e
          cat /tmp/v12patch.log
          python .github/scripts/scanner_v12_tail.py
          set +e
          python .github/scripts/scanner_v13_patch.py > /tmp/v13patch.log 2>&1
          set -e
          cat /tmp/v13patch.log
          python .github/scripts/scanner_v13_tail.py
          python .github/scripts/scanner_v14_patch.py
          python .github/scripts/scanner_v15_patch.py
          set +e
          python .github/scripts/scanner_v16_patch.py > /tmp/v16patch.log 2>&1
          set -e
          cat /tmp/v16patch.log
          python .github/scripts/scanner_v16_tail.py
          python .github/scripts/scanner_v16_ui_fix.py
          python .github/scripts/scanner_v161_patch.py
          python .github/scripts/scanner_v162_patch.py
          python .github/scripts/scanner_v163_patch.py
          python .github/scripts/scanner_v164_patch.py
          python .github/scripts/scanner_v165_patch.py
          python .github/scripts/scanner_v20_patch.py
          python .github/scripts/scanner_v20_compile_fix.py
          python .github/scripts/scanner_v300_patch.py
          python .github/scripts/scanner_v300_compile_fix.py

      - name: Apply v3.1.0 Quality Momentum / Cash EQ patch
        run: |
          cat .github/scripts/v310_payload/part* | base64 -d | gzip -dc > /tmp/scanner_v310_patch.py
          python /tmp/scanner_v310_patch.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Test lint and build
        run: |
          gradle --no-daemon --console=plain -p unified-scanner clean testDebugUnitTest lintDebug assembleDebug assembleRelease
          mkdir -p unified-scanner/out
          cp unified-scanner/app/build/outputs/apk/release/app-release-unsigned.apk unified-scanner/out/NSE-Unified-Scanner-S24-v3.1.0-QUALITY-MOMENTUM-UNSIGNED.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging unified-scanner/out/NSE-Unified-Scanner-S24-v3.1.0-QUALITY-MOMENTUM-UNSIGNED.apk | grep "versionName='3.1.0'"
          grep -q 'versionCode 310' unified-scanner/app/build.gradle
          grep -q 'QualityMomentumLogic' unified-scanner/app/src/main/java/com/suhas/nseunifiedscanner/ScannerEngine.java
          grep -q 'QUALITY MOMENTUM' unified-scanner/app/src/main/java/com/suhas/nseunifiedscanner/MainActivity.java
          grep -q 'BOX/CHOP' unified-scanner/app/src/main/java/com/suhas/nseunifiedscanner/MainActivity.java

      - name: Generate fresh standalone signing key
        run: |
          set -e
          STORE_PASS='NSEScanner310Fresh!2026'
          KEY_PASS='NSEScanner310Fresh!2026'
          ALIAS='nse-unified-scanner-fresh-v310'
          keytool -genkeypair -v \
            -keystore /tmp/nse-unified-scanner-v310-fresh.jks \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -alias "$ALIAS" \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname "CN=NSE Unified Scanner v3.1.0 Fresh, OU=Private Build, O=Standalone, L=Bengaluru, ST=Karnataka, C=IN"

          $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
            --ks /tmp/nse-unified-scanner-v310-fresh.jks \
            --ks-key-alias "$ALIAS" \
            --ks-pass pass:"$STORE_PASS" \
            --key-pass pass:"$KEY_PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out unified-scanner/out/NSE-Unified-Scanner-S24-v3.1.0-QUALITY-MOMENTUM-FRESH-SIGNED.apk \
            unified-scanner/out/NSE-Unified-Scanner-S24-v3.1.0-QUALITY-MOMENTUM-UNSIGNED.apk

          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs \
            unified-scanner/out/NSE-Unified-Scanner-S24-v3.1.0-QUALITY-MOMENTUM-FRESH-SIGNED.apk \
            > unified-scanner/out/FRESH-SIGNATURE-VERIFICATION.txt

          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' unified-scanner/out/FRESH-SIGNATURE-VERIFICATION.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' unified-scanner/out/FRESH-SIGNATURE-VERIFICATION.txt

          sha256sum unified-scanner/out/NSE-Unified-Scanner-S24-v3.1.0-QUALITY-MOMENTUM-FRESH-SIGNED.apk \
            > unified-scanner/out/FRESH-SIGNED-SHA256.txt

          cp /tmp/nse-unified-scanner-v310-fresh.jks unified-scanner/out/NSE-Unified-Scanner-v3.1.0-FRESH-SIGNING-KEY.jks
          cat > unified-scanner/out/FRESH-SIGNING-README.txt <<'EOF'
NSE Unified Scanner v3.1.0 Fresh Standalone Signing
Alias: nse-unified-scanner-fresh-v310
Keystore password: NSEScanner310Fresh!2026
Key password: NSEScanner310Fresh!2026

This is a NEW signing identity for the fresh-install v3.1.0 application.
Future in-place updates to this fresh installation must use this exact keystore.
It does NOT match the old v3.0.0 signing certificate.
EOF

      - uses: actions/upload-artifact@v4
        with:
          name: NSE-Unified-Scanner-S24-v3.1.0-QUALITY-MOMENTUM-FRESH-SIGNED
          path: |
            unified-scanner/out/NSE-Unified-Scanner-S24-v3.1.0-QUALITY-MOMENTUM-FRESH-SIGNED.apk
            unified-scanner/out/FRESH-SIGNATURE-VERIFICATION.txt
            unified-scanner/out/FRESH-SIGNED-SHA256.txt
            unified-scanner/out/NSE-Unified-Scanner-v3.1.0-FRESH-SIGNING-KEY.jks
            unified-scanner/out/FRESH-SIGNING-README.txt
          retention-days: 30
