name: Global Edge AI Trader v1.0.0 Fresh Signed Build

on:
  push:
    paths:
      - 'fresh-global-edge/v100/**'
      - '.github/workflows/global-edge-v100-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct verified v1.4.4 base and apply fresh Global Edge release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/global-edge-v100
          mkdir -p /tmp/global-edge-v100

          cat android-stable/uc-sentinel-v131-build/source.b64.part00 \
              android-stable/uc-sentinel-v131-build/source.b64.part01 \
              android-stable/uc-sentinel-v131-build/source.b64.part02 \
              android-stable/uc-sentinel-v131-build/source.b64.part03 \
              android-stable/uc-sentinel-v131-build/source.b64.part04 \
              android-stable/uc-sentinel-v131-build/source.b64.part05 \
              android-stable/uc-sentinel-v131-build/source.b64.part06 \
              android-stable/uc-sentinel-v131-build/source.b64.part07 \
            | tr -d '\r\n ' | base64 -d > /tmp/UC-Sentinel-v1.3.1-full-source.zip
          echo 'f6c0aabbf204896125e2a4c7521b997520b84589fb74c3ce8ef63ae26d5d5019  /tmp/UC-Sentinel-v1.3.1-full-source.zip' | sha256sum -c -
          unzip -q /tmp/UC-Sentinel-v1.3.1-full-source.zip -d /tmp/global-edge-v100
          mv /tmp/global-edge-v100/UC-Sentinel-v1.3.1-full-source /tmp/global-edge-v100/UC-Sentinel-v1.3.2-full-source
          cd /tmp/global-edge-v100/UC-Sentinel-v1.3.2-full-source
          patch -p1 --batch < "$GITHUB_WORKSPACE/android-stable/uc-sentinel-v132-build/v131-to-v132.patch"

          cat "$GITHUB_WORKSPACE/android-stable/uc-sentinel-v140-build/v132-to-v140.patch.gz.b64.part00" \
              "$GITHUB_WORKSPACE/android-stable/uc-sentinel-v140-build/v132-to-v140.patch.gz.b64.part01" \
              "$GITHUB_WORKSPACE/android-stable/uc-sentinel-v140-build/v132-to-v140.patch.gz.b64.part02" \
            | tr -d '\r\n ' | base64 -d > /tmp/v132-to-v140.patch.gz
          echo 'd4457813b26d0d01380360dca3ce0434d4aa8217e814870828d97ef13d131dcf  /tmp/v132-to-v140.patch.gz' | sha256sum -c -
          gunzip -c /tmp/v132-to-v140.patch.gz > /tmp/v132-to-v140.patch
          patch -p1 --batch < /tmp/v132-to-v140.patch

          cd /tmp/global-edge-v100
          mv UC-Sentinel-v1.3.2-full-source UC-Sentinel-v1.4.0-full-source
          cd UC-Sentinel-v1.4.0-full-source
          cat "$GITHUB_WORKSPACE/android-stable/uc-sentinel-v141-build/v140-to-v141.patch.gz.b64" | tr -d '\r\n ' | base64 -d > /tmp/v140-to-v141.patch.gz
          echo '36f4b163cb83b79b581652a7687cf169155a9433e1103ce9dca483907a6ed537  /tmp/v140-to-v141.patch.gz' | sha256sum -c -
          gunzip -c /tmp/v140-to-v141.patch.gz > /tmp/v140-to-v141.patch
          patch -p1 --batch < /tmp/v140-to-v141.patch

          cd /tmp/global-edge-v100
          mv UC-Sentinel-v1.4.0-full-source UC-Sentinel-v1.4.1-full-source
          cd UC-Sentinel-v1.4.1-full-source
          cat "$GITHUB_WORKSPACE/android-stable/uc-sentinel-v142-build/v141-to-v142.patch.gz.b64" | tr -d '\r\n ' | base64 -d > /tmp/v141-to-v142.patch.gz
          echo '3c65c34fd89ed1443b7b0460a57a342c7f2439760ef65b9d8fe88709014f0be3  /tmp/v141-to-v142.patch.gz' | sha256sum -c -
          gunzip -c /tmp/v141-to-v142.patch.gz > /tmp/v141-to-v142.patch
          echo 'bd8f631cd01a843a9635a028c9b5588b171b8602f25d3a863ce2793ade6e9242  /tmp/v141-to-v142.patch' | sha256sum -c -
          patch -p3 --batch < /tmp/v141-to-v142.patch

          cd /tmp/global-edge-v100
          mv UC-Sentinel-v1.4.1-full-source UC-Sentinel-v1.4.2-full-source
          cd UC-Sentinel-v1.4.2-full-source
          cat "$GITHUB_WORKSPACE/android-stable/uc-sentinel-v143-build/v142-to-v143.patch.gz.b64" | tr -d '\r\n ' | base64 -d > /tmp/v142-to-v143.patch.gz
          echo '51a25c3ef6a92e231317c1a4b48dcf4ba5ebd7b455c2caf881dab98251953fc6  /tmp/v142-to-v143.patch.gz' | sha256sum -c -
          gunzip -c /tmp/v142-to-v143.patch.gz > /tmp/v142-to-v143.patch
          echo '4cc3426b9ce4a3ae0eff3277d40101b633801eb9ab40b1186c6b1ecad9370a1f  /tmp/v142-to-v143.patch' | sha256sum -c -
          patch -p1 --batch < /tmp/v142-to-v143.patch

          cd /tmp/global-edge-v100
          mv UC-Sentinel-v1.4.2-full-source UC-Sentinel-v1.4.3-full-source
          python "$GITHUB_WORKSPACE/android-stable/uc-sentinel-v144-build/upgrade_v144.py" \
            /tmp/global-edge-v100/UC-Sentinel-v1.4.3-full-source \
            "$GITHUB_WORKSPACE/android-stable/global-lead-mappings-v2.json"
          mv UC-Sentinel-v1.4.3-full-source UC-Sentinel-v1.4.4-full-source
          cd UC-Sentinel-v1.4.4-full-source

          cat "$GITHUB_WORKSPACE/fresh-global-edge/v100/fresh-rel.patch.gz.b64.part00" \
              "$GITHUB_WORKSPACE/fresh-global-edge/v100/fresh-rel.patch.gz.b64.part01" \
            | tr -d '\r\n ' | base64 -d > /tmp/fresh-rel.patch.gz
          echo 'f9c9ff37f828b7d11307ac8d3f7fc497aa5d19e4313cea306da78f4454284f72  /tmp/fresh-rel.patch.gz' | sha256sum -c -
          gunzip -c /tmp/fresh-rel.patch.gz > /tmp/fresh-rel.patch
          echo 'df6b22b62e5416a8f907c2f9bdc388cfb4714e44205e5f47341ead7ff29ad72d  /tmp/fresh-rel.patch' | sha256sum -c -
          patch -p1 --batch < /tmp/fresh-rel.patch

          cd /tmp/global-edge-v100
          mv UC-Sentinel-v1.4.4-full-source Global-Edge-AI-Trader-v1.0.0-source
          SRC=/tmp/global-edge-v100/Global-Edge-AI-Trader-v1.0.0-source
          cd "$SRC"
          grep -q 'applicationId = "com.suhas.globaledgeai"' app/build.gradle.kts
          grep -q 'versionCode = 100' app/build.gradle.kts
          grep -q 'versionName = "1.0.0"' app/build.gradle.kts
          grep -q 'Global Edge AI Trader' app/src/main/AndroidManifest.xml
          grep -q 'Trading Strategies' app/src/main/java/com/suhas/ucsentinel/ui/ScannerScreen.kt
          grep -q 'PD_FVG_SWEEP' app/src/main/java/com/suhas/ucsentinel/domain/engine/TradingStrategyEngine.kt
          python - <<'PY'
          import json
          s=json.load(open('app/src/main/assets/trading_strategy_catalog.json'))
          g=json.load(open('app/src/main/assets/global_lead_mappings.json'))
          assert len(s['strategies']) >= 20, len(s['strategies'])
          assert any(x['kind']=='PD_FVG_SWEEP' for x in s['strategies'])
          assert g['coverage']['indianStocks'] >= 500, g['coverage']
          assert g['coverage']['mappingLinks'] >= 1000, g['coverage']
          print('strategy catalogue', len(s['strategies']))
          print('global coverage', g['coverage'])
          PY
          echo 'Fresh Global Edge AI Trader source verified'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unit tests and release APK
        working-directory: /tmp/global-edge-v100/Global-Edge-AI-Trader-v1.0.0-source
        run: gradle --no-daemon --console=plain clean testDebugUnitTest assembleRelease

      - name: Sign and verify fresh APK
        working-directory: /tmp/global-edge-v100/Global-Edge-AI-Trader-v1.0.0-source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          UNSIGNED=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*release*.apk' | head -n 1)
          test -n "$UNSIGNED"
          test -s "$UNSIGNED"
          KEYSTORE=/tmp/global-edge-v100-release.keystore
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -alias globaledge \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=Global Edge AI Trader, O=Private Research, C=IN'
          OUT=out/Global-Edge-AI-Trader-v1.0.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-pass pass:"$PASS" \
            --key-pass pass:"$PASS" \
            --ks-key-alias globaledge \
            --out "$OUT" "$UNSIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$OUT" | tee out/APK-SIGNATURE-VERIFY.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$OUT" | tee out/APK-BADGING.txt
          grep -q "package: name='com.suhas.globaledgeai'" out/APK-BADGING.txt
          grep -q "versionCode='100'" out/APK-BADGING.txt
          grep -q "versionName='1.0.0'" out/APK-BADGING.txt
          grep -q "application-label:'Global Edge AI Trader'" out/APK-BADGING.txt
          sha256sum "$OUT" | tee out/SHA256.txt
          keytool -list -v -keystore "$KEYSTORE" -storepass "$PASS" -alias globaledge \
            | grep -E 'Owner:|SHA256:' | tee out/SIGNING-CERTIFICATE.txt
          cd ..
          zip -qr Global-Edge-AI-Trader-v1.0.0-source.zip Global-Edge-AI-Trader-v1.0.0-source \
            -x 'Global-Edge-AI-Trader-v1.0.0-source/.gradle/*' \
               'Global-Edge-AI-Trader-v1.0.0-source/app/build/*' \
               'Global-Edge-AI-Trader-v1.0.0-source/build/*' \
               'Global-Edge-AI-Trader-v1.0.0-source/out/*'
          mv Global-Edge-AI-Trader-v1.0.0-source.zip Global-Edge-AI-Trader-v1.0.0-source/out/

      - name: Upload signed APK and source
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Global-Edge-AI-Trader-v1.0.0
          retention-days: 30
          if-no-files-found: error
          path: |
            /tmp/global-edge-v100/Global-Edge-AI-Trader-v1.0.0-source/out/Global-Edge-AI-Trader-v1.0.0.apk
            /tmp/global-edge-v100/Global-Edge-AI-Trader-v1.0.0-source/out/Global-Edge-AI-Trader-v1.0.0-source.zip
            /tmp/global-edge-v100/Global-Edge-AI-Trader-v1.0.0-source/out/APK-SIGNATURE-VERIFY.txt
            /tmp/global-edge-v100/Global-Edge-AI-Trader-v1.0.0-source/out/APK-BADGING.txt
            /tmp/global-edge-v100/Global-Edge-AI-Trader-v1.0.0-source/out/SHA256.txt
            /tmp/global-edge-v100/Global-Edge-AI-Trader-v1.0.0-source/out/SIGNING-CERTIFICATE.txt
