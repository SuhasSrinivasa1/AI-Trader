name: Univest Signing Configuration Inventory
on:
  push:
    branches: [main]
    paths: ['.github/workflows/univest-v220-bootstrap.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: univest-v220-build
          fetch-depth: 0
      - name: Inspect repository history without printing secrets
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          OUT=/tmp/signing-inventory.txt
          {
            echo "Potential signing asset paths in reachable repository history:"
            git rev-list --all --objects | awk '{print $2}' | grep -Ei '(\.jks$|\.keystore$|signing|keystore)' | sort -u || true
            echo
            echo "Workflow files on signed-related branches:"
            for ref in origin/multyfi-v2.4.9-fresh-signed origin/main; do
              echo "REF $ref"
              git ls-tree -r --name-only "$ref" 2>/dev/null | grep '^.github/workflows/' || true
            done
            echo
            echo "Signing environment variable NAMES referenced in reachable workflow history:"
            for ref in origin/multyfi-v2.4.9-fresh-signed origin/main; do
              git grep -h -E 'secrets\.[A-Za-z0-9_]+|RELEASE_[A-Za-z0-9_]+|KEYSTORE_[A-Za-z0-9_]+' "$ref" -- '.github/workflows/*' 2>/dev/null |
                grep -Eo 'secrets\.[A-Za-z0-9_]+|RELEASE_[A-Za-z0-9_]+|KEYSTORE_[A-Za-z0-9_]+' | sort -u || true
            done
          } > "$OUT"
          mkdir -p .build-temp/univest-v220-signing-inspect
          cp "$OUT" .build-temp/univest-v220-signing-inspect/report.txt
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -f .build-temp/univest-v220-signing-inspect/report.txt
          git commit -m "Record safe signing configuration inventory" || exit 0
          git pull --rebase origin univest-v220-build
          git push origin HEAD:univest-v220-build
