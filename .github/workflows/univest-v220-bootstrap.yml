name: Univest AutoTrade v2.8.4 Release Build Bootstrap
on:
  push:
    branches: [main]
    paths: ['.github/workflows/univest-v220-bootstrap.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: univest-v230-research-lab
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate v2.8.4 pre-market, green-exit and durable-history contract
        shell: bash
        run: |
          set -euo pipefail
          SRC=.build-temp/univest-v220-work/source
          grep -q "versionCode 284" "$SRC/app/build.gradle"
          grep -q "versionName '2.8.4'" "$SRC/app/build.gradle"
          grep -q 'com.univest.capp' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/MultyfiNotificationService.java"
          grep -q 'DURATION_MONTHS' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/UnivestParser.java"
          grep -q 'DurableOfficialSignalQueue.enqueueAndDispatch' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/MultyfiNotificationService.java"
          grep -q 'OFFICIAL_MARKETABLE_LIMIT_BUFFER_PCT = 0.02' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/GrowwClient.java"
          grep -q 'placeUnivestCncGreenSell' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/UnivestManager.java"
          grep -q 'EXIT_DEFERRED_NOT_GREEN' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/UnivestManager.java"
          grep -q 'UNIVEST_EXIT_EXTERNAL_OR_MANUAL_HOLDING' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/UnivestManager.java"
          grep -q 'greenSellPlan' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/GrowwClient.java"
          grep -q 'getFastExitSnapshot' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/GrowwClient.java"
          grep -q 'DeferredGreenExitWatcher.start' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/UnivestManager.java"
          grep -q 'class PreMarketReadiness' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/PreMarketReadiness.java"
          grep -q 'JOB_WARMUP = 23033' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/PreMarketReadinessScheduler.java"
          grep -q 'JOB_FINAL = 23034' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/PreMarketReadinessScheduler.java"
          grep -q 'PreMarketReadinessJobService' "$SRC/app/src/main/AndroidManifest.xml"
          grep -q 'extends SQLiteOpenHelper' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/UnivestHistoryDb.java"
          grep -q 'UNIVEST_PORTABLE_HISTORY' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/HistoryBackupManager.java"
          grep -q 'containsCredentials' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/HistoryBackupManager.java"
          grep -q 'RESTORE / RECONNECT HISTORY BACKUP' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/DashboardActivity.java"
          grep -q 'UnivestStrategyStudy.runNightly' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/ResearchOrchestrator.java"
          grep -q 'NIGHTLY UNIVEST STRATEGY STUDY' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/DashboardActivity.java"
          grep -q 'GreenOfficialExitTest' "$SRC/app/src/test/java/com/suhas/multyfideliverybuy/GreenOfficialExitTest.java"
          grep -q 'REQUEST_IGNORE_BATTERY_OPTIMIZATIONS' "$SRC/app/src/main/AndroidManifest.xml"
          grep -q 'VIVO / FUNTOUCH RELIABILITY' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/DashboardActivity.java"
          grep -q 'getFD().sync' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/DurableOfficialSignalQueue.java"
          grep -q 'ATOMIC_MOVE' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/DurableOfficialSignalQueue.java"
          git diff --exit-code 6af50076dfdfc460ee288ee7d1c43d86db687c91 HEAD -- \
            "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/UnivestParser.java" \
            "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/UnivestStateStore.java"
      - name: Unit tests and release build
        working-directory: .build-temp/univest-v220-work/source
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain clean testReleaseUnitTest assembleRelease | tee ../../test-results.txt
      - name: Prepare editable source ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cd .build-temp/univest-v220-work/source
          zip -qr ../../../release/Univest-AutoTrade-v2.8.4-source.zip . -x '*/build/*' '.gradle/*' '*.jks' '*.keystore' '*credentials.env'
      - name: Generate new signing identity and sign APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find .build-temp/univest-v220-work/source/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -1)"
          test -n "$APK" && test -s "$APK"
          PASS="$(openssl rand -hex 24)"
          KS="$RUNNER_TEMP/univest-v230-release.jks"
          keytool -genkeypair -v             -keystore "$KS"             -storepass "$PASS"             -keypass "$PASS"             -alias univest-v220             -keyalg RSA -keysize 4096 -validity 10000             -dname 'CN=Univest AutoTrade v2.8.4, OU=Private Release, O=Univest AutoTrade, L=Bengaluru, ST=Karnataka, C=IN'
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign             --ks "$KS"             --ks-pass "pass:$PASS"             --ks-key-alias univest-v220             --key-pass "pass:$PASS"             --v1-signing-enabled true             --v2-signing-enabled true             --v3-signing-enabled true             --out release/Univest-AutoTrade-v2.8.4-SIGNED.apk             "$RUNNER_TEMP/aligned.apk"
          rm -f "$KS"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs release/Univest-AutoTrade-v2.8.4-SIGNED.apk | tee release/APK-SIGNATURE.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging release/Univest-AutoTrade-v2.8.4-SIGNED.apk | tee release/APK-BADGING.txt
          grep -q "package: name='com.suhas.multyfideliverybuy'" release/APK-BADGING.txt
          grep -q "versionCode='284'" release/APK-BADGING.txt
          grep -q "versionName='2.8.4'" release/APK-BADGING.txt
          sha256sum release/Univest-AutoTrade-v2.8.4-SIGNED.apk | tee release/APK-SHA256.txt
          cp .build-temp/test-results.txt release/test-results.txt
          unzip -t release/Univest-AutoTrade-v2.8.4-source.zip >/dev/null
      - name: Build report
        shell: bash
        run: |
          set -euo pipefail
          CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' release/APK-SIGNATURE.txt | head -1)"
          {
            echo "Univest AutoTrade v2.8.4 build: SUCCESS"
            echo "package=com.suhas.multyfideliverybuy"
            echo "versionCode=284"
            echo "versionName=2.8.4"
            echo "source=com.univest.capp only"
            echo "product=NSE CASH / CNC DELIVERY"
            echo "notification_duplicate_execution_gate=removed"
            echo "initial_entry_budget=user configurable INR 0-100000, default INR 20000"
            echo "back_in_range_flat=uses configured initial-entry budget"
            echo "back_in_range_held=uses configured shared re-entry/averaging budget"
            echo "averaging=uses same configured shared budget at -2/-4/-6 percent, max 3, initial fill anchor"
            echo "budget_step=INR 1000"
            echo "budget_change_safety=AutoTrade disarms when slider value changes"
            echo "exit=official exact-symbol EXIT applies to any actual Groww CNC holding, including manual/external holdings; averaging is cancelled first"
            echo "exit_green_guard=sell only when live executable bid/LTP is at least one tick above broker average buy price; order limit never goes below the green floor"
            echo "exit_deferred=red/unknown-price official exits remain EXITING_OFFICIAL and are watched/reconciled until green or broker flat"
            echo "research_scan=entire eligible NSE CASH universe off-market"
            echo "research_forecast=frozen snapshots with live 15-minute monitoring"
            echo "research_accuracy=daily and lifetime >=0.5 percent estimated net win accounting"
            echo "research_entry=notification plus manual BUY or optional Research AutoTrade"
            echo "research_exit=dynamic profitable weakening exit; negative positions are not panic-closed"
            echo "research_dual_confirmation=Research pre-entry plus later Univest ENTRY is intentionally additive"
            echo "research_fundamentals=current build marks unavailable fundamentals as UNKNOWN_NOT_CONNECTED, never fabricated"
            echo "official_univest_execution=v2.6 trading semantics preserved; v2.8 adds per-symbol ordering and fail-closed conflicting-sell reconciliation"
            echo "research_orchestration=holiday-aware post-close replay + full EOD NSE scan + nightly observable Univest strategy study -> preopen freeze -> live monitor"
            echo "premarket_readiness=08:25 IST warm-up plus 08:55 IST final check for notification listener, static IP, Groww auth, durable queue, instrument map and broker reconciliation"
            echo "history_db=SQLite event ledger mirrors diagnostics and imports legacy JSONL history"
            echo "portable_history=user-owned SAF ZIP contains history/state/research/diagnostics without Groww credentials; can be re-selected after uninstall/new-signature install"
            echo "research_calendar=embedded official NSE equity holidays for 2026"
            echo "research_data=tiered full-NSE daily, top-50 15-minute, top-10/live one-minute, official event windows"
            echo "research_event_learning=pre-event state plus anchored VWAP plus MFE/MAE/time-to-peak"
            echo "research_market_context=actual NSE NIFTY index via Groww; sector context remains explicitly unavailable"
            echo "research_strategy_version=R2.8-1"
            echo "research_failure_learning=repeated failure clusters trigger Challenger review only"
            echo "research_capital_governor=absolute committed Research cap includes initial live entries plus active/filled averaging commitments"
            echo "research_data_quality=explicit confidence and missing-data flags"
            echo "research_causality=official learning daily features cut off before signal day; post-event fields separated as outcomes"
            echo "research_execution=reconciles late fills, GTT averaging and pending exits before broker actions"
            echo "research_liquidity=live quote spread/offer/circuit gates for automatic Research buys"
            echo "research_accuracy=fixed-horizon evidence plus precision/recall against future official Univest entries"
            echo "credential_storage=Android Keystore AES/GCM with lazy plaintext migration"
            echo "minute_store=schema v2 deduplicated by symbol/timestamp/source"
            echo "historical_timestamp_parser=epoch seconds, epoch milliseconds and timestamp strings"
            echo "charge_model=GROWW_NSE_DELIVERY_2026_10_03"
            echo "device_profile=Vivo Y73 / Funtouch OS reliability hardening"
            echo "device_reliability=battery-optimization exemption, Vivo autostart/background shortcuts, notification-listener heartbeat and rebind"
            echo "official_signal_delivery=fsync + atomic persistent queue before async execution; recovered on listener reconnect, boot, app resume and persisted JobScheduler"
            echo "official_signal_replay_safety=broker truth + deterministic Groww references; same concrete notification ID only, later genuine notifications remain distinct"
            echo "research_event_capture=duplicate event-window requests throttled independently from official execution"
            echo "circuit_guard=official BUY/REENTRY use aggressive circuit-safe DAY LIMIT when circuit data is available; official green EXIT always uses a protected LIMIT floor above broker average and remains circuit-bounded"
            echo "circuit_guard_buffer=2 percent from executable quote, clamped inside upper/lower circuit and tick-rounded"
            echo "budget_guard=official BUY quantity sized using the circuit-safe limit so worst-case fill remains within configured entry/re-entry budget"
            echo "terminal_rejection_detection=Groww accepted-then-REJECTED/FAILED/CANCELLED order states are treated as failures, not pending fills"
            echo "official_exit_recovery=EXITING_OFFICIAL remains broker-truth recoverable; rejected/pending/red exits retry through in-process 15-second green watcher plus persisted recovery job"
            echo "trading_core_change=official parser semantics, budgets, back-in-range rules and -2/-4/-6 averaging ladder unchanged versus successful v2.8.2"
            echo "signing_certificate_sha256=$CERT"
            echo "signing_identity=new ephemeral identity authorized by user"
          } > release/Univest-AutoTrade-v2.8.4-build-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Univest-AutoTrade-v2.8.4-FINAL
          retention-days: 14
          path: release/*
          if-no-files-found: error
