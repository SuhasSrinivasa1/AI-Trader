name: Univest AutoTrade v2.7.0 Release Build Bootstrap
on:
  push:
    branches: [main]
    paths: ['.github/workflows/univest-v220-bootstrap.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: univest-v230-research-lab
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate v2.7.0 orchestration and stable Univest contract
        shell: bash
        run: |
          set -euo pipefail
          SRC=.build-temp/univest-v220-work/source
          grep -q "versionCode 270" "$SRC/app/build.gradle"
          grep -q "versionName '2.6.0'" "$SRC/app/build.gradle"
          grep -R -q 'com.univest.capp' "$SRC/app/src/main/java"
          grep -R -q 'ENTRY_BUDGET = 20000' "$SRC/app/src/main/java"
          grep -R -q 'REENTRY_BUDGET = 5000' "$SRC/app/src/main/java"
          grep -q 'UNIVEST_BUDGET_MAX = 100000' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/AppPrefs.java"
          grep -q 'getUnivestAddBudget' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/AppPrefs.java"
          grep -q 'RE-ENTRY + AVERAGING BUDGET' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/DashboardActivity.java"
          grep -q 'SeekBar' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/DashboardActivity.java"
          grep -q 'chooseBackInRangeBudget' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/UnivestManager.java"
          grep -q 'averageBudget = AppPrefs.getUnivestAddBudget' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/UnivestManager.java"
          grep -q 'ResearchTradeEngine' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/DashboardActivity.java"
          grep -q 'RESEARCH AUTOTRADE — REAL MONEY' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/DashboardActivity.java"
          grep -q 'RESEARCH ACCURACY' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/DashboardActivity.java"
          grep -q 'scanEntireNse' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/ResearchEngine.java"
          ! grep -q 'SCAN_SIZE=60' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/ResearchEngine.java"
          grep -q 'MIN_NET_WIN_PCT = 0.50' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/ResearchTradeEngine.java"
          grep -q 'RESEARCH_PREENTRY_UNIVEST_CONFIRMED' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/UnivestManager.java"
          grep -q 'ResearchMonitorJobService' "$SRC/app/src/main/AndroidManifest.xml"
          grep -q 'appendForecastSnapshot' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/ResearchStore.java"
          grep -R -q 'MAX_AVERAGE_LEVELS = 3' "$SRC/app/src/main/java"
          ! grep -R -q 'ANDROID_NOTIFICATION_DUPLICATE_SUPPRESSED' "$SRC/app/src/main/java"
          grep -R -q 'budgetForBackInRange' "$SRC/app/src/main/java"
          grep -R -q 'LIVE ORDERS ENABLED' "$SRC/app/src/main/java"
          grep -q 'DashboardActivity' "$SRC/app/src/main/AndroidManifest.xml"
          grep -q 'android.permission.ACCESS_NETWORK_STATE' "$SRC/app/src/main/AndroidManifest.xml"
          grep -q 'Univest' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/DashboardActivity.java"
          grep -q 'Strategy' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/DashboardActivity.java"
          grep -q 'Forecast' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/DashboardActivity.java"
          grep -q 'SETTINGS' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/DashboardActivity.java"
          ! grep -q 'startActivity(new Intent(this, MainActivity.class))' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/DashboardActivity.java"
          grep -q 'JOB_NON_PERSISTED' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/ResearchScheduler.java"
          grep -q 'RESULT_FAILURE' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/ResearchScheduler.java"
          grep -q 'REPAIR / RESCHEDULE RESEARCH' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/DashboardActivity.java"
          grep -q 'SYNC BROKER STATUS' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/DashboardActivity.java"
          grep -q 'MANAGE EXECUTION SETTINGS' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/DashboardActivity.java"
          grep -q 'ic_settings_nav' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/DashboardActivity.java"
          ! grep -q 'iconButton' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/DashboardActivity.java"
          ! grep -q 'handler.postDelayed' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/DashboardActivity.java"
          # The proven v2.6 official Univest notification BUY/REENTRY/AVERAGING/EXIT implementation must remain byte-for-byte unchanged.
          git diff --exit-code 01c956ac7b098a4982185766beb4d39143105b36 HEAD -- \
            "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/MultyfiNotificationService.java" \
            "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/UnivestManager.java"
          grep -q 'class ResearchOrchestrator' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/ResearchOrchestrator.java"
          grep -q 'Mahatma Gandhi Jayanti' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/NseTradingCalendar.java"
          grep -q 'PREOPEN_FROZEN' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/ResearchOrchestrator.java"
          grep -q 'POST_CLOSE_REPLAY' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/ResearchOrchestrator.java"
          grep -q 'captureDeepShortlist' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/ResearchEventStore.java"
          grep -q 'anchoredVwap' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/ResearchEventMath.java"
          grep -q 'dataConfidence' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/ResearchDataQuality.java"
          grep -q 'NIFTYBEES_PROXY' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/ResearchMarketContext.java"
          grep -q 'failureClustersText' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/ResearchTradeEngine.java"
          grep -q 'Research capital limit' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/ResearchTradeEngine.java"
          grep -q 'EXIT_READY' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/ResearchTradeEngine.java"
          grep -q 'strategyVersion' "$SRC/app/src/main/java/com/suhas/multyfideliverybuy/ResearchEngine.java"
      - name: Unit tests and release build
        working-directory: .build-temp/univest-v220-work/source
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain clean testReleaseUnitTest assembleRelease | tee ../../test-results.txt
      - name: Prepare editable source ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cd .build-temp/univest-v220-work/source
          zip -qr ../../../release/Univest-AutoTrade-v2.7.0-source.zip . -x '*/build/*' '.gradle/*' '*.jks' '*.keystore' '*credentials.env'
      - name: Generate new signing identity and sign APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find .build-temp/univest-v220-work/source/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -1)"
          test -n "$APK" && test -s "$APK"
          PASS="$(openssl rand -hex 24)"
          KS="$RUNNER_TEMP/univest-v230-release.jks"
          keytool -genkeypair -v             -keystore "$KS"             -storepass "$PASS"             -keypass "$PASS"             -alias univest-v220             -keyalg RSA -keysize 4096 -validity 10000             -dname 'CN=Univest AutoTrade v2.7.0, OU=Private Release, O=Univest AutoTrade, L=Bengaluru, ST=Karnataka, C=IN'
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign             --ks "$KS"             --ks-pass "pass:$PASS"             --ks-key-alias univest-v220             --key-pass "pass:$PASS"             --v1-signing-enabled true             --v2-signing-enabled true             --v3-signing-enabled true             --out release/Univest-AutoTrade-v2.7.0-SIGNED.apk             "$RUNNER_TEMP/aligned.apk"
          rm -f "$KS"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs release/Univest-AutoTrade-v2.7.0-SIGNED.apk | tee release/APK-SIGNATURE.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging release/Univest-AutoTrade-v2.7.0-SIGNED.apk | tee release/APK-BADGING.txt
          grep -q "package: name='com.suhas.multyfideliverybuy'" release/APK-BADGING.txt
          grep -q "versionCode='270'" release/APK-BADGING.txt
          grep -q "versionName='2.6.0'" release/APK-BADGING.txt
          sha256sum release/Univest-AutoTrade-v2.7.0-SIGNED.apk | tee release/APK-SHA256.txt
          cp .build-temp/test-results.txt release/test-results.txt
          unzip -t release/Univest-AutoTrade-v2.7.0-source.zip >/dev/null
      - name: Build report
        shell: bash
        run: |
          set -euo pipefail
          CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' release/APK-SIGNATURE.txt | head -1)"
          {
            echo "Univest AutoTrade v2.7.0 build: SUCCESS"
            echo "package=com.suhas.multyfideliverybuy"
            echo "versionCode=270"
            echo "versionName=2.6.0"
            echo "source=com.univest.capp only"
            echo "product=NSE CASH / CNC DELIVERY"
            echo "notification_duplicate_execution_gate=removed"
            echo "initial_entry_budget=user configurable INR 0-100000, default INR 20000"
            echo "back_in_range_flat=uses configured initial-entry budget"
            echo "back_in_range_held=uses configured shared re-entry/averaging budget"
            echo "averaging=uses same configured shared budget at -2/-4/-6 percent, max 3, initial fill anchor"
            echo "budget_step=INR 1000"
            echo "budget_change_safety=AutoTrade disarms when slider value changes"
            echo "exit=cancel averaging then sell actual broker CNC holding"
            echo "research_scan=entire eligible NSE CASH universe off-market"
            echo "research_forecast=frozen snapshots with live 15-minute monitoring"
            echo "research_accuracy=daily and lifetime >=0.5 percent estimated net win accounting"
            echo "research_entry=notification plus manual BUY or optional Research AutoTrade"
            echo "research_exit=dynamic profitable weakening exit; negative positions are not panic-closed"
            echo "research_dual_confirmation=Research pre-entry plus later Univest ENTRY is intentionally additive"
            echo "research_fundamentals=current build marks unavailable fundamentals as UNKNOWN_NOT_CONNECTED, never fabricated"
            echo "official_univest_execution=v2.6 proven notification BUY/REENTRY/AVERAGING/EXIT files unchanged"
            echo "research_orchestration=holiday-aware EOD scan -> preopen freeze -> live monitor -> post-close replay"
            echo "research_calendar=embedded official NSE equity holidays for 2026"
            echo "research_data=tiered full-NSE daily, top-50 15-minute, top-10/live one-minute, official event windows"
            echo "research_event_learning=pre-event state plus anchored VWAP plus MFE/MAE/time-to-peak"
            echo "research_market_context=NIFTYBEES explicit broad-market proxy; sector context remains marked unavailable"
            echo "research_strategy_version=R2.7-1"
            echo "research_failure_learning=repeated failure clusters trigger Challenger review only"
            echo "research_capital_governor=max Research live positions plus total Research capital cap"
            echo "research_data_quality=explicit confidence and missing-data flags"
            echo "signing_certificate_sha256=$CERT"
            echo "signing_identity=new ephemeral identity authorized by user"
          } > release/Univest-AutoTrade-v2.7.0-build-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Univest-AutoTrade-v2.7.0-FINAL
          retention-days: 14
          path: release/*
          if-no-files-found: error
