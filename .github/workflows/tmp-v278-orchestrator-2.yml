name: TEMP v2.7.8 Build Orchestrator 2

# kick retry after workflow became active on default branch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-v278-orchestrator-2.yml'

permissions:
  actions: write
  contents: write

jobs:
  dispatch-and-capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Dispatch v2.7.8 branch build and capture run id
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPO='SuhasSrinivasa1/AI-Trader'
          WF='multyfi-v278-zero-buffer-reentry-stable.yml'
          BR='multyfi-v2.7.4-final-stable'
          BEFORE=$(gh run list --repo "$REPO" --workflow "$WF" --branch "$BR" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')
          gh workflow run "$WF" --repo "$REPO" --ref "$BR"
          RID=''
          for i in $(seq 1 40); do
            CAND=$(gh run list --repo "$REPO" --workflow "$WF" --branch "$BR" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            if [ -n "$CAND" ] && [ "$CAND" != "$BEFORE" ]; then RID="$CAND"; break; fi
            sleep 2
          done
          test -n "$RID"
          set +e
          gh run watch "$RID" --repo "$REPO" --exit-status
          WATCH_RC=$?
          set -e
          CONCLUSION=$(gh run view "$RID" --repo "$REPO" --json conclusion --jq '.conclusion')
          HEAD_SHA=$(gh run view "$RID" --repo "$REPO" --json headSha --jq '.headSha')
          mkdir -p ci-status
          printf 'run_id=%s\nconclusion=%s\nhead_sha=%s\nwatch_rc=%s\n' "$RID" "$CONCLUSION" "$HEAD_SHA" "$WATCH_RC" > ci-status/v278-last-run-2.txt
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add ci-status/v278-last-run-2.txt
          git commit -m 'TEMP record v2.7.8 retry2 run [skip ci]' || true
          git push origin HEAD:main
