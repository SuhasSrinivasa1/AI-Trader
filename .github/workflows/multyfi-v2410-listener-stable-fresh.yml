name: Multyfi v2.4.10 LISTENER STABLE FRESH SIGNED APK

on:
  push:
    branches: [multyfi-v2.4.10-listener-stable-fresh]
  workflow_dispatch:

jobs:
  build-sign-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Apply validated v2.4.9 plus v2.4.10 listener stability fix
        shell: bash
        run: |
          set -euo pipefail
          python3 hotfix/run_v2410_listener_stable_fresh.py | tee apply-v2410.log

      - name: Build test lint release
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --console=plain -p android-stable \
            :app:testDebugUnitTest :app:lintDebug :app:assembleRelease \
            | tee build-v2410.log

      - name: Verify v2.4.10 contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q "applicationId 'com.suhas.multyfiautobuy.v2410fresh'" android-stable/app/build.gradle
          grep -q 'versionCode 250' android-stable/app/build.gradle
          grep -q "versionName '2.4.10'" android-stable/app/build.gradle
          grep -q 'Multyfi AutoBuy 2.4.10' android-stable/app/src/main/res/values/strings.xml
          M=android-stable/app/src/main/java/com/suhas/multyfiautobuy/stable
          H="$M/NotificationListenerHealth.java"
          A="$M/ProductionActivity.java"
          R="$M/AppRuntimeControl.java"
          S="$M/ProductionNotificationService.java"
          MON="$M/StrategyMonitorService.java"
          grep -q 'if (connected) return;' "$H"
          grep -q 'NotificationListenerHealth.ensureBound(this);' "$A"
          grep -q 'NotificationListenerHealth.ensureBound(c);' "$R"
          grep -q 'NotificationListenerHealth.markDisconnected();' "$S"
          grep -q 'NotificationListenerHealth.requestRebindNow(this);' "$S"
          grep -q 'NotificationListenerHealth.ensureBound(this)' "$MON"
          grep -q 'GrowwClient.placeEarlyExitMarketSell' "$S"
          grep -q 'Groww MARKET SELL was called before audit logging.' "$S"
          grep -q 'IntradayProtectionPolicy.multyfiStopHit' "$MON"
          grep -q 'IntradayProtectionPolicy.targetHit' "$MON"
          grep -q 'STALE EARLY EXIT CLEARED — GROWW FLAT' "$S"
          python3 - <<'PY'
          from pathlib import Path
          h=Path('android-stable/app/src/main/java/com/suhas/multyfiautobuy/stable/NotificationListenerHealth.java').read_text()
          start=h.index('static void requestRebindNow')
          end=h.index('static boolean ensureBound', start)
          method=h[start:end]
          assert 'connected = false' not in method, method
          a=Path('android-stable/app/src/main/java/com/suhas/multyfiautobuy/stable/ProductionActivity.java').read_text()
          rs=a[a.index('protected void onResume()'):a.index('protected void onDestroy()')]
          assert 'requestRebindNow' not in rs, rs
          r=Path('android-stable/app/src/main/java/com/suhas/multyfiautobuy/stable/AppRuntimeControl.java').read_text()
          activate=r[r.index('static void activate'):r.index('static void deactivate')]
          assert 'requestRebindNow' not in activate, activate
          s=Path('android-stable/app/src/main/java/com/suhas/multyfiautobuy/stable/ProductionNotificationService.java').read_text()
          sell=s.index('GrowwClient.ApiResult sell = GrowwClient.placeEarlyExitMarketSell(')
          sell_log=s.index('logBackground("MULTYFI EARLY EXIT API DISPATCH"', sell)
          assert sell < sell_log
          PY

      - name: Generate one-time signing key and sign APK
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/multyfi-v2410-fresh.jks"
          PASS='MultyfiV2410Fresh_2026!'
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -alias multyfi-v2410-fresh \
            -keyalg RSA -keysize 4096 -validity 3650 \
            -dname 'CN=Multyfi AutoBuy v2.4.10 Fresh, OU=Private Build, O=Multyfi AutoBuy, L=Bengaluru, ST=Karnataka, C=IN'
          UNSIGNED=$(find android-stable/app/build/outputs/apk/release -maxdepth 1 -type f -name '*unsigned*.apk' | head -n1)
          test -n "$UNSIGNED"
          OUTDIR=android-stable/v2410-fresh-signed
          mkdir -p "$OUTDIR"
          ALIGNED="$OUTDIR/Multyfi-AutoBuy-v2.4.10-FRESH-ALIGNED.apk"
          FINAL="$OUTDIR/Multyfi-AutoBuy-v2.4.10-LISTENER-STABLE-FRESH-SIGNED.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias multyfi-v2410-fresh \
            --ks-pass "pass:$PASS" \
            --key-pass "pass:$PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$FINAL" "$ALIGNED"
          rm -f "$ALIGNED" "$KEYSTORE"

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          FINAL=android-stable/v2410-fresh-signed/Multyfi-AutoBuy-v2.4.10-LISTENER-STABLE-FRESH-SIGNED.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$FINAL" | tee android-stable/v2410-fresh-signed/SIGNATURE-VERIFY.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$FINAL" | tee android-stable/v2410-fresh-signed/BADGING.txt
          grep -q "package: name='com.suhas.multyfiautobuy.v2410fresh'" android-stable/v2410-fresh-signed/BADGING.txt
          grep -q "versionCode='250'" android-stable/v2410-fresh-signed/BADGING.txt
          grep -q "versionName='2.4.10'" android-stable/v2410-fresh-signed/BADGING.txt
          grep -q "application-label:'Multyfi AutoBuy 2.4.10'" android-stable/v2410-fresh-signed/BADGING.txt
          sha256sum "$FINAL" | tee android-stable/v2410-fresh-signed/SHA256.txt

      - name: Verify unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root=Path('android-stable/app/build/test-results/testDebugUnitTest')
          tests=failures=errors=0
          for p in root.glob('TEST-*.xml'):
              x=ET.parse(p).getroot()
              tests += int(x.attrib.get('tests',0))
              failures += int(x.attrib.get('failures',0))
              errors += int(x.attrib.get('errors',0))
          print('v2.4.10 listener stable fresh signed', tests, failures, errors)
          assert tests >= 87
          assert failures == 0 and errors == 0
          PY

      - name: Upload signed APK only
        uses: actions/upload-artifact@v4
        with:
          name: Multyfi-AutoBuy-v2.4.10-LISTENER-STABLE-FRESH-SIGNED
          path: android-stable/v2410-fresh-signed/Multyfi-AutoBuy-v2.4.10-LISTENER-STABLE-FRESH-SIGNED.apk
          if-no-files-found: error
