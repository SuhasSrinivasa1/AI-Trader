name: Export generated v2.2.9 source

on:
  push:
    branches:
      - multyfi-v2.3.0-authoritative-early-sell
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Apply v2.2.9 release chain
        run: python3 hotfix/run_v229.py
      - name: Upload generated source
        uses: actions/upload-artifact@v4
        with:
          name: multyfi-v229-generated-source
          path: |
            android-stable/app/src/main/java/com/suhas/multyfiautobuy/stable/
            android-stable/app/src/test/java/com/suhas/multyfiautobuy/stable/
            android-stable/app/build.gradle
          if-no-files-found: error
