name: Build Multyfi AutoBuy S24 v1.6 Android 16

on:
  pull_request:
    branches: [main]
    paths:
      - 'android-stable/**'
      - '.github/workflows/android-build-v1-6.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "emulator" "system-images;android-36;google_apis;x86_64"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply v1.6 source patch
        run: python3 android-stable/apply_v1_6_patch.py

      - name: Unit tests, lint and APK
        shell: bash
        run: |
          set +e
          gradle --no-daemon --console=plain -p android-stable :app:testDebugUnitTest :app:lintDebug :app:assembleDebug > android-v1.6-build.log 2>&1
          echo $? > android-v1.6-build-exit-code.txt
          exit 0
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Multyfi-AutoBuy-S24-v1.6-build-diagnostics
          path: |
            android-v1.6-build.log
            android-v1.6-build-exit-code.txt
          if-no-files-found: error
      - name: Stop if compilation failed
        run: test "$(cat android-v1.6-build-exit-code.txt)" = "0"

      - name: Verify v1.6 autonomous source contract
        shell: bash
        run: |
          CLIENT=android-stable/app/src/main/java/com/suhas/multyfiautobuy/stable/GrowwClient.java
          LISTENER=android-stable/app/src/main/java/com/suhas/multyfiautobuy/stable/MultyfiNotificationService.java
          PREFS=android-stable/app/src/main/java/com/suhas/multyfiautobuy/stable/AppPrefs.java
          POLICY=android-stable/app/src/main/java/com/suhas/multyfiautobuy/stable/EntryPolicy.java
          MAIN=android-stable/app/src/main/java/com/suhas/multyfiautobuy/stable/MainActivity.java
          LAYOUT=android-stable/app/src/main/res/layout/activity_main.xml
          grep -q 'DEFAULT_EARLY_START_MINUTE = 9 \* 60' "$PREFS"
          grep -q 'DEFAULT_EARLY_END_MINUTE = 10 \* 60' "$PREFS"
          grep -q 'DEFAULT_LATE_QUANTITY = 10' "$PREFS"
          grep -q 'DEFAULT_LATE_CALLS_ENABLED = false' "$PREFS"
          grep -q 'createImmediateEntryLimit' "$CLIENT"
          grep -q 'createEntryGttWithLimitFallback' "$CLIENT"
          grep -q 'EARLY_WINDOW_DIRECT_LIMIT' "$LISTENER"
          grep -q 'POST_WINDOW_FIXED_QUANTITY' "$LISTENER"
          grep -q 'isInWindow' "$POLICY"
          grep -q 'lateCallsEnabled' "$MAIN"
          grep -q 'earlyStartInput' "$LAYOUT"
          grep -q 'lateQuantityInput' "$LAYOUT"
          grep -q 'TOTP_SECRET' "$MAIN"
          grep -q 'expectedIpInput' "$MAIN"
          ! grep -q 'child_legs' "$CLIENT"

      - name: Verify APK signature
        run: $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs android-stable/app/build/outputs/apk/debug/app-debug.apk
      - name: Rename APK
        run: cp android-stable/app/build/outputs/apk/debug/app-debug.apk android-stable/app/build/outputs/apk/debug/Multyfi-AutoBuy-S24-TimeWindow-v1.6.0.apk

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Android 16 install and startup acceptance
        timeout-minutes: 12
        shell: bash
        run: |
          set +e
          OUT=android-stable/app/build/outputs/apk/debug
          mkdir -p "$OUT"
          : > "$OUT/acceptance-api36-v1.6.log"
          : > "$OUT/emulator-api36-v1.6.log"
          code=0
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd-v16"
          export ANDROID_SDK_HOME="$RUNNER_TEMP/android-sdk-home-v16"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_SDK_HOME/.android"
          AVD_PATH="$ANDROID_AVD_HOME/s24_api36_v16.avd"
          echo no | avdmanager create avd --force --name s24_api36_v16 --package 'system-images;android-36;google_apis;x86_64' --device 'pixel_8_pro' --path "$AVD_PATH" >> "$OUT/acceptance-api36-v1.6.log" 2>&1 || code=1
          "$ANDROID_HOME/emulator/emulator" -avd s24_api36_v16 -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none > "$OUT/emulator-api36-v1.6.log" 2>&1 &
          EMULATOR_PID=$!
          timeout 180 adb wait-for-device >> "$OUT/acceptance-api36-v1.6.log" 2>&1 || code=1
          booted=0
          if adb get-state >/dev/null 2>&1; then
            for i in $(seq 1 72); do
              state=$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
              if [ "$state" = "1" ]; then booted=1; break; fi
              if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then break; fi
              sleep 5
            done
          fi
          if [ "$booted" != "1" ]; then echo 'Android 16 emulator did not complete boot.' >> "$OUT/acceptance-api36-v1.6.log"; code=1; fi
          if [ "$booted" = "1" ]; then
            timeout 60 adb install -r "$OUT/Multyfi-AutoBuy-S24-TimeWindow-v1.6.0.apk" >> "$OUT/acceptance-api36-v1.6.log" 2>&1 || code=1
            adb logcat -c >> "$OUT/acceptance-api36-v1.6.log" 2>&1
            timeout 30 adb shell am start -W -n com.suhas.multyfiautobuy.stable/.MainActivity >> "$OUT/acceptance-api36-v1.6.log" 2>&1 || code=1
            sleep 8
            adb shell dumpsys activity activities > "$OUT/activity-api36-v1.6.txt" 2>&1
            if ! grep -q 'com.suhas.multyfiautobuy.stable/.MainActivity' "$OUT/activity-api36-v1.6.txt"; then code=1; fi
            adb shell uiautomator dump /sdcard/ui-v16.xml >> "$OUT/acceptance-api36-v1.6.log" 2>&1 || code=1
            adb pull /sdcard/ui-v16.xml "$OUT/ui-api36-v1.6.xml" >> "$OUT/acceptance-api36-v1.6.log" 2>&1 || code=1
            grep -q 'TIME-WINDOW SIZING' "$OUT/ui-api36-v1.6.xml" || code=1
            grep -q 'Early-window target value' "$OUT/ui-api36-v1.6.xml" || code=1
            grep -q 'Post-window fixed quantity' "$OUT/ui-api36-v1.6.xml" || code=1
            adb logcat -d -v threadtime > "$OUT/logcat-api36-v1.6.txt" 2>&1
            if grep -E 'FATAL EXCEPTION|Process: com.suhas.multyfiautobuy.stable|AndroidRuntime.*com.suhas.multyfiautobuy.stable' "$OUT/logcat-api36-v1.6.txt" >> "$OUT/acceptance-api36-v1.6.log"; then code=1; fi
            adb exec-out screencap -p > "$OUT/startup-api36-v1.6.png" 2>> "$OUT/acceptance-api36-v1.6.log"
          else
            touch "$OUT/activity-api36-v1.6.txt" "$OUT/logcat-api36-v1.6.txt" "$OUT/ui-api36-v1.6.xml" "$OUT/startup-api36-v1.6.png"
          fi
          echo "$code" > "$OUT/acceptance-api36-v1.6-exit-code.txt"
          timeout 15 adb emu kill >> "$OUT/acceptance-api36-v1.6.log" 2>&1 || true
          exit 0

      - name: Upload Android 16 acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Multyfi-AutoBuy-S24-TimeWindow-v1.6-acceptance
          path: |
            android-stable/app/build/outputs/apk/debug/acceptance-api36-v1.6.log
            android-stable/app/build/outputs/apk/debug/acceptance-api36-v1.6-exit-code.txt
            android-stable/app/build/outputs/apk/debug/activity-api36-v1.6.txt
            android-stable/app/build/outputs/apk/debug/logcat-api36-v1.6.txt
            android-stable/app/build/outputs/apk/debug/ui-api36-v1.6.xml
            android-stable/app/build/outputs/apk/debug/emulator-api36-v1.6.log
            android-stable/app/build/outputs/apk/debug/startup-api36-v1.6.png
          if-no-files-found: error
      - name: Stop if Android 16 acceptance failed
        run: test "$(cat android-stable/app/build/outputs/apk/debug/acceptance-api36-v1.6-exit-code.txt)" = "0"

      - uses: actions/upload-artifact@v4
        with:
          name: Multyfi-AutoBuy-S24-TimeWindow-v1.6.0
          path: |
            android-stable/app/build/outputs/apk/debug/Multyfi-AutoBuy-S24-TimeWindow-v1.6.0.apk
            android-stable/app/build/outputs/apk/debug/startup-api36-v1.6.png
            android-stable/app/build/reports/tests/testDebugUnitTest/
            android-stable/app/build/reports/lint-results-debug.html
          if-no-files-found: error
