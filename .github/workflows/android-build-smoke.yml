name: Build Multyfi AutoBuy Stable

on:
  pull_request:
    branches: [main]
    paths:
      - 'android-stable/**'
      - '.github/workflows/android-build-smoke.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests, lint and APK
        shell: bash
        run: |
          set +e
          gradle --no-daemon --console=plain -p android-stable :app:testDebugUnitTest :app:lintDebug :app:assembleDebug > android-build.log 2>&1
          echo $? > android-build-exit-code.txt
          exit 0

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Multyfi-AutoBuy-build-diagnostics
          path: |
            android-build.log
            android-build-exit-code.txt
          if-no-files-found: error

      - name: Stop if compilation failed
        shell: bash
        run: test "$(cat android-build-exit-code.txt)" = "0"

      - name: Verify APK signature
        run: $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs android-stable/app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: cp android-stable/app/build/outputs/apk/debug/app-debug.apk android-stable/app/build/outputs/apk/debug/Multyfi-AutoBuy-Stable-v1.1.0.apk

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Emulator install and startup acceptance
        timeout-minutes: 12
        shell: bash
        run: |
          set +e
          OUT=android-stable/app/build/outputs/apk/debug
          mkdir -p "$OUT"
          : > "$OUT/acceptance.log"
          : > "$OUT/emulator.log"
          code=0

          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          export ANDROID_SDK_HOME="$RUNNER_TEMP/android-sdk-home"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_SDK_HOME/.android"
          AVD_PATH="$ANDROID_AVD_HOME/stable_api35.avd"

          echo no | avdmanager create avd --force --name stable_api35 --package 'system-images;android-35;google_apis;x86_64' --device 'pixel_6' --path "$AVD_PATH" >> "$OUT/acceptance.log" 2>&1
          if [ $? -ne 0 ]; then
            echo 'AVD creation failed.' >> "$OUT/acceptance.log"
            code=1
          fi
          echo 'Available AVDs:' >> "$OUT/acceptance.log"
          "$ANDROID_HOME/emulator/emulator" -list-avds >> "$OUT/acceptance.log" 2>&1
          find "$ANDROID_AVD_HOME" -maxdepth 2 -type f -print >> "$OUT/acceptance.log" 2>&1

          "$ANDROID_HOME/emulator/emulator" -avd stable_api35 -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none > "$OUT/emulator.log" 2>&1 &
          EMULATOR_PID=$!
          echo "$EMULATOR_PID" > "$OUT/emulator.pid"

          if ! timeout 180 adb wait-for-device >> "$OUT/acceptance.log" 2>&1; then
            echo 'ADB did not detect the emulator within 180 seconds.' >> "$OUT/acceptance.log"
            code=1
          fi

          booted=0
          if adb get-state >/dev/null 2>&1; then
            for i in $(seq 1 72); do
              state=$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
              if [ "$state" = "1" ]; then
                booted=1
                break
              fi
              if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
                break
              fi
              sleep 5
            done
          fi
          if [ "$booted" != "1" ]; then
            echo 'Emulator did not complete boot.' >> "$OUT/acceptance.log"
            code=1
          fi

          if [ "$booted" = "1" ]; then
            timeout 60 adb install -r "$OUT/Multyfi-AutoBuy-Stable-v1.1.0.apk" >> "$OUT/acceptance.log" 2>&1 || code=1
            adb logcat -c >> "$OUT/acceptance.log" 2>&1
            timeout 30 adb shell am start -W -n com.suhas.multyfiautobuy.stable/.MainActivity >> "$OUT/acceptance.log" 2>&1 || code=1
            sleep 5
            adb shell dumpsys activity activities > "$OUT/activity-dump.txt" 2>&1
            if ! grep -q 'com.suhas.multyfiautobuy.stable/.MainActivity' "$OUT/activity-dump.txt"; then
              echo 'MainActivity is not present in the activity stack.' >> "$OUT/acceptance.log"
              code=1
            fi
            adb logcat -d -v threadtime > "$OUT/logcat.txt" 2>&1
            if grep -E 'FATAL EXCEPTION|Process: com.suhas.multyfiautobuy.stable|AndroidRuntime.*com.suhas.multyfiautobuy.stable' "$OUT/logcat.txt" >> "$OUT/acceptance.log"; then
              echo 'Application crash detected.' >> "$OUT/acceptance.log"
              code=1
            fi
            adb exec-out screencap -p > "$OUT/startup.png" 2>> "$OUT/acceptance.log"
          else
            touch "$OUT/activity-dump.txt" "$OUT/logcat.txt"
          fi

          echo "$code" > "$OUT/acceptance-exit-code.txt"
          timeout 15 adb emu kill >> "$OUT/acceptance.log" 2>&1 || true
          exit 0

      - name: Upload emulator acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Multyfi-AutoBuy-emulator-acceptance
          path: |
            android-stable/app/build/outputs/apk/debug/acceptance.log
            android-stable/app/build/outputs/apk/debug/acceptance-exit-code.txt
            android-stable/app/build/outputs/apk/debug/activity-dump.txt
            android-stable/app/build/outputs/apk/debug/logcat.txt
            android-stable/app/build/outputs/apk/debug/emulator.log
            android-stable/app/build/outputs/apk/debug/startup.png
          if-no-files-found: error

      - name: Stop if emulator acceptance failed
        shell: bash
        run: test "$(cat android-stable/app/build/outputs/apk/debug/acceptance-exit-code.txt)" = "0"

      - uses: actions/upload-artifact@v4
        with:
          name: Multyfi-AutoBuy-Stable-v1.1.0
          path: |
            android-stable/app/build/outputs/apk/debug/Multyfi-AutoBuy-Stable-v1.1.0.apk
            android-stable/app/build/outputs/apk/debug/startup.png
            android-stable/app/build/reports/tests/testDebugUnitTest/
            android-stable/app/build/reports/lint-results-debug.html
          if-no-files-found: error
