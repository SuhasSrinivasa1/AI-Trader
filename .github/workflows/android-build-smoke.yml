name: Export Android Build Environment

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/android-build-smoke.yml'

permissions:
  contents: read

jobs:
  export-env:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android API 35 from preinstalled sdkmanager
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          which sdkmanager
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Warm exact Android and Kotlin plugin caches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/multyfi-warm/app/src/main
          cat >/tmp/multyfi-warm/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "MultyfiWarm"
          include(":app")
          EOF
          cat >/tmp/multyfi-warm/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF
          cat >/tmp/multyfi-warm/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.multyfi.warm"
              compileSdk = 35
              defaultConfig { applicationId = "com.multyfi.warm"; minSdk = 26; targetSdk = 35; versionCode = 1; versionName = "1" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF
          cat >/tmp/multyfi-warm/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:theme="@android:style/Theme.Material.Light.NoActionBar"/></manifest>
          EOF
          gradle --no-daemon --console=plain -p /tmp/multyfi-warm :app:assembleDebug

      - name: Package offline build environment
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/multyfi-offline-env"
          mkdir -p "$OUT"
          GRADLE_REAL="$(readlink -f "$(command -v gradle)")"
          GRADLE_HOME="$(cd "$(dirname "$GRADLE_REAL")/.." && pwd)"
          echo "GRADLE_REAL=$GRADLE_REAL"
          echo "GRADLE_HOME=$GRADLE_HOME"
          cp -a "$GRADLE_HOME" "$OUT/gradle-8.9"
          mkdir -p "$OUT/android-sdk/platforms" "$OUT/android-sdk/build-tools" "$OUT/android-sdk/platform-tools"
          cp -a "$ANDROID_HOME/platforms/android-35" "$OUT/android-sdk/platforms/"
          cp -a "$ANDROID_HOME/build-tools/35.0.0" "$OUT/android-sdk/build-tools/"
          cp -a "$ANDROID_HOME/platform-tools/." "$OUT/android-sdk/platform-tools/"
          cp -a "$HOME/.gradle/caches" "$OUT/gradle-caches"
          if [ -d "$HOME/.gradle/notifications" ]; then cp -a "$HOME/.gradle/notifications" "$OUT/gradle-notifications"; fi
          printf 'JAVA_VERSION=17\nGRADLE_VERSION=8.9\nCOMPILE_SDK=35\nBUILD_TOOLS=35.0.0\nAGP=8.7.3\nKOTLIN=2.0.21\n' > "$OUT/ENV.txt"
          du -sh "$OUT"/*
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/multyfi-android-offline-env.tgz" multyfi-offline-env
          ls -lh "$RUNNER_TEMP/multyfi-android-offline-env.tgz"

      - name: Upload offline environment
        uses: actions/upload-artifact@v4
        with:
          name: multyfi-android-offline-env
          path: ${{ runner.temp }}/multyfi-android-offline-env.tgz
          if-no-files-found: error
          retention-days: 7
