name: Build Multyfi AutoBuy S24 Android 16

on:
  pull_request:
    branches: [main]
    paths:
      - 'android-stable/**'
      - '.github/workflows/android-build-smoke.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools" "emulator" "system-images;android-36;google_apis;x86_64"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Unit tests, lint and APK
        shell: bash
        run: |
          set +e
          gradle --no-daemon --console=plain -p android-stable :app:testDebugUnitTest :app:lintDebug :app:assembleDebug > android-build.log 2>&1
          echo $? > android-build-exit-code.txt
          exit 0
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Multyfi-AutoBuy-S24-v1.6-build-diagnostics
          path: |
            android-build.log
            android-build-exit-code.txt
          if-no-files-found: error
      - name: Stop if compilation failed
        run: test "$(cat android-build-exit-code.txt)" = "0"

      - name: Verify v1.6 autonomous source contract
        shell: bash
        run: |
          CLIENT=android-stable/app/src/main/java/com/suhas/multyfiautobuy/stable/GrowwClient.java
          MONITOR=android-stable/app/src/main/java/com/suhas/multyfiautobuy/stable/StrategyMonitorService.java
          LISTENER=android-stable/app/src/main/java/com/suhas/multyfiautobuy/stable/MultyfiNotificationService.java
          PARSER=android-stable/app/src/main/java/com/suhas/multyfiautobuy/stable/SignalParser.java
          PREFS=android-stable/app/src/main/java/com/suhas/multyfiautobuy/stable/AppPrefs.java
          MAIN=android-stable/app/src/main/java/com/suhas/multyfiautobuy/stable/MainActivity.java
          SAFETY=android-stable/app/src/main/java/com/suhas/multyfiautobuy/stable/RegularOrderSafety.java
          GRADLE=android-stable/app/build.gradle
          grep -q 'targetSdk 36' "$GRADLE"
          grep -q "versionName '1.6.0'" "$GRADLE"
          grep -q 'DEFAULT_WINDOW_1_BUDGET = 10_000d' "$PREFS"
          grep -q 'DEFAULT_WINDOW_2_BUDGET = 10_000d' "$PREFS"
          grep -q 'DEFAULT_WINDOW_3_BUDGET = 5_000d' "$PREFS"
          grep -q '09:00–09:30' "$PREFS"
          grep -q 'forceMis' "$PREFS"
          grep -q 'placeImmediateEntryLimit' "$CLIENT"
          grep -q 'order_type", "LIMIT"' "$CLIENT"
          grep -q 'createStopLossGtt' "$CLIENT"
          grep -q 'placeEarlyExitMarketSell' "$CLIENT"
          grep -q 'ddpi_enabled' "$CLIENT"
          grep -q 'SUBMITTING IMMEDIATE ENTRY' "$LISTENER"
          grep -q 'window.forceMis ? "MIS"' "$LISTENER"
          grep -q 'requestImmediateTick' "$LISTENER"
          grep -q 'entryOrderId' "$MONITOR"
          grep -q 'configured window cutoff' "$MONITOR"
          grep -q 'MULTYFI EARLY EXIT SUBMITTED' "$MONITOR"
          grep -q 'cancelOpenCashOrder' "$MONITOR"
          grep -q '/v1/order/cancel' "$SAFETY"
          grep -q 'window1BudgetInput' "$MAIN"
          grep -q 'Surfshark Dedicated IP' "$MAIN"
          grep -q 'EARLY_EXIT_PATTERN' "$PARSER"
          ! grep -q 'child_legs' "$CLIENT"

      - name: Verify APK signature
        run: $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs android-stable/app/build/outputs/apk/debug/app-debug.apk
      - name: Rename APK
        run: cp android-stable/app/build/outputs/apk/debug/app-debug.apk android-stable/app/build/outputs/apk/debug/Multyfi-AutoBuy-S24-Android16-v1.6.0.apk

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Android 16 install and dashboard acceptance
        timeout-minutes: 14
        shell: bash
        run: |
          set +e
          OUT=android-stable/app/build/outputs/apk/debug
          mkdir -p "$OUT"
          : > "$OUT/acceptance-api36.log"
          : > "$OUT/emulator-api36.log"
          code=0
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          export ANDROID_SDK_HOME="$RUNNER_TEMP/android-sdk-home"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_SDK_HOME/.android"
          AVD_PATH="$ANDROID_AVD_HOME/s24_api36.avd"
          echo no | avdmanager create avd --force --name s24_api36 --package 'system-images;android-36;google_apis;x86_64' --device 'pixel_8_pro' --path "$AVD_PATH" >> "$OUT/acceptance-api36.log" 2>&1 || code=1
          "$ANDROID_HOME/emulator/emulator" -avd s24_api36 -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none > "$OUT/emulator-api36.log" 2>&1 &
          EMULATOR_PID=$!
          timeout 210 adb wait-for-device >> "$OUT/acceptance-api36.log" 2>&1 || code=1
          booted=0
          if adb get-state >/dev/null 2>&1; then
            for i in $(seq 1 84); do
              state=$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
              if [ "$state" = "1" ]; then booted=1; break; fi
              if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then break; fi
              sleep 5
            done
          fi
          if [ "$booted" != "1" ]; then echo 'Android 16 emulator did not complete boot.' >> "$OUT/acceptance-api36.log"; code=1; fi
          if [ "$booted" = "1" ]; then
            timeout 60 adb install -r "$OUT/Multyfi-AutoBuy-S24-Android16-v1.6.0.apk" >> "$OUT/acceptance-api36.log" 2>&1 || code=1
            adb shell pm grant com.suhas.multyfiautobuy.stable android.permission.POST_NOTIFICATIONS >> "$OUT/acceptance-api36.log" 2>&1 || code=1
            adb logcat -c >> "$OUT/acceptance-api36.log" 2>&1
            timeout 30 adb shell am start -W -n com.suhas.multyfiautobuy.stable/.MainActivity >> "$OUT/acceptance-api36.log" 2>&1 || code=1
            sleep 10
            adb shell dumpsys activity activities > "$OUT/activity-api36.txt" 2>&1
            if ! grep -Eq '(topResumedActivity|ResumedActivity|mResumedActivity).*com.suhas.multyfiautobuy.stable/.MainActivity' "$OUT/activity-api36.txt"; then code=1; fi
            timeout 20 adb shell uiautomator dump /sdcard/multyfi-ui.xml >> "$OUT/acceptance-api36.log" 2>&1 || code=1
            adb pull /sdcard/multyfi-ui.xml "$OUT/ui-api36.xml" >> "$OUT/acceptance-api36.log" 2>&1 || code=1
            if ! grep -q 'PRIVATE S24 TRADING BRIDGE' "$OUT/ui-api36.xml"; then code=1; fi
            if ! grep -q 'THREE TIME-WINDOW AMOUNTS' "$OUT/ui-api36.xml"; then code=1; fi
            if ! grep -q '09:00–09:30 IST' "$OUT/ui-api36.xml"; then code=1; fi
            if ! grep -q 'default 10000' "$OUT/ui-api36.xml"; then code=1; fi
            if ! grep -q 'default 5000' "$OUT/ui-api36.xml"; then code=1; fi
            adb logcat -d -v threadtime > "$OUT/logcat-api36.txt" 2>&1
            if grep -E 'FATAL EXCEPTION|Process: com.suhas.multyfiautobuy.stable|AndroidRuntime.*com.suhas.multyfiautobuy.stable' "$OUT/logcat-api36.txt" >> "$OUT/acceptance-api36.log"; then code=1; fi
            adb exec-out screencap -p > "$OUT/startup-api36.png" 2>> "$OUT/acceptance-api36.log"
          else
            touch "$OUT/activity-api36.txt" "$OUT/ui-api36.xml" "$OUT/logcat-api36.txt" "$OUT/startup-api36.png"
          fi
          echo "$code" > "$OUT/acceptance-api36-exit-code.txt"
          timeout 15 adb emu kill >> "$OUT/acceptance-api36.log" 2>&1 || true
          exit 0

      - name: Upload Android 16 acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Multyfi-AutoBuy-S24-v1.6-Android16-acceptance
          path: |
            android-stable/app/build/outputs/apk/debug/acceptance-api36.log
            android-stable/app/build/outputs/apk/debug/acceptance-api36-exit-code.txt
            android-stable/app/build/outputs/apk/debug/activity-api36.txt
            android-stable/app/build/outputs/apk/debug/ui-api36.xml
            android-stable/app/build/outputs/apk/debug/logcat-api36.txt
            android-stable/app/build/outputs/apk/debug/emulator-api36.log
            android-stable/app/build/outputs/apk/debug/startup-api36.png
          if-no-files-found: error
      - name: Stop if Android 16 acceptance failed
        run: test "$(cat android-stable/app/build/outputs/apk/debug/acceptance-api36-exit-code.txt)" = "0"

      - uses: actions/upload-artifact@v4
        with:
          name: Multyfi-AutoBuy-S24-Android16-v1.6.0
          path: |
            android-stable/app/build/outputs/apk/debug/Multyfi-AutoBuy-S24-Android16-v1.6.0.apk
            android-stable/app/build/outputs/apk/debug/ui-api36.xml
            android-stable/app/build/outputs/apk/debug/startup-api36.png
            android-stable/app/build/reports/tests/testDebugUnitTest/
            android-stable/app/build/reports/lint-results-debug.html
          if-no-files-found: error