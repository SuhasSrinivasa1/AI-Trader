name: Export Android Build Environment

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/android-build-smoke.yml'

permissions:
  contents: read

jobs:
  export-env:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android API 35 from preinstalled sdkmanager
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Warm exact Android and Kotlin plugin caches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/multyfi-warm/app/src/main
          cat >/tmp/multyfi-warm/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "MultyfiWarm"
          include(":app")
          EOF
          cat >/tmp/multyfi-warm/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF
          cat >/tmp/multyfi-warm/app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.multyfi.warm"
              compileSdk = 35
              defaultConfig { applicationId = "com.multyfi.warm"; minSdk = 26; targetSdk = 35; versionCode = 1; versionName = "1" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF
          cat >/tmp/multyfi-warm/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:theme="@android:style/Theme.Material.Light.NoActionBar"/></manifest>
          EOF
          gradle --no-daemon --console=plain -p /tmp/multyfi-warm :app:assembleDebug

      - name: Package split offline environment
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/offline-parts"
          mkdir -p "$OUT"
          GRADLE_REAL="$(readlink -f "$(command -v gradle)")"
          GRADLE_HOME="$(cd "$(dirname "$GRADLE_REAL")/.." && pwd)"

          tar -C "$(dirname "$GRADLE_HOME")" -czf "$OUT/gradle-8.9.tgz" "$(basename "$GRADLE_HOME")"

          SDK_STAGE="$RUNNER_TEMP/sdk-stage"
          mkdir -p "$SDK_STAGE/android-sdk/platforms" "$SDK_STAGE/android-sdk/build-tools" "$SDK_STAGE/android-sdk/platform-tools"
          cp -a "$ANDROID_HOME/platforms/android-35" "$SDK_STAGE/android-sdk/platforms/"
          cp -a "$ANDROID_HOME/build-tools/35.0.0" "$SDK_STAGE/android-sdk/build-tools/"
          cp -a "$ANDROID_HOME/platform-tools/." "$SDK_STAGE/android-sdk/platform-tools/"
          tar -C "$SDK_STAGE" -czf "$OUT/android-sdk-35.tgz" android-sdk

          CACHE_STAGE="$RUNNER_TEMP/cache-stage"
          mkdir -p "$CACHE_STAGE/gradle-caches"
          cp -a "$HOME/.gradle/caches/modules-2" "$CACHE_STAGE/gradle-caches/"
          for d in "$HOME/.gradle/caches"/8.9 "$HOME/.gradle/caches"/jars-*; do
            if [ -e "$d" ]; then cp -a "$d" "$CACHE_STAGE/gradle-caches/"; fi
          done
          tar -C "$CACHE_STAGE" -czf "$OUT/gradle-cache-core.tgz" gradle-caches

          printf 'JAVA_VERSION=17\nGRADLE_VERSION=8.9\nCOMPILE_SDK=35\nBUILD_TOOLS=35.0.0\nAGP=8.7.3\nKOTLIN=2.0.21\n' > "$OUT/ENV.txt"
          ls -lh "$OUT"

      - name: Upload Gradle distribution
        uses: actions/upload-artifact@v4
        with:
          name: multyfi-gradle-8.9
          path: ${{ runner.temp }}/offline-parts/gradle-8.9.tgz
          compression-level: 0
          retention-days: 7

      - name: Upload Android SDK
        uses: actions/upload-artifact@v4
        with:
          name: multyfi-android-sdk-35
          path: ${{ runner.temp }}/offline-parts/android-sdk-35.tgz
          compression-level: 0
          retention-days: 7

      - name: Upload Gradle core cache
        uses: actions/upload-artifact@v4
        with:
          name: multyfi-gradle-cache-core
          path: ${{ runner.temp }}/offline-parts/gradle-cache-core.tgz
          compression-level: 0
          retention-days: 7

      - name: Upload environment metadata
        uses: actions/upload-artifact@v4
        with:
          name: multyfi-offline-env-meta
          path: ${{ runner.temp }}/offline-parts/ENV.txt
          retention-days: 7
