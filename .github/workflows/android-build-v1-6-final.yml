name: Build Multyfi AutoBuy S24 v1.6 Final

on:
  pull_request:
    branches: [main]
    paths:
      - 'android-stable/**'
      - '.github/workflows/android-build-v1-6-final.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "emulator" "system-images;android-36;google_apis;x86_64"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Apply final v1.6 patch
        run: python3 android-stable/apply_v1_6_patch_final.py
      - name: Unit tests, lint and APK
        run: gradle --no-daemon --console=plain -p android-stable :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Verify source contract
        shell: bash
        run: |
          C=android-stable/app/src/main/java/com/suhas/multyfiautobuy/stable/GrowwClient.java
          L=android-stable/app/src/main/java/com/suhas/multyfiautobuy/stable/MultyfiNotificationService.java
          P=android-stable/app/src/main/java/com/suhas/multyfiautobuy/stable/AppPrefs.java
          E=android-stable/app/src/main/java/com/suhas/multyfiautobuy/stable/EntryPolicy.java
          X=android-stable/app/src/main/res/layout/activity_main.xml
          grep -q 'DEFAULT_EARLY_START_MINUTE = 9 \* 60' "$P"
          grep -q 'DEFAULT_EARLY_END_MINUTE = 10 \* 60' "$P"
          grep -q 'DEFAULT_LATE_QUANTITY = 10' "$P"
          grep -q 'DEFAULT_LATE_CALLS_ENABLED = false' "$P"
          grep -q 'createImmediateEntryLimit' "$C"
          grep -q 'createEntryGttWithLimitFallback' "$C"
          grep -q 'EARLY_WINDOW_DIRECT_LIMIT' "$L"
          grep -q 'POST_WINDOW_FIXED_QUANTITY' "$L"
          grep -q 'isInWindow' "$E"
          grep -q 'earlyStartInput' "$X"
          grep -q 'lateQuantityInput' "$X"
          ! grep -q 'child_legs' "$C"
      - name: Verify signature and rename
        run: |
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs android-stable/app/build/outputs/apk/debug/app-debug.apk
          cp android-stable/app/build/outputs/apk/debug/app-debug.apk android-stable/app/build/outputs/apk/debug/Multyfi-AutoBuy-S24-TimeWindow-v1.6.0.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 16 install and launch
        timeout-minutes: 12
        shell: bash
        run: |
          set +e
          OUT=android-stable/app/build/outputs/apk/debug
          code=0
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd-v16-final"
          export ANDROID_SDK_HOME="$RUNNER_TEMP/android-sdk-home-v16-final"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_SDK_HOME/.android"
          echo no | avdmanager create avd --force --name s24_v16_final --package 'system-images;android-36;google_apis;x86_64' --device 'pixel_8_pro' --path "$ANDROID_AVD_HOME/s24_v16_final.avd" > "$OUT/acceptance-v1.6.log" 2>&1 || code=1
          "$ANDROID_HOME/emulator/emulator" -avd s24_v16_final -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim > "$OUT/emulator-v1.6.log" 2>&1 &
          PID=$!
          timeout 180 adb wait-for-device >> "$OUT/acceptance-v1.6.log" 2>&1 || code=1
          booted=0
          for i in $(seq 1 72); do
            [ "$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && booted=1 && break
            kill -0 "$PID" 2>/dev/null || break
            sleep 5
          done
          [ "$booted" = "1" ] || code=1
          if [ "$booted" = "1" ]; then
            timeout 60 adb install -r "$OUT/Multyfi-AutoBuy-S24-TimeWindow-v1.6.0.apk" >> "$OUT/acceptance-v1.6.log" 2>&1 || code=1
            adb shell pm grant com.suhas.multyfiautobuy.stable android.permission.POST_NOTIFICATIONS >> "$OUT/acceptance-v1.6.log" 2>&1 || true
            adb logcat -c
            timeout 30 adb shell am start -W -n com.suhas.multyfiautobuy.stable/.MainActivity >> "$OUT/acceptance-v1.6.log" 2>&1 || code=1
            sleep 8
            adb shell dumpsys activity activities > "$OUT/activity-v1.6.txt" 2>&1
            grep -q 'com.suhas.multyfiautobuy.stable/.MainActivity' "$OUT/activity-v1.6.txt" || code=1
            adb shell uiautomator dump /sdcard/ui-v16-final.xml >> "$OUT/acceptance-v1.6.log" 2>&1 || code=1
            adb pull /sdcard/ui-v16-final.xml "$OUT/ui-v1.6.xml" >> "$OUT/acceptance-v1.6.log" 2>&1 || code=1
            grep -q 'TIME-WINDOW SIZING' "$OUT/ui-v1.6.xml" || code=1
            grep -q '09:00' "$OUT/ui-v1.6.xml" || code=1
            grep -q '10:00' "$OUT/ui-v1.6.xml" || code=1
            adb logcat -d -v threadtime > "$OUT/logcat-v1.6.txt" 2>&1
            grep -E 'FATAL EXCEPTION|Process: com.suhas.multyfiautobuy.stable|AndroidRuntime.*com.suhas.multyfiautobuy.stable' "$OUT/logcat-v1.6.txt" && code=1
            adb exec-out screencap -p > "$OUT/startup-v1.6.png"
          fi
          echo "$code" > "$OUT/acceptance-v1.6-exit-code.txt"
          timeout 15 adb emu kill || true
          test "$code" = "0"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Multyfi-AutoBuy-S24-TimeWindow-v1.6.0-Final
          path: |
            android-stable/app/build/outputs/apk/debug/Multyfi-AutoBuy-S24-TimeWindow-v1.6.0.apk
            android-stable/app/build/outputs/apk/debug/acceptance-v1.6.log
            android-stable/app/build/outputs/apk/debug/acceptance-v1.6-exit-code.txt
            android-stable/app/build/outputs/apk/debug/activity-v1.6.txt
            android-stable/app/build/outputs/apk/debug/ui-v1.6.xml
            android-stable/app/build/outputs/apk/debug/logcat-v1.6.txt
            android-stable/app/build/outputs/apk/debug/startup-v1.6.png
            android-stable/app/build/reports/tests/testDebugUnitTest/
            android-stable/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
