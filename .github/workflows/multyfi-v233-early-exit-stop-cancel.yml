name: Build Multyfi v2.3.3 Early Exit Stop Cancel Fix

on:
  push:
    branches: [multyfi-v2.3.3-early-exit-stop-cancel]
  workflow_dispatch:

jobs:
  build-test-android16:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools" "emulator" "system-images;android-36;google_apis;x86_64"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Apply v2.3.3 source update
        shell: bash
        run: |
          set -euo pipefail
          python3 hotfix/run_v233.py | tee apply-v233.log

      - name: Unit tests, lint and builds
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --console=plain -p android-stable \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug \
            :app:assembleRelease | tee build-v233.log

      - name: Verify GSPCROP regression contracts
        shell: bash
        run: |
          set -euo pipefail
          ROOT=android-stable/app/src/main/java/com/suhas/multyfiautobuy/stable
          TEST=android-stable/app/src/test/java/com/suhas/multyfiautobuy/stable
          grep -q "versionCode 233" android-stable/app/build.gradle
          grep -q "versionName '2.3.3'" android-stable/app/build.gradle
          grep -q "static OrderStatus getOrderById" "$ROOT/GrowwClient.java"
          grep -q 'API_BASE + "/order/status/"' "$ROOT/GrowwClient.java"
          grep -q "CANCELLATION_REQUESTED" "$ROOT/EarlyExitProtectionPolicy.java"
          grep -q "GrowwClient.getOrderById" "$ROOT/StrategyMonitorService.java"
          grep -q "MULTYFI EARLY EXIT WAITING — STOP CANCEL NOT CONFIRMED" "$ROOT/StrategyMonitorService.java"
          grep -q "MULTYFI EARLY EXIT PROTECTION CANCELLED" "$ROOT/StrategyMonitorService.java"
          grep -q "placeEarlyExitMarketSell" "$ROOT/StrategyMonitorService.java"
          grep -q "MULTYFI EARLY EXIT SUBMITTED" "$ROOT/StrategyMonitorService.java"
          grep -q "cancellationRequestedWaitsWithoutSendingDuplicateCancel" "$TEST/EarlyExitProtectionPolicyTest.java"
          grep -q "acceptsUnlabelledNewEquityTradeAsMis" "$TEST/IntradayOnlyPolicyTest.java"
          grep -q "MULTYFI EARLY EXIT PERSISTED" "$ROOT/ProductionNotificationService.java"

      - name: Stage release and generated source
        shell: bash
        run: |
          set -euo pipefail
          FINAL=android-stable/app/build/outputs/apk/v233
          mkdir -p "$FINAL"
          cp android-stable/app/build/outputs/apk/debug/app-debug.apk \
            "$FINAL/Multyfi-AutoBuy-Pro-S24-Android16-v2.3.3-VALIDATION.apk"
          UNSIGNED=$(find android-stable/app/build/outputs/apk/release -maxdepth 1 -type f -name '*unsigned*.apk' | head -n 1)
          test -n "$UNSIGNED"
          cp "$UNSIGNED" "$FINAL/Multyfi-AutoBuy-Pro-S24-Android16-v2.3.3-UNSIGNED.apk"
          (cd android-stable/app && zip -qr "$GITHUB_WORKSPACE/multyfi-v233-generated-source.zip" src build.gradle)

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 16 install and two cold launches
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          FINAL=android-stable/app/build/outputs/apk/v233
          APK="$FINAL/Multyfi-AutoBuy-Pro-S24-Android16-v2.3.3-VALIDATION.apk"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          export ANDROID_SDK_HOME="$RUNNER_TEMP/android-sdk-home"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_SDK_HOME/.android"
          echo no | avdmanager create avd --force --name s24_v233 \
            --package 'system-images;android-36;google_apis;x86_64' \
            --device 'pixel_8_pro' --path "$ANDROID_AVD_HOME/s24_v233.avd"
          "$ANDROID_HOME/emulator/emulator" -avd s24_v233 -no-window \
            -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim \
            -camera-back none > "$FINAL/emulator-v233.log" 2>&1 &
          EMULATOR_PID=$!
          trap 'timeout 15 adb emu kill >/dev/null 2>&1 || true; kill "$EMULATOR_PID" >/dev/null 2>&1 || true' EXIT
          timeout 240 adb wait-for-device
          booted=0
          for i in $(seq 1 100); do
            state=$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$state" = "1" ]; then booted=1; break; fi
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then break; fi
            sleep 4
          done
          test "$booted" = "1"
          adb install -r "$APK" | tee "$FINAL/install-v233.txt"
          grep -q Success "$FINAL/install-v233.txt"
          adb shell pm grant com.suhas.multyfiautobuy.stable android.permission.POST_NOTIFICATIONS
          adb logcat -c
          for n in 1 2; do
            adb shell am force-stop com.suhas.multyfiautobuy.stable
            sleep 2
            adb shell am start -W -n com.suhas.multyfiautobuy.stable/.MainActivity \
              | tee "$FINAL/cold-launch-v233-$n.txt"
            sleep 8
            adb shell pidof com.suhas.multyfiautobuy.stable \
              | tee "$FINAL/pid-v233-$n.txt"
            test -s "$FINAL/pid-v233-$n.txt"
          done
          adb shell uiautomator dump /sdcard/v233-ui.xml
          adb pull /sdcard/v233-ui.xml "$FINAL/ui-v233.xml"
          grep -q 'Multyfi AutoBuy Pro' "$FINAL/ui-v233.xml"
          grep -q '2.3.3' "$FINAL/ui-v233.xml"
          adb exec-out screencap -p > "$FINAL/startup-v233.png"
          adb logcat -d -v threadtime > "$FINAL/logcat-v233.txt"
          if grep -E 'FATAL EXCEPTION|Process: com.suhas.multyfiautobuy.stable|ClassNotFoundException.*com.suhas.multyfiautobuy.stable' "$FINAL/logcat-v233.txt"; then exit 1; fi

      - name: Create release files
        shell: bash
        run: |
          set -euo pipefail
          FINAL=android-stable/app/build/outputs/apk/v233
          SHA=$(sha256sum "$FINAL/Multyfi-AutoBuy-Pro-S24-Android16-v2.3.3-UNSIGNED.apk" | awk '{print $1}')
          cat > "$FINAL/RELEASE-NOTES-v2.3.3.txt" <<'EOF'
          MULTYFI AUTOBUY PRO v2.3.3 — EARLY EXIT STOP-CANCEL FIX

          - Fixes the GSPCROP incident where an early-exit notification was persisted but no MARKET sell was submitted.
          - Regular MIS stop cancellation is now verified primarily by Groww order ID, with reference-ID fallback.
          - CANCELLATION_REQUESTED is polled without sending duplicate cancellation requests.
          - The app waits up to 10 seconds for definitive cancellation before selling, preventing a duplicate sell race.
          - A visible timeline warning is created when the MARKET sell has not yet been submitted.
          - A visible event records when protection is cancelled and the live position is being verified.
          - Intraday intake rules, budgets, entry logic, stop prices and blocklist behaviour are unchanged.
          EOF
          cat > "$FINAL/VALIDATION-v2.3.3.json" <<EOF
          {
            "version": "2.3.3",
            "version_code": 233,
            "package": "com.suhas.multyfiautobuy.stable",
            "unsigned_release_sha256": "$SHA",
            "unit_tests": "PASS",
            "lint": "PASS",
            "android_16_install": "PASS",
            "cold_launch_1": "PASS",
            "cold_launch_2": "PASS",
            "gspcrop_early_exit_regression": "PASS",
            "regular_stop_status_primary_key": "groww_order_id",
            "reference_id_fallback": true,
            "cancellation_requested_duplicate_cancel": false,
            "blocklist_intraday_retained": true
          }
          EOF

      - name: Upload v2.3.3 build package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Multyfi-AutoBuy-Pro-S24-Android16-v2.3.3-BUILD
          path: |
            apply-v233.log
            build-v233.log
            multyfi-v233-generated-source.zip
            android-stable/app/build/outputs/apk/v233/
            android-stable/app/build/reports/tests/testDebugUnitTest/
            android-stable/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
