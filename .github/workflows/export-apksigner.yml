name: Export Android apksigner 35

on:
  workflow_dispatch:
  push:
    branches: [multyfi-v2.4.3-critical-exit-speed]
    paths: [.github/workflows/export-apksigner.yml]

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager "build-tools;35.0.0"
      - name: Stage apksigner
        run: |
          set -euo pipefail
          mkdir -p export/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" export/apksigner
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" export/lib/apksigner.jar
          chmod +x export/apksigner
          sha256sum export/apksigner export/lib/apksigner.jar > export/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-35
          path: export/
          if-no-files-found: error
