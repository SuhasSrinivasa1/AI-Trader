name: Build Global Arbitrage AI Trader v2

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - arbitrage-ai-v2
    paths:
      - 'ci/arbitrage-v2/**'
      - '.github/workflows/arbitrage-ai-v2-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore v2 source package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p buildsrc
          cat ci/arbitrage-v2/part*.txt | base64 -d | tar -xzf - -C buildsrc
          test -f buildsrc/arbitrage_v2/settings.gradle.kts
          find buildsrc/arbitrage_v2 -maxdepth 3 -type f | sort | head -80

      - name: Unit tests
        working-directory: buildsrc/arbitrage_v2
        run: gradle --no-daemon test

      - name: Build release APK
        working-directory: buildsrc/arbitrage_v2
        run: gradle --no-daemon assembleRelease

      - name: Verify and package APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          APK="buildsrc/arbitrage_v2/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          cp "$APK" artifact/Global-Arbitrage-AI-Trader-v2.0.0-S24.apk
          sha256sum artifact/Global-Arbitrage-AI-Trader-v2.0.0-S24.apk | tee artifact/SHA256.txt
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs artifact/Global-Arbitrage-AI-Trader-v2.0.0-S24.apk | tee artifact/APKSIGNER.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Global-Arbitrage-AI-Trader-v2.0.0
          path: artifact/
          if-no-files-found: error
          retention-days: 7
