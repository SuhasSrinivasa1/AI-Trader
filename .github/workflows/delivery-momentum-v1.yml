name: NSE Delivery Momentum v1.1 UI Build
on:
  workflow_dispatch:
  push:
    branches: [nse-delivery-momentum-v1-build-final]
    paths:
      - '.github/payloads/delivery-momentum-v1.part*'
      - '.github/scripts/delivery_momentum_v1_runtime_fix.py'
      - '.github/scripts/delivery_momentum_v11_ui_patch.py'
      - '.github/workflows/delivery-momentum-v1.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Publish run id
        run: |
          echo "${GITHUB_RUN_ID}" > .delivery-momentum-v1-run-id.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .delivery-momentum-v1-run-id.txt
          git commit -m "Record Delivery Momentum build ${GITHUB_RUN_ID}" || true
          git push origin HEAD:nse-delivery-momentum-v1-build-final || true
      - name: Materialize completely fresh application source
        run: |
          set -e
          cat .github/payloads/delivery-momentum-v1.part* | base64 -d | tar -xz
          test -f delivery-momentum/app/src/main/java/com/suhas/nsedeliverymomentum/MainActivity.java
          test -f delivery-momentum/app/src/main/java/com/suhas/nsedeliverymomentum/MomentumMath.java
          grep -q "applicationId 'com.suhas.nsedeliverymomentum'" delivery-momentum/app/build.gradle
          ! grep -R -q 'com.suhas.nseunifiedscanner' delivery-momentum
      - name: Android compile compatibility fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('delivery-momentum/app/src/main/java/com/suhas/nsedeliverymomentum/GrowwClient.java')
          s=p.read_text()
          old='JSONObject p=j.optJSONObject("payload"); Map<String,Ohlc> out=new HashMap<>(); if(p!=null)for(String k:p.keySet()){String s=k.startsWith("NSE_")?k.substring(4):k; out.put(s,parseOhlc(String.valueOf(p.opt(k))));} return ApiResult.ok(out);'
          new='JSONObject p=j.optJSONObject("payload"); Map<String,Ohlc> out=new HashMap<>(); if(p!=null){Iterator<String> it=p.keys();while(it.hasNext()){String k=it.next();String s=k.startsWith("NSE_")?k.substring(4):k;out.put(s,parseOhlc(String.valueOf(p.opt(k))));}} return ApiResult.ok(out);'
          if old not in s:
              raise SystemExit('GrowwClient JSONObject anchor not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Apply fresh-app runtime reliability fixes
        run: python .github/scripts/delivery_momentum_v1_runtime_fix.py
      - name: Apply professional v1.1 dashboard UI
        run: python .github/scripts/delivery_momentum_v11_ui_patch.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Full clean validation
        run: |
          set -e
          gradle --no-daemon --console=plain -p delivery-momentum clean testDebugUnitTest lintDebug assembleDebug assembleRelease
          mkdir -p delivery-momentum/out
          cp delivery-momentum/app/build/outputs/apk/release/app-release-unsigned.apk delivery-momentum/out/NSE-Delivery-Momentum-S24-v1.1.0-UNSIGNED.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging delivery-momentum/out/NSE-Delivery-Momentum-S24-v1.1.0-UNSIGNED.apk | tee delivery-momentum/out/APK-BADGING.txt
          grep -q "package: name='com.suhas.nsedeliverymomentum'" delivery-momentum/out/APK-BADGING.txt
          grep -q "versionName='1.1.0'" delivery-momentum/out/APK-BADGING.txt
          grep -q '"product","CNC"' delivery-momentum/app/src/main/java/com/suhas/nsedeliverymomentum/GrowwClient.java
          grep -q '"order_type","MARKET"' delivery-momentum/app/src/main/java/com/suhas/nsedeliverymomentum/GrowwClient.java
          grep -q 'expectedRemaining<1.0' delivery-momentum/app/src/main/java/com/suhas/nsedeliverymomentum/MomentumMath.java
          grep -q 'hourlyPace<0.45' delivery-momentum/app/src/main/java/com/suhas/nsedeliverymomentum/MomentumMath.java
          grep -q 'TOP CONTINUATION CANDIDATES' delivery-momentum/app/src/main/java/com/suhas/nsedeliverymomentum/MainActivity.java
          grep -q 'LIVE RANKING' delivery-momentum/app/src/main/java/com/suhas/nsedeliverymomentum/MainActivity.java
          grep -q 'PAPER LEARNING' delivery-momentum/app/src/main/java/com/suhas/nsedeliverymomentum/MainActivity.java
          grep -q 'universe=null' delivery-momentum/app/src/main/java/com/suhas/nsedeliverymomentum/DeliveryMomentumService.java
          grep -q 'minusDays(12)' delivery-momentum/app/src/main/java/com/suhas/nsedeliverymomentum/DeliveryMomentumService.java
          grep -q 'if(!"BUY".equals(c.state))continue;' delivery-momentum/app/src/main/java/com/suhas/nsedeliverymomentum/DeliveryMomentumService.java
          cp delivery-momentum/app/build/reports/lint-results-debug.html delivery-momentum/out/LINT.html
          cp -r delivery-momentum/app/build/reports/tests/testDebugUnitTest delivery-momentum/out/UNIT-TESTS
      - name: Sign fresh-install delivery release
        run: |
          set -e
          STORE_PASS='FreshDeliveryMomentumV11!'
          ALIAS='nse-delivery-momentum-v11'
          keytool -genkeypair -v -keystore /tmp/delivery-momentum-v11.jks -storepass "$STORE_PASS" -keypass "$STORE_PASS" -alias "$ALIAS" -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=NSE Delivery Momentum v1.1, OU=Private Fresh Install, O=Delivery Momentum, L=Bengaluru, ST=Karnataka, C=IN"
          $ANDROID_HOME/build-tools/35.0.0/apksigner sign --ks /tmp/delivery-momentum-v11.jks --ks-key-alias "$ALIAS" --ks-pass pass:"$STORE_PASS" --key-pass pass:"$STORE_PASS" --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out delivery-momentum/out/NSE-Delivery-Momentum-S24-v1.1.0-UI-OVERHAUL-FRESH-SIGNED.apk delivery-momentum/out/NSE-Delivery-Momentum-S24-v1.1.0-UNSIGNED.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs delivery-momentum/out/NSE-Delivery-Momentum-S24-v1.1.0-UI-OVERHAUL-FRESH-SIGNED.apk | tee delivery-momentum/out/SIGNATURE-VERIFICATION.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' delivery-momentum/out/SIGNATURE-VERIFICATION.txt
          sha256sum delivery-momentum/out/NSE-Delivery-Momentum-S24-v1.1.0-UI-OVERHAUL-FRESH-SIGNED.apk > delivery-momentum/out/SHA256.txt
      - name: Package source and release notes
        run: |
          cat > delivery-momentum/out/RELEASE-NOTES.txt <<'EOF'
          NSE DELIVERY MOMENTUM v1.1.0 — PROFESSIONAL UI OVERHAUL
          Package: com.suhas.nsedeliverymomentum

          STRATEGY / EXECUTION LOGIC IS UNCHANGED from the fresh delivery-momentum engine.
          Delivery execution only: Groww CASH + CNC + MARKET BUY. No MIS/FNO. No automated sell.

          UI overhaul:
          - Android status-bar / navigation-bar insets fixed; no title overlap.
          - Clean branded header and compact connection-health chips.
          - Four clear daily KPI cards: Hits, Hit Rate, Calls and 10-Hit Benchmark.
          - Benchmark progress bar.
          - Dedicated Paper Learning / Live Execution control card.
          - Clear strategy summary instead of long undefined text blocks.
          - Professional empty/scanning state.
          - Candidate cards reorganized around Price, Day Move, Confidence, Trend Pace,
            Upside Left, Relative Volume, Turnover, VWAP Hold and Path Quality.
          - BUY / CONFIRMING / WATCH states use distinct visual treatment.
          - Candidate card explicitly states WHY IT QUALIFIED or WHAT IT NEEDS.
          - Settings reorganized into Groww Connection, Static IP and Live Buy Limits sections.

          Runtime reliability protections from v1.0 remain active.
          Ten hits/day remains a performance benchmark, not a fabricated guarantee.
          EOF
          (cd delivery-momentum && zip -qr out/NSE-Delivery-Momentum-v1.1.0-SOURCE.zip app build.gradle settings.gradle gradle.properties)
      - uses: actions/upload-artifact@v4
        with:
          name: NSE-Delivery-Momentum-S24-v1.1.0-UI-OVERHAUL
          path: delivery-momentum/out/**
          retention-days: 30
