name: NSE Delivery Momentum v1 Fresh Build
on:
  workflow_dispatch:
  push:
    branches: [nse-delivery-momentum-v1-build-final]
    paths:
      - '.github/payloads/delivery-momentum-v1.part*'
      - '.github/workflows/delivery-momentum-v1.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Publish run id
        run: |
          echo "${GITHUB_RUN_ID}" > .delivery-momentum-v1-run-id.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .delivery-momentum-v1-run-id.txt
          git commit -m "Record Delivery Momentum build ${GITHUB_RUN_ID}" || true
          git push origin HEAD:nse-delivery-momentum-v1-build-final || true
      - name: Materialize completely fresh application source
        run: |
          set -e
          cat .github/payloads/delivery-momentum-v1.part* | base64 -d | tar -xz
          test -f delivery-momentum/app/src/main/java/com/suhas/nsedeliverymomentum/MainActivity.java
          test -f delivery-momentum/app/src/main/java/com/suhas/nsedeliverymomentum/MomentumMath.java
          grep -q "applicationId 'com.suhas.nsedeliverymomentum'" delivery-momentum/app/build.gradle
          ! grep -R -q 'com.suhas.nseunifiedscanner' delivery-momentum
      - name: Android compile compatibility fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('delivery-momentum/app/src/main/java/com/suhas/nsedeliverymomentum/GrowwClient.java')
          s=p.read_text()
          old='JSONObject p=j.optJSONObject("payload"); Map<String,Ohlc> out=new HashMap<>(); if(p!=null)for(String k:p.keySet()){String s=k.startsWith("NSE_")?k.substring(4):k; out.put(s,parseOhlc(String.valueOf(p.opt(k))));} return ApiResult.ok(out);'
          new='JSONObject p=j.optJSONObject("payload"); Map<String,Ohlc> out=new HashMap<>(); if(p!=null){Iterator<String> it=p.keys();while(it.hasNext()){String k=it.next();String s=k.startsWith("NSE_")?k.substring(4):k;out.put(s,parseOhlc(String.valueOf(p.opt(k))));}} return ApiResult.ok(out);'
          if old not in s:
              raise SystemExit('GrowwClient JSONObject anchor not found')
          p.write_text(s.replace(old,new))
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Full clean validation
        run: |
          set -e
          gradle --no-daemon --console=plain -p delivery-momentum clean testDebugUnitTest lintDebug assembleDebug assembleRelease
          mkdir -p delivery-momentum/out
          cp delivery-momentum/app/build/outputs/apk/release/app-release-unsigned.apk delivery-momentum/out/NSE-Delivery-Momentum-S24-v1.0.0-UNSIGNED.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging delivery-momentum/out/NSE-Delivery-Momentum-S24-v1.0.0-UNSIGNED.apk | tee delivery-momentum/out/APK-BADGING.txt
          grep -q "package: name='com.suhas.nsedeliverymomentum'" delivery-momentum/out/APK-BADGING.txt
          grep -q "versionName='1.0.0'" delivery-momentum/out/APK-BADGING.txt
          grep -q '"product","CNC"' delivery-momentum/app/src/main/java/com/suhas/nsedeliverymomentum/GrowwClient.java
          grep -q '"order_type","MARKET"' delivery-momentum/app/src/main/java/com/suhas/nsedeliverymomentum/GrowwClient.java
          grep -q 'expectedRemaining<1.0' delivery-momentum/app/src/main/java/com/suhas/nsedeliverymomentum/MomentumMath.java
          grep -q 'hourlyPace<0.45' delivery-momentum/app/src/main/java/com/suhas/nsedeliverymomentum/MomentumMath.java
          grep -q '10-HIT BENCHMARK' delivery-momentum/app/src/main/java/com/suhas/nsedeliverymomentum/MainActivity.java
          cp delivery-momentum/app/build/reports/lint-results-debug.html delivery-momentum/out/LINT.html
          cp -r delivery-momentum/app/build/reports/tests/testDebugUnitTest delivery-momentum/out/UNIT-TESTS
      - name: Sign fresh-install delivery release
        run: |
          set -e
          STORE_PASS='FreshDeliveryMomentumV1!'
          ALIAS='nse-delivery-momentum-v1'
          keytool -genkeypair -v -keystore /tmp/delivery-momentum-v1.jks -storepass "$STORE_PASS" -keypass "$STORE_PASS" -alias "$ALIAS" -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=NSE Delivery Momentum v1, OU=Private Fresh Install, O=Delivery Momentum, L=Bengaluru, ST=Karnataka, C=IN"
          $ANDROID_HOME/build-tools/35.0.0/apksigner sign --ks /tmp/delivery-momentum-v1.jks --ks-key-alias "$ALIAS" --ks-pass pass:"$STORE_PASS" --key-pass pass:"$STORE_PASS" --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out delivery-momentum/out/NSE-Delivery-Momentum-S24-v1.0.0-FRESH-SIGNED.apk delivery-momentum/out/NSE-Delivery-Momentum-S24-v1.0.0-UNSIGNED.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs delivery-momentum/out/NSE-Delivery-Momentum-S24-v1.0.0-FRESH-SIGNED.apk | tee delivery-momentum/out/SIGNATURE-VERIFICATION.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' delivery-momentum/out/SIGNATURE-VERIFICATION.txt
          sha256sum delivery-momentum/out/NSE-Delivery-Momentum-S24-v1.0.0-FRESH-SIGNED.apk > delivery-momentum/out/SHA256.txt
      - name: Package source and release notes
        run: |
          cat > delivery-momentum/out/RELEASE-NOTES.txt <<'EOF'
          NSE DELIVERY MOMENTUM v1.0.0 — FRESH APPLICATION
          Package: com.suhas.nsedeliverymomentum

          Fresh codebase. NSE cash-equity sustained-continuation scanner.
          Delivery execution only: Groww CASH + CNC + MARKET BUY. No MIS/FNO. No automated sell.
          Prefers smooth rising price paths, >=0.45%/hour trend pace, VWAP acceptance, relative volume,
          turnover, market/sector strength, order-flow support and projected subsequent same-session upside >=1.0%.
          One-bar spikes, choppy paths, deep pullbacks and excessive extension are penalized.
          No small rupee target cards and no fixed 30/60/120-minute trade horizon.

          Learning: every BUY-qualified recommendation is tracked in paper and live modes.
          HIT = subsequently reaches +1.0% from recommendation price in the same session.
          The UI shows resolved hit rate and a 10-HIT BENCHMARK. Ten winners are a target, not a guarantee,
          and the app never fabricates low-quality calls to satisfy the benchmark.

          Live execution is OFF by default and requires Groww auth + matched static IP.
          Real execution sends CNC MARKET BUY only, using configurable capital per buy and max live buys/day.
          EOF
          (cd delivery-momentum && zip -qr out/NSE-Delivery-Momentum-v1.0.0-SOURCE.zip app build.gradle settings.gradle gradle.properties)
      - uses: actions/upload-artifact@v4
        with:
          name: NSE-Delivery-Momentum-S24-v1.0.0-FRESH-SIGNED
          path: delivery-momentum/out/**
          retention-days: 30
