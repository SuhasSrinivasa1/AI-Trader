name: Fetch verified APK signer tool

on:
  push:
    branches:
      - build-ps-shadow-trader-v160-ui-pro-20260923
    paths:
      - '.github/workflows/fetch-apk-signer-tool.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download verified uber-apk-signer
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o uber-apk-signer-1.3.0.jar \
            https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          echo "e1299fd6fcf4da527dd53735b56127e8ea922a321128123b9c32d619bba1d835  uber-apk-signer-1.3.0.jar" | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: verified-uber-apk-signer-1.3.0
          retention-days: 1
          if-no-files-found: error
          path: uber-apk-signer-1.3.0.jar
