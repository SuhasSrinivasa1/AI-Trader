name: Multyfi v2.3.1 Android 16 Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'hotfix/run_v231.py'
      - 'hotfix/fix_v231_newline.py'
      - '.github/workflows/multyfi-v231-android16-smoke.yml'
  workflow_dispatch:

jobs:
  android16:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 16 emulator
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools" "emulator" "system-images;android-36;google_apis;x86_64"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build v2.3.1 validation APK
        run: |
          set -euo pipefail
          python3 hotfix/run_v231.py
          python3 hotfix/fix_v231_newline.py
          gradle --no-daemon --console=plain -p android-stable :app:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and cold-launch twice
        timeout-minutes: 18
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/v231-smoke"
          mkdir -p "$OUT"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          export ANDROID_SDK_HOME="$RUNNER_TEMP/android-sdk-home"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_SDK_HOME/.android"
          echo no | avdmanager create avd --force --name s24_v231 --package 'system-images;android-36;google_apis;x86_64' --device 'pixel_8_pro' --path "$ANDROID_AVD_HOME/s24_v231.avd"
          "$ANDROID_HOME/emulator/emulator" -avd s24_v231 -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none > "$OUT/emulator.log" 2>&1 &
          PID=$!
          trap 'timeout 15 adb emu kill >/dev/null 2>&1 || true; kill "$PID" >/dev/null 2>&1 || true' EXIT
          timeout 240 adb wait-for-device
          for i in $(seq 1 100); do
            [ "$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            kill -0 "$PID"
            sleep 4
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          APK=android-stable/app/build/outputs/apk/debug/app-debug.apk
          adb install -r "$APK" | tee "$OUT/install.txt"
          grep -q Success "$OUT/install.txt"
          adb shell pm grant com.suhas.multyfiautobuy.stable android.permission.POST_NOTIFICATIONS
          adb logcat -c
          for n in 1 2; do
            adb shell am force-stop com.suhas.multyfiautobuy.stable
            adb shell am start -W -n com.suhas.multyfiautobuy.stable/.MainActivity | tee "$OUT/launch-$n.txt"
            sleep 7
            adb shell pidof com.suhas.multyfiautobuy.stable | tee "$OUT/pid-$n.txt"
            test -s "$OUT/pid-$n.txt"
          done
          adb shell dumpsys package com.suhas.multyfiautobuy.stable | grep -E 'versionName=2.3.1|versionCode=231' | tee "$OUT/version.txt"
          grep -q 'versionName=2.3.1' "$OUT/version.txt"
          adb shell uiautomator dump /sdcard/v231.xml
          adb pull /sdcard/v231.xml "$OUT/ui.xml"
          grep -q 'INTRADAY SETTINGS' "$OUT/ui.xml"
          ! grep -q 'Swing / ordinary equity budget' "$OUT/ui.xml"
          adb exec-out screencap -p > "$OUT/startup.png"
          adb logcat -d -v threadtime > "$OUT/logcat.txt"
          if grep -E 'FATAL EXCEPTION|Process: com.suhas.multyfiautobuy.stable|ClassNotFoundException.*com.suhas.multyfiautobuy.stable' "$OUT/logcat.txt"; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Multyfi-v2.3.1-Android16-Smoke
          path: ${{ runner.temp }}/v231-smoke/
          if-no-files-found: warn
