name: Build Multyfi AutoBuy Pro v2.2.1 Stable Routing

on:
  pull_request:
    branches: [main]
    paths:
      - 'hotfix/run_v221.py'
      - '.github/workflows/multyfi-v221-stable-routing.yml'
  workflow_dispatch:

jobs:
  build-test-android16:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools" "emulator" "system-images;android-36;google_apis;x86_64"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Apply stable v2.2.1 source update
        id: apply_source
        shell: bash
        run: |
          set +e
          python3 hotfix/run_v221.py > apply-v221.log 2>&1
          code=$?
          cat apply-v221.log
          echo "$code" > apply-v221-exit-code.txt
          exit "$code"

      - name: Upload source-apply diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Multyfi-v2.2.1-source-apply-diagnostics
          path: |
            apply-v221.log
            apply-v221-exit-code.txt
          if-no-files-found: error

      - name: Unit tests, lint and source-built APK
        run: gradle --no-daemon --console=plain -p android-stable :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Verify notification-owned routing contract
        shell: bash
        run: |
          set -euo pipefail
          ROOT=android-stable/app/src/main/java/com/suhas/multyfiautobuy/stable
          TEST=android-stable/app/src/test/java/com/suhas/multyfiautobuy/stable
          grep -q "versionCode 221" android-stable/app/build.gradle
          grep -q "versionName '2.2.1'" android-stable/app/build.gradle
          grep -q "NotificationRoutePolicy.entryMode(signal)" "$ROOT/ProductionNotificationService.java"
          grep -q "Explicit Intraday/Intra day/MIS" "$ROOT/ProductionNotificationService.java"
          grep -q "every other complete recommendation routes to CNC entry GTT" "$ROOT/ProductionNotificationService.java"
          grep -q "signal.isIntraday()" "$ROOT/NotificationRoutePolicy.java"
          grep -q "No explicit Intraday/MIS • CNC entry GTT" "$ROOT/NotificationRoutePolicy.java"
          grep -q "route follows notification" "$ROOT/ProductionActivity.java"
          grep -q "all other or unlabelled calls => CNC entry GTT" "$ROOT/ProductionActivity.java"
          grep -q "absentIntradayLabelDefaultsToCncEntryGtt" "$TEST/SignalParserTest.java"
          grep -q "everyNonIntradayCategoryUsesCncGtt" "$TEST/NotificationRoutePolicyTest.java"
          ! grep -q "OrderPolicy.entryMode(window)" "$ROOT/ProductionNotificationService.java"
          ! grep -q "MIS before 09:30" "$ROOT/ProductionActivity.java"
          ! grep -q "POST-09:30 CNC" "$ROOT/ProductionNotificationService.java"

      - name: Verify generated price grid and APK signature
        shell: bash
        run: |
          set -euo pipefail
          ROOT=android-stable/app/src/main/java/com/suhas/multyfiautobuy/stable
          grep -q "0.10d" "$ROOT/SignalParser.java"
          grep -q "0.10d" "$ROOT/GrowwClient.java"
          ! grep -q "0.05d" "$ROOT/SignalParser.java"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs android-stable/app/build/outputs/apk/debug/app-debug.apk
          cp android-stable/app/build/outputs/apk/debug/app-debug.apk android-stable/app/build/outputs/apk/debug/Multyfi-AutoBuy-Pro-S24-Android16-v2.2.1-STABLE.apk

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 16 install and two cold launches
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          OUT=android-stable/app/build/outputs/apk/debug
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          export ANDROID_SDK_HOME="$RUNNER_TEMP/android-sdk-home"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_SDK_HOME/.android"
          AVD_PATH="$ANDROID_AVD_HOME/s24_v221_api36.avd"
          echo no | avdmanager create avd --force --name s24_v221_api36 --package 'system-images;android-36;google_apis;x86_64' --device 'pixel_8_pro' --path "$AVD_PATH"
          "$ANDROID_HOME/emulator/emulator" -avd s24_v221_api36 -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none > "$OUT/emulator-v221.log" 2>&1 &
          EMULATOR_PID=$!
          trap 'timeout 15 adb emu kill >/dev/null 2>&1 || true; kill "$EMULATOR_PID" >/dev/null 2>&1 || true' EXIT
          timeout 240 adb wait-for-device
          booted=0
          for i in $(seq 1 100); do
            state=$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$state" = "1" ]; then booted=1; break; fi
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then break; fi
            sleep 4
          done
          test "$booted" = "1"
          APK="$OUT/Multyfi-AutoBuy-Pro-S24-Android16-v2.2.1-STABLE.apk"
          adb install -r "$APK" | tee "$OUT/install-v221.txt"
          grep -q Success "$OUT/install-v221.txt"
          adb shell pm grant com.suhas.multyfiautobuy.stable android.permission.POST_NOTIFICATIONS
          adb logcat -c
          for n in 1 2; do
            adb shell am force-stop com.suhas.multyfiautobuy.stable
            sleep 2
            adb shell am start -W -n com.suhas.multyfiautobuy.stable/.MainActivity | tee "$OUT/cold-launch-v221-$n.txt"
            sleep 10
            adb shell pidof com.suhas.multyfiautobuy.stable | tee "$OUT/pid-v221-$n.txt"
            test -s "$OUT/pid-v221-$n.txt"
          done
          adb shell uiautomator dump /sdcard/multyfi-v221-ui.xml
          adb pull /sdcard/multyfi-v221-ui.xml "$OUT/ui-v221.xml"
          grep -q 'Multyfi AutoBuy Pro' "$OUT/ui-v221.xml"
          grep -q 'source-built stable release 2.2.1' "$OUT/ui-v221.xml"
          found_route=0
          found_test=0
          for i in $(seq 1 8); do
            adb shell input swipe 500 1800 500 300 650
            sleep 1
            adb shell uiautomator dump /sdcard/multyfi-v221-scroll-$i.xml || true
            adb pull /sdcard/multyfi-v221-scroll-$i.xml "$OUT/ui-v221-scroll-$i.xml" || true
            grep -q 'route follows notification' "$OUT/ui-v221-scroll-$i.xml" && found_route=1 || true
            grep -q 'RUN OFFLINE ROUTING TEST' "$OUT/ui-v221-scroll-$i.xml" && found_test=1 || true
          done
          test "$found_route" = "1"
          test "$found_test" = "1"
          adb exec-out screencap -p > "$OUT/startup-v221.png"
          adb logcat -d -v threadtime > "$OUT/logcat-v221.txt"
          if grep -E 'FATAL EXCEPTION|Process: com.suhas.multyfiautobuy.stable|ClassNotFoundException.*com.suhas.multyfiautobuy.stable' "$OUT/logcat-v221.txt"; then
            exit 1
          fi

      - name: Create validation manifest
        shell: bash
        run: |
          set -euo pipefail
          OUT=android-stable/app/build/outputs/apk/debug
          SHA=$(sha256sum "$OUT/Multyfi-AutoBuy-Pro-S24-Android16-v2.2.1-STABLE.apk" | awk '{print $1}')
          cat > "$OUT/VALIDATION-v2.2.1.json" <<EOF
          {
            "version": "2.2.1",
            "package": "com.suhas.multyfiautobuy.stable",
            "android_api": 36,
            "apk_sha256": "$SHA",
            "unit_tests": "PASS",
            "lint": "PASS",
            "signature": "PASS",
            "android16_install": "PASS",
            "cold_launch_1": "PASS",
            "cold_launch_2": "PASS",
            "crash_scan": "PASS",
            "routing": {
              "explicit_intraday_or_mis": "MIS regular LIMIT",
              "all_other_or_unlabelled": "CNC entry GTT",
              "time_windows": "budget selection only"
            },
            "price_rounding": "conservative INR 0.10 generated-order grid"
          }
          EOF

      - name: Upload stable APK and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Multyfi-AutoBuy-Pro-S24-Android16-v2.2.1-STABLE
          path: |
            android-stable/app/build/outputs/apk/debug/Multyfi-AutoBuy-Pro-S24-Android16-v2.2.1-STABLE.apk
            android-stable/app/build/outputs/apk/debug/VALIDATION-v2.2.1.json
            android-stable/app/build/outputs/apk/debug/install-v221.txt
            android-stable/app/build/outputs/apk/debug/cold-launch-v221-*.txt
            android-stable/app/build/outputs/apk/debug/pid-v221-*.txt
            android-stable/app/build/outputs/apk/debug/ui-v221*.xml
            android-stable/app/build/outputs/apk/debug/logcat-v221.txt
            android-stable/app/build/outputs/apk/debug/startup-v221.png
            android-stable/app/build/outputs/apk/debug/emulator-v221.log
            android-stable/app/build/reports/tests/testDebugUnitTest/
            android-stable/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
