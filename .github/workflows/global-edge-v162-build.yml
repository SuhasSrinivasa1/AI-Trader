name: Global Edge AI Trader v1.6.2 Coordinated Multify Build

on:
  push:
    paths:
      - '.github/workflows/global-edge-v162-build.yml'
      - 'fresh-global-edge/v162/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - name: Recover exact v1.6.1 source
        shell: bash
        run: |
          set -euo pipefail
          SRCZIP=fresh-global-edge/v161/release/Global-Edge-AI-Trader-v1.6.1-source.zip
          test -s "$SRCZIP"
          rm -rf /tmp/v162 && mkdir -p /tmp/v162
          unzip -q "$SRCZIP" -d /tmp/v162
          test -f /tmp/v162/Global-Edge-AI-Trader-v1.5.0-source/app/build.gradle.kts

      - name: Apply v1.6.2 incremental patch
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/v162/Global-Edge-AI-Trader-v1.5.0-source
          tr -d '\r\n ' < fresh-global-edge/v162/v161-to-v162.patch.gz.b64 | base64 -d > /tmp/v162.patch.gz
          gunzip -c /tmp/v162.patch.gz > /tmp/v162.patch
          cd "$SRC"
          patch -p1 --batch < /tmp/v162.patch
          grep -q 'versionCode = 162' app/build.gradle.kts
          grep -q 'versionName = "1.6.2"' app/build.gradle.kts
          grep -q 'android:icon="@mipmap/ic_launcher"' app/src/main/AndroidManifest.xml
          grep -q 'MultifyNotificationService' app/src/main/AndroidManifest.xml
          grep -q 'LEGACY RECALL' app/src/main/java/com/suhas/ucsentinel/data/repository/UCSentinelRepository.kt
          grep -q 'replayMultifyEvents' app/src/main/java/com/suhas/ucsentinel/data/repository/UCSentinelRepository.kt
          grep -q 'NIGHTLY' app/src/main/java/com/suhas/ucsentinel/worker/NightlyLearningWorker.kt
          grep -q 'MultifyCompactScreen' app/src/main/java/com/suhas/ucsentinel/ui/AppNavigation.kt
          grep -q 'UC/Pressure has first priority' app/src/main/java/com/suhas/ucsentinel/ui/MainViewModel.kt
          test -s app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -s app/src/main/res/drawable/ic_launcher_foreground.xml
          test -s CHANGELOG-v1.6.2.txt
          echo 'v1.6.2 source verification passed'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unit tests and release APK
        working-directory: /tmp/v162/Global-Edge-AI-Trader-v1.5.0-source
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out
          gradle --no-daemon --console=plain clean testDebugUnitTest assembleRelease 2>&1 | tee out/GRADLE-BUILD-TEST.log
          echo 'Unit tests + assembleRelease: PASS' > out/TEST-RESULT-SUMMARY.txt

      - name: Recover preserved signing material
        uses: actions/download-artifact@v4
        with:
          name: Global-Edge-AI-Trader-v1.5.0-FINAL
          repository: SuhasSrinivasa1/AI-Trader
          run-id: 36146076154
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/v150-artifact

      - name: Sign and verify preserved update certificate
        working-directory: /tmp/v162/Global-Edge-AI-Trader-v1.5.0-source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out /tmp/signing
          BACKUP=$(find /tmp/v150-artifact -type f -name 'Global-Edge-AI-Trader-v1.5.0-SIGNING-BACKUP.zip' | head -n1)
          test -n "$BACKUP" && test -s "$BACKUP"
          unzip -q "$BACKUP" -d /tmp/signing
          KEYSTORE=/tmp/signing/global-edge-v1.5.0.keystore
          INFO=/tmp/signing/SIGNING-INFO.txt
          STORE_PASS=$(grep '^store_password=' "$INFO" | cut -d= -f2-)
          KEY_PASS=$(grep '^key_password=' "$INFO" | cut -d= -f2-)
          UNSIGNED=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*release*.apk' | head -n1)
          OUT=out/Global-Edge-AI-Trader-v1.6.2.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$KEYSTORE" --ks-pass pass:"$STORE_PASS" --key-pass pass:"$KEY_PASS" --ks-key-alias globaledge --out "$OUT" "$UNSIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$OUT" | tee out/APK-SIGNATURE-VERIFY.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$OUT" | tee out/APK-BADGING.txt
          grep -q "package: name='com.suhas.globaledgeai'" out/APK-BADGING.txt
          grep -q "versionCode='162'" out/APK-BADGING.txt
          grep -q "versionName='1.6.2'" out/APK-BADGING.txt
          grep -q "application-icon" out/APK-BADGING.txt
          CERT_SHA=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$OUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)
          test "$CERT_SHA" = '31ffa51c23b76f450cf099d00b254870bf8eacc5ce79aee4458070a0fab783d7'
          sha256sum "$OUT" | tee out/SHA256.txt
          {
            echo 'build=SUCCESS'
            echo 'package=com.suhas.globaledgeai'
            echo 'versionCode=162'
            echo 'versionName=1.6.2'
            echo "signer_sha256=$CERT_SHA"
            echo 'update_certificate_preserved=true'
            echo 'launcher_icon=true'
            echo 'adaptive_icon=true'
            echo 'multify_notification_listener=true'
            echo 'multify_event_replay=true'
            echo 'legacy_recall_shadow=true'
            echo 'session_aware_strategy_priority=true'
            echo 'engine_api_priority=UC_PRESSURE_then_STRATEGY_then_GLOBAL'
            echo 'nightly_deep_learning=true'
            echo 'nightly_target_time=17:45_IST'
            echo 'off_hours_learning_preserved=true'
            echo 'manual_order_only=true'
            echo 'uc_fast_lane_live=80'
            echo 'uc_fast_lane_next_session=120'
            echo 'pressure_fast_lane_max=80'
            echo 'strategy_deep_rotation=220'
            echo 'strict_live_execution_gate_preserved=true'
            echo 'groww_healthy_live_budget=270_per_minute'
            echo 'groww_429_cooldown_budget=220_per_minute'
            echo 'v159_ledger_integrity_preserved=true'
          } > out/BUILD-STATUS.txt

      - name: Package source and logs
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/v162/Global-Edge-AI-Trader-v1.5.0-source
          cd /tmp/v162
          zip -qr "$SRC/out/Global-Edge-AI-Trader-v1.6.2-source.zip" Global-Edge-AI-Trader-v1.5.0-source -x '*/.gradle/*' '*/build/*' '*/out/*' '*.keystore' '*.jks'
          cd "$SRC/out"
          zip -q Global-Edge-AI-Trader-v1.6.2-build-logs.zip APK-SIGNATURE-VERIFY.txt APK-BADGING.txt SHA256.txt BUILD-STATUS.txt TEST-RESULT-SUMMARY.txt GRADLE-BUILD-TEST.log

      - name: Upload final v1.6.2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Global-Edge-AI-Trader-v1.6.2-FINAL
          retention-days: 90
          if-no-files-found: error
          path: |
            /tmp/v162/Global-Edge-AI-Trader-v1.5.0-source/out/Global-Edge-AI-Trader-v1.6.2.apk
            /tmp/v162/Global-Edge-AI-Trader-v1.5.0-source/out/Global-Edge-AI-Trader-v1.6.2-source.zip
            /tmp/v162/Global-Edge-AI-Trader-v1.5.0-source/out/Global-Edge-AI-Trader-v1.6.2-build-logs.zip
            /tmp/v162/Global-Edge-AI-Trader-v1.5.0-source/out/BUILD-STATUS.txt

      - name: Publish v1.6.2 release files
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/v162/Global-Edge-AI-Trader-v1.5.0-source/out
          DEST=fresh-global-edge/v162/release
          mkdir -p "$DEST"
          cp "$SRC/Global-Edge-AI-Trader-v1.6.2.apk" "$DEST/"
          cp "$SRC/Global-Edge-AI-Trader-v1.6.2-source.zip" "$DEST/"
          cp "$SRC/Global-Edge-AI-Trader-v1.6.2-build-logs.zip" "$DEST/"
          cp "$SRC/BUILD-STATUS.txt" "$DEST/"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$DEST"
          git commit -m 'Publish Global Edge AI Trader v1.6.2 coordinated Multify release [skip ci]'
          git push
