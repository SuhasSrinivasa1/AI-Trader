name: Multyfi v2.4.9 RELIABILITY PROTECTION

on:
  push:
    branches: [multyfi-v2.4.9-reliability-protection]
  workflow_dispatch:

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Apply v2.4.9 source
        shell: bash
        run: |
          set -euo pipefail
          python3 hotfix/run_v249.py | tee apply-v249.log

      - name: Build test and lint
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --console=plain -p android-stable \
            :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease \
            | tee build-v249.log

      - name: Verify version and standalone architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c 'include(\":app\")' android-stable/settings.gradle)" -eq 1
          ! grep -q 'include(":child")' android-stable/settings.gradle
          M=android-stable/app/src/main
          ! grep -R -E 'LanMasterRelayService|LanChildRelayService|RelayState|AppRole\.isChild|local-LAN|MASTER/CHILD' "$M"
          grep -q 'versionCode 249' android-stable/app/build.gradle
          grep -q "versionName '2.4.9'" android-stable/app/build.gradle
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging android-stable/app/build/outputs/apk/debug/app-debug.apk | tee badging-v249.txt
          grep -q "versionCode='249'" badging-v249.txt
          grep -q "versionName='2.4.9'" badging-v249.txt
          grep -q "application-label:'Multyfi AutoBuy'" badging-v249.txt

      - name: Verify listener recovery and stale-state cleanup
        shell: bash
        run: |
          set -euo pipefail
          M=android-stable/app/src/main/java/com/suhas/multyfiautobuy/stable
          S="$M/ProductionNotificationService.java"
          MON="$M/StrategyMonitorService.java"
          test -f "$M/NotificationListenerHealth.java"
          grep -q 'NotificationListenerHealth.markConnected(this)' "$S"
          grep -q 'NotificationListenerHealth.markCallback(this)' "$S"
          grep -q 'NotificationListenerHealth.requestRebindNow(this)' "$S"
          grep -q 'NotificationListenerHealth.ensureBound(this)' "$MON"
          grep -q 'REBIND_RETRY_MS = 5_000L' "$M/NotificationListenerHealth.java"
          grep -q 'STALE EARLY EXIT CLEARED — GROWW FLAT' "$S"
          grep -q 'BrokerFlatCleanupPolicy.canClear' "$S"
          grep -q 'entryCannotFillLater' "$S"
          grep -q 'NotificationListenerHealth.isConnected()' "$M/ProductionActivity.java"

      - name: Verify target and stop protection
        shell: bash
        run: |
          set -euo pipefail
          M=android-stable/app/src/main/java/com/suhas/multyfiautobuy/stable
          MON="$M/StrategyMonitorService.java"
          grep -q 'WATCH_INTERVAL_MS = 250L' "$M/DailyRiskPolicy.java"
          grep -q 'IntradayProtectionPolicy.multyfiStopHit' "$MON"
          grep -q 'IntradayProtectionPolicy.targetHit' "$MON"
          grep -q 'MULTYFI TARGET + STOP WATCH ARMED' "$MON"
          grep -q 'MULTYFI STOP-LOSS EXIT SUBMITTED' "$MON"
          grep -q 'GrowwClient.placeMultyfiStopMarketSell' "$MON"
          grep -q 'placeMultyfiStopMarketSell' "$M/GrowwClient.java"
          grep -q 'multyfi_stop_loss_price' "$M/Strategy.java"

      - name: Verify proven direct early SELL is unchanged in priority
        shell: bash
        run: |
          set -euo pipefail
          M=android-stable/app/src/main/java/com/suhas/multyfiautobuy/stable
          S="$M/ProductionNotificationService.java"
          grep -q 'EARLY_EXIT_PRIORITY = -4' "$M/PriorityExecutors.java"
          grep -q 'ENTRY_PRIORITY = -4' "$M/PriorityExecutors.java"
          grep -q 'prestartCoreThread()' "$M/PriorityExecutors.java"
          grep -q 'TokenManager.hotTokenOrEmpty()' "$S"
          grep -q 'FastExitSubmissionGate.begin' "$S"
          grep -q 'DirectEarlyExitPolicy.canDirectMarketSell' "$S"
          grep -q 'GrowwClient.placeEarlyExitMarketSell' "$S"
          grep -q 'Groww MARKET SELL was called before audit logging.' "$S"
          grep -q 'Groww order/create was called before audit logging.' "$S"
          python3 - <<'PY'
          from pathlib import Path
          s=Path('android-stable/app/src/main/java/com/suhas/multyfiautobuy/stable/ProductionNotificationService.java').read_text()
          sell=s.index('GrowwClient.ApiResult sell = GrowwClient.placeEarlyExitMarketSell(')
          sell_log=s.index('logBackground("MULTYFI EARLY EXIT API DISPATCH"', sell)
          buy=s.index('GrowwClient.EntryResult mis = GrowwClient.placeConfirmedEntryLimit(')
          buy_log=s.index('logBackground("BUY API DISPATCH"', buy)
          assert sell < sell_log
          assert buy < buy_log
          PY

      - name: Verify unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root=Path('android-stable/app/build/test-results/testDebugUnitTest')
          tests=failures=errors=0
          for p in root.glob('TEST-*.xml'):
              x=ET.parse(p).getroot()
              tests += int(x.attrib.get('tests',0))
              failures += int(x.attrib.get('failures',0))
              errors += int(x.attrib.get('errors',0))
          print('v2.4.9',tests,failures,errors)
          assert tests >= 90
          assert failures == 0 and errors == 0
          PY

      - name: Stage release
        shell: bash
        run: |
          set -euo pipefail
          F=android-stable/v249-release
          mkdir -p "$F"
          U=$(find android-stable/app/build/outputs/apk/release -maxdepth 1 -type f -name '*unsigned*.apk' | head -n1)
          test -n "$U"
          cp "$U" "$F/Multyfi-AutoBuy-STANDALONE-v2.4.9-UNSIGNED.apk"
          cp android-stable/app/build/outputs/apk/debug/app-debug.apk "$F/Multyfi-AutoBuy-STANDALONE-v2.4.9-VALIDATION.apk"
          cp badging-v249.txt "$F/"
          cp hotfix/run_v249.py "$F/"
          SHA=$(sha256sum "$F/Multyfi-AutoBuy-STANDALONE-v2.4.9-UNSIGNED.apk" | awk '{print $1}')
          cat > "$F/RELEASE-NOTES-v2.4.9.txt" <<'EOF'
          MULTYFI AUTOBUY v2.4.9 — RELIABILITY + PROTECTION

          1. Notification listener self-healing
             - Tracks the actual Android NotificationListenerService binding, not just permission state.
             - Rebinds automatically every 5 seconds while armed if Android has dropped the listener.
             - Boot/update/user-unlock activation remains intact.

          2. Stale early-exit cleanup
             - NEW ENTRY BLOCKED — EARLY EXIT PENDING is retained as a safety gate.
             - Before blocking, Groww position is checked when the app is broker-ready.
             - If Groww is flat AND the previous entry cannot fill later, stale local state is CLOSED and the new BUY may continue.
             - A live position or non-terminal entry still blocks the new BUY.

          3. Multyfi target + stop-loss execution
             - After an MIS fill is confirmed, the 250 ms app-side price watcher arms both the Multyfi target and the Multyfi stop-loss.
             - Target hit -> full-position MARKET SELL attempt.
             - Multyfi stop-loss hit -> full-position MARKET SELL attempt.
             - The independent gross -₹2,000 emergency loss guard remains.
             - These are app-side monitored exits, not broker-native resting OCO orders. This deliberately keeps the live-proven direct Multyfi early-exit MARKET SELL path free of protective-order cancellation latency.

          4. Proven SELL path preserved
             - Eligible full-known MIS early exits still call Groww MARKET SELL before normal audit persistence/logging.
             - Prestarted critical workers, hot strategy state and hot token remain.

          Routing test remains a persistent setup test and is not required every day.
          Sign the release APK with the same permanent certificate used by v2.4.8 for an in-place update.
          EOF
          printf '%s  %s\n' "$SHA" 'Multyfi-AutoBuy-STANDALONE-v2.4.9-UNSIGNED.apk' > "$F/APK-SHA256-UNSIGNED-v2.4.9.txt"
          cat > "$F/VALIDATION-v2.4.9.json" <<EOF
          {"version":"2.4.9","version_code":249,"architecture":"STANDALONE_ONLY","listener_binding_watchdog":true,"listener_rebind_retry_ms":5000,"broker_flat_stale_exit_cleanup":true,"multyfi_target_watch":true,"multyfi_stop_watch":true,"price_watch_interval_ms":250,"gross_loss_guard_rupees":2000,"broker_native_oco":false,"direct_early_sell_preserved":true,"release_signing":"UNSIGNED_IN_CI","unsigned_sha256":"$SHA"}
          EOF
          (cd android-stable && zip -qr "v249-release/Multyfi-AutoBuy-v2.4.9-SOURCE.zip" app/src app/build.gradle settings.gradle ../hotfix/run_v248.py ../hotfix/run_v248_final.py ../hotfix/run_v249.py)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Multyfi-AutoBuy-v2.4.9-RELIABILITY-PROTECTION
          path: |
            apply-v249.log
            build-v249.log
            android-stable/v249-release/
            android-stable/app/build/reports/tests/testDebugUnitTest/
            android-stable/app/build/reports/lint-results-debug.html
          if-no-files-found: error
