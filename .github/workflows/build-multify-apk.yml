name: Build Multify AutoTrader APK

on:
  pull_request:
    branches:
      - main
    paths:
      - 'multify-apk/**'
      - '.github/workflows/build-multify-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: multify-apk
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Stage APK
        run: |
          mkdir -p build-output
          cp multify-apk/app/build/outputs/apk/debug/app-debug.apk build-output/MultifyAutoTrader-v1.0.0-debug.apk
          sha256sum build-output/MultifyAutoTrader-v1.0.0-debug.apk | tee build-output/SHA256.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: MultifyAutoTrader-APK
          path: build-output/*
          if-no-files-found: error
          retention-days: 7
