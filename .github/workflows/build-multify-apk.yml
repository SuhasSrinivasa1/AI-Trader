name: Build Multify AutoTrader APK

on:
  push:
    branches:
      - multify-apk-build-20260930
    paths:
      - 'multify-apk/**'
      - '.github/workflows/build-multify-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: multify-apk-build-20260930

      - name: Record workflow run ID immediately
        run: |
          echo "${{ github.run_id }}" > multify-apk/LAST_RUN_ID.txt
          echo "${{ github.sha }}" > multify-apk/LAST_SOURCE_SHA.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add multify-apk/LAST_RUN_ID.txt multify-apk/LAST_SOURCE_SHA.txt
          git commit -m "Record APK build run [skip ci]" || true
          git push || true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: multify-apk
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Stage APK
        run: |
          mkdir -p build-output
          cp multify-apk/app/build/outputs/apk/debug/app-debug.apk build-output/MultifyAutoTrader-v1.0.0-debug.apk
          sha256sum build-output/MultifyAutoTrader-v1.0.0-debug.apk | tee build-output/SHA256.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: MultifyAutoTrader-APK
          path: build-output/*
          if-no-files-found: error
          retention-days: 7
