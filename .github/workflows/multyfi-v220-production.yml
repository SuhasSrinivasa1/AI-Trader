name: Build Multyfi AutoBuy Pro v2.2.0 Production

on:
  pull_request:
    branches: [main]
    paths:
      - 'hotfix/apply_v220.py'
      - '.github/workflows/multyfi-v220-production.yml'
  workflow_dispatch:

jobs:
  build-and-accept:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools" "emulator" "system-images;android-36;google_apis;x86_64"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Apply v2.2.0 source update
        run: python3 hotfix/apply_v220.py

      - name: Unit tests, lint and source-built APK
        shell: bash
        run: |
          set +e
          gradle --no-daemon --console=plain -p android-stable :app:testDebugUnitTest :app:lintDebug :app:assembleDebug > build-v220.log 2>&1
          code=$?
          cat build-v220.log
          echo "$code" > build-v220-exit-code.txt
          exit 0

      - name: Stop if Gradle build failed
        run: test "$(cat build-v220-exit-code.txt)" = "0"

      - name: Verify v2.2.0 production contract
        shell: bash
        run: |
          set -euo pipefail
          ROOT=android-stable/app/src/main/java/com/suhas/multyfiautobuy/stable
          grep -q "versionName '2.2.0'" android-stable/app/build.gradle
          grep -q 'versionCode 220' android-stable/app/build.gradle
          grep -q 'DEFAULT_FREE_RECOMMENDATION_BUDGET = 5_000d' "$ROOT/AppPrefs.java"
          grep -q 'FREE recommendation amount' "$ROOT/ProductionActivity.java"
          grep -q 'qty=floor(amount/cap)' "$ROOT/ProductionNotificationService.java"
          grep -q 'requiredSellPrice' "$ROOT/DeliveryChargeCalculator.java"
          grep -q 'DEFAULT_NET_PROFIT_PERCENT = 6.0d' "$ROOT/DeliveryChargeCalculator.java"
          grep -q 'NET 6% TARGET GTT CONFIRMED ACTIVE' "$ROOT/StrategyMonitorService.java"
          grep -q 'createTargetGtt' "$ROOT/GrowwClient.java"
          grep -q 'BUY completed' "$ROOT/TradeEventNotifier.java"
          grep -q 'Auto trading paused' "$ROOT/TradeEventNotifier.java"
          grep -q 'IMPORTANCE_MIN' "$ROOT/StrategyMonitorService.java"
          grep -q 'recoverActiveStopLossGtt' "$ROOT/GrowwClient.java"
          grep -q 'ARMED 24×7 — PRODUCTION POLICY' "$ROOT/ProductionActivity.java"

      - name: Verify APK signature
        run: $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs android-stable/app/build/outputs/apk/debug/app-debug.apk

      - name: Name source-built artifact
        run: cp android-stable/app/build/outputs/apk/debug/app-debug.apk android-stable/app/build/outputs/apk/debug/Multyfi-AutoBuy-Pro-S24-Android16-v2.2.0.apk

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 16 install and two successful cold launches
        timeout-minutes: 20
        shell: bash
        run: |
          set +e
          OUT=android-stable/app/build/outputs/apk/debug
          LOG="$OUT/acceptance-v220.log"
          mkdir -p "$OUT"
          : > "$LOG"
          code=0
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          export ANDROID_SDK_HOME="$RUNNER_TEMP/android-sdk-home"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_SDK_HOME/.android"
          AVD_PATH="$ANDROID_AVD_HOME/s24_v220_api36.avd"
          echo no | avdmanager create avd --force --name s24_v220_api36 --package 'system-images;android-36;google_apis;x86_64' --device 'pixel_8_pro' --path "$AVD_PATH" >> "$LOG" 2>&1 || code=1
          "$ANDROID_HOME/emulator/emulator" -avd s24_v220_api36 -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none > "$OUT/emulator-v220.log" 2>&1 &
          EMULATOR_PID=$!
          timeout 240 adb wait-for-device >> "$LOG" 2>&1 || code=1
          booted=0
          for i in $(seq 1 100); do
            state=$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$state" = "1" ]; then booted=1; break; fi
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then break; fi
            sleep 4
          done
          if [ "$booted" != "1" ]; then echo 'Android 16 emulator did not boot.' >> "$LOG"; code=1; fi
          APK="$OUT/Multyfi-AutoBuy-Pro-S24-Android16-v2.2.0.apk"
          launch_ok() {
            n="$1"
            for attempt in 1 2 3; do
              timeout 60 adb wait-for-device >> "$LOG" 2>&1 || true
              adb shell am force-stop com.suhas.multyfiautobuy.stable >/dev/null 2>&1 || true
              sleep 2
              adb shell am start -W -n com.suhas.multyfiautobuy.stable/.MainActivity > "$OUT/cold-launch-v220-$n.txt" 2>&1
              sleep 10
              adb shell pidof com.suhas.multyfiautobuy.stable > "$OUT/pid-v220-$n.txt" 2>&1
              if test -s "$OUT/pid-v220-$n.txt"; then return 0; fi
              echo "Launch $n attempt $attempt did not leave a process alive." >> "$LOG"
              sleep 6
            done
            return 1
          }
          if [ "$booted" = "1" ]; then
            adb install -r "$APK" > "$OUT/install-v220.txt" 2>&1 || code=1
            grep -q Success "$OUT/install-v220.txt" || code=1
            adb shell pm grant com.suhas.multyfiautobuy.stable android.permission.POST_NOTIFICATIONS >> "$LOG" 2>&1 || code=1
            adb logcat -c
            launch_ok 1 || code=1
            timeout 30 adb shell uiautomator dump /sdcard/multyfi-v220-ui.xml >> "$LOG" 2>&1 || code=1
            adb pull /sdcard/multyfi-v220-ui.xml "$OUT/ui-v220.xml" >> "$LOG" 2>&1 || code=1
            grep -q 'Multyfi AutoBuy Pro' "$OUT/ui-v220.xml" || code=1
            grep -q 'source-built production release 2.2.0' "$OUT/ui-v220.xml" || code=1
            found_free=0
            found_image=0
            for i in $(seq 1 7); do
              adb shell input swipe 500 1800 500 300 650
              sleep 1
              timeout 30 adb shell uiautomator dump /sdcard/multyfi-v220-scroll-$i.xml >> "$LOG" 2>&1 || true
              adb pull /sdcard/multyfi-v220-scroll-$i.xml "$OUT/ui-v220-scroll-$i.xml" >> "$LOG" 2>&1 || true
              grep -q 'FREE recommendation amount' "$OUT/ui-v220-scroll-$i.xml" && found_free=1
              grep -q 'MONTHLY IMAGE GTT IMPORT' "$OUT/ui-v220-scroll-$i.xml" && found_image=1
            done
            test "$found_free" = "1" || code=1
            test "$found_image" = "1" || code=1
            adb exec-out screencap -p > "$OUT/startup-v220.png" 2>> "$LOG"
            launch_ok 2 || code=1
            adb logcat -d -v threadtime > "$OUT/logcat-v220.txt" 2>&1
            if grep -E 'FATAL EXCEPTION|Process: com.suhas.multyfiautobuy.stable|ClassNotFoundException.*com.suhas.multyfiautobuy.stable' "$OUT/logcat-v220.txt" >> "$LOG"; then code=1; fi
          else
            touch "$OUT/install-v220.txt" "$OUT/cold-launch-v220-1.txt" "$OUT/cold-launch-v220-2.txt" "$OUT/pid-v220-1.txt" "$OUT/pid-v220-2.txt" "$OUT/ui-v220.xml" "$OUT/logcat-v220.txt" "$OUT/startup-v220.png"
          fi
          echo "$code" > "$OUT/acceptance-v220-exit-code.txt"
          timeout 15 adb emu kill >> "$LOG" 2>&1 || true
          exit 0

      - name: Upload v2.2.0 APK and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Multyfi-AutoBuy-Pro-S24-Android16-v2.2.0
          path: |
            build-v220.log
            build-v220-exit-code.txt
            android-stable/app/build/outputs/apk/debug/Multyfi-AutoBuy-Pro-S24-Android16-v2.2.0.apk
            android-stable/app/build/outputs/apk/debug/acceptance-v220.log
            android-stable/app/build/outputs/apk/debug/acceptance-v220-exit-code.txt
            android-stable/app/build/outputs/apk/debug/install-v220.txt
            android-stable/app/build/outputs/apk/debug/cold-launch-v220-1.txt
            android-stable/app/build/outputs/apk/debug/cold-launch-v220-2.txt
            android-stable/app/build/outputs/apk/debug/pid-v220-1.txt
            android-stable/app/build/outputs/apk/debug/pid-v220-2.txt
            android-stable/app/build/outputs/apk/debug/ui-v220*.xml
            android-stable/app/build/outputs/apk/debug/logcat-v220.txt
            android-stable/app/build/outputs/apk/debug/startup-v220.png
            android-stable/app/build/reports/tests/testDebugUnitTest/
            android-stable/app/build/reports/lint-results-debug.html
          if-no-files-found: warn

      - name: Stop if Android 16 acceptance failed
        run: test "$(cat android-stable/app/build/outputs/apk/debug/acceptance-v220-exit-code.txt)" = "0"
