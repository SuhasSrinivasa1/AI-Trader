name: Export Android apksigner 35.0.0

on:
  push:
    paths:
      - '.github/workflows/export-apksigner-v227.yml'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "build-tools;35.0.0"
      - name: Stage apksigner
        run: |
          mkdir -p export/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" export/apksigner
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" export/lib/apksigner.jar
          chmod +x export/apksigner
      - uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-35.0.0
          retention-days: 7
          path: export/
