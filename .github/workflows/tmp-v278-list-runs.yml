name: TEMP List v2.7.8 Runs

# kick
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-v278-list-runs.yml']

permissions:
  actions: read
  contents: write

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: List runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-status
          gh run list --repo SuhasSrinivasa1/AI-Trader --workflow multyfi-v278-zero-buffer-reentry-stable.yml --limit 15 --json databaseId,event,status,conclusion,headBranch,headSha,createdAt > ci-status/v278-runs.json
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add ci-status/v278-runs.json
          git commit -m 'TEMP list v2.7.8 runs [skip ci]' || true
          git push origin HEAD:main
