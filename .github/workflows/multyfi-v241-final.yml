name: Multyfi v2.4.1 FINAL

on:
  push:
    branches: [multyfi-v2.4.1-hard-off-gross-loss]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDKs
        run: |
          yes | sdkmanager \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "platform-tools" \
            "emulator" \
            "system-images;android-36;google_apis;x86_64" \
            "system-images;android-29;google_apis;x86_64"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Apply v2.4.1 update
        shell: bash
        run: |
          set -euo pipefail
          python3 hotfix/run_v241.py | tee apply-v241.log

      - name: Unit tests lint and release builds
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --console=plain -p android-stable \
            :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease \
            :child:testDebugUnitTest :child:lintDebug :child:assembleDebug :child:assembleRelease \
            | tee build-v241.log

      - name: Verify v2.4.1 contracts
        shell: bash
        run: |
          set -euo pipefail
          M=android-stable/app/src/main/java/com/suhas/multyfiautobuy/stable
          C=android-stable/child/src/main/java/com/suhas/multyfiautobuy/stable
          MT=android-stable/app/src/test/java/com/suhas/multyfiautobuy/stable
          CT=android-stable/child/src/test/java/com/suhas/multyfiautobuy/stable
          grep -q "versionCode 241" android-stable/app/build.gradle
          grep -q "versionName '2.4.1'" android-stable/app/build.gradle
          grep -q "versionCode 241" android-stable/child/build.gradle
          grep -q "versionName '2.4.1'" android-stable/child/build.gradle
          grep -q "applicationId 'com.suhas.multyfiautobuy.child'" android-stable/child/build.gradle
          grep -q "minSdk 26" android-stable/child/build.gradle
          grep -q "NET_PROFIT_TARGET = 5000d" "$M/DailyRiskPolicy.java"
          grep -q "GROSS_LOSS_LIMIT = 2000d" "$M/DailyRiskPolicy.java"
          grep -q "₹2,000 GROSS LOSS THRESHOLD HIT — DAY LOCKED" "$M/StrategyMonitorService.java"
          grep -q "NO broker-side stop by design" "$M/StrategyMonitorService.java"
          grep -q "placeRiskMarketSell" "$M/GrowwClient.java"
          grep -q "AppRuntimeControl.deactivate(this)" "$M/ProductionActivity.java"
          grep -q "if (!AppPrefs.isArmed(this)) return;" "$M/ProductionNotificationService.java"
          grep -q "if (!AppPrefs.isArmed(c)) return;" "$M/AppRole.java"
          grep -q "!AppPrefs.isArmed(c)" "$M/LanMasterRelayService.java"
          grep -q "!AppPrefs.isArmed(c)" "$C/LanChildRelayService.java"
          grep -q "PRIVATE LG G7 CHILD CONSOLE" "$C/ProductionActivity.java"
          grep -q "if (!AppRole.isChild(this))" "$C/ProductionActivity.java"
          ! grep -q "AppPrefs.quantityForBudget(AppPrefs.intradayBudget(this)," "$C/ProductionActivity.java"
          ! grep -q 'android:name=".MultyfiNotificationService"' android-stable/child/src/main/AndroidManifest.xml
          grep -q "currentStockGrossMinusTwoThousandTriggersImmediately" "$MT/ProfitTargetPolicyTest.java"
          grep -q "currentStockGrossMinusTwoThousandTriggersImmediately" "$CT/ProfitTargetPolicyTest.java"
          grep -q "offAndFlatMeansAllBackgroundCanStop" "$MT/RuntimePowerPolicyTest.java"
          grep -q "offAndFlatMeansAllBackgroundCanStop" "$CT/RuntimePowerPolicyTest.java"

      - name: Stage unsigned APKs and source
        shell: bash
        run: |
          set -euo pipefail
          F=android-stable/v241-final
          mkdir -p "$F"
          MU=$(find android-stable/app/build/outputs/apk/release -maxdepth 1 -type f -name '*unsigned*.apk' | head -n1)
          CU=$(find android-stable/child/build/outputs/apk/release -maxdepth 1 -type f -name '*unsigned*.apk' | head -n1)
          test -n "$MU" && test -n "$CU"
          cp "$MU" "$F/Multyfi-AutoBuy-MASTER-S24-Android16-v2.4.1-UNSIGNED.apk"
          cp "$CU" "$F/Multyfi-AutoBuy-CHILD-LG-G7-ThinQ-v2.4.1-UNSIGNED.apk"
          cp android-stable/app/build/outputs/apk/debug/app-debug.apk "$F/master-validation.apk"
          cp android-stable/child/build/outputs/apk/debug/child-debug.apk "$F/child-validation.apk"
          cp -R android-stable/app/src/main "$F/master-source"
          cp -R android-stable/app/src/test "$F/master-tests"
          cp -R android-stable/child/src/main "$F/child-source"
          cp -R android-stable/child/src/test "$F/child-tests"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: MASTER Android 16 smoke
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          F=android-stable/v241-final
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd36" ANDROID_SDK_HOME="$RUNNER_TEMP/sdk36"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_SDK_HOME/.android"
          echo no | avdmanager create avd --force --name master36 \
            --package 'system-images;android-36;google_apis;x86_64' \
            --device 'pixel_8_pro' --path "$ANDROID_AVD_HOME/master36.avd"
          "$ANDROID_HOME/emulator/emulator" -avd master36 -no-window \
            -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim \
            > "$F/master-emulator.log" 2>&1 & PID=$!
          trap 'timeout 15 adb emu kill >/dev/null 2>&1 || true; kill "$PID" >/dev/null 2>&1 || true' EXIT
          timeout 240 adb wait-for-device
          for i in $(seq 1 100); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && break
            sleep 3
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb install -r "$F/master-validation.apk" | tee "$F/master-install.txt"
          grep -q Success "$F/master-install.txt"
          adb shell pm grant com.suhas.multyfiautobuy.stable android.permission.POST_NOTIFICATIONS || true
          adb logcat -c
          for n in 1 2; do
            adb shell am force-stop com.suhas.multyfiautobuy.stable
            adb shell am start -W -n com.suhas.multyfiautobuy.stable/.MainActivity > "$F/master-launch-$n.txt"
            sleep 4
            adb shell pidof com.suhas.multyfiautobuy.stable > "$F/master-pid-$n.txt"
            test -s "$F/master-pid-$n.txt"
          done
          adb shell uiautomator dump /sdcard/master.xml >/dev/null
          adb pull /sdcard/master.xml "$F/master-ui.xml" >/dev/null
          grep -q 'Multyfi AutoBuy MASTER' "$F/master-ui.xml"
          grep -q '2.4.1' "$F/master-ui.xml"
          grep -q 'OFF' "$F/master-ui.xml"
          adb logcat -d > "$F/master-logcat.txt"
          ! grep -E 'FATAL EXCEPTION|Process: com.suhas.multyfiautobuy.stable' "$F/master-logcat.txt"
          adb emu kill >/dev/null 2>&1 || true
          wait "$PID" 2>/dev/null || true
          trap - EXIT

      - name: CHILD Android 10 smoke
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          F=android-stable/v241-final
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd29" ANDROID_SDK_HOME="$RUNNER_TEMP/sdk29"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_SDK_HOME/.android"
          echo no | avdmanager create avd --force --name child29 \
            --package 'system-images;android-29;google_apis;x86_64' \
            --device 'pixel_2' --path "$ANDROID_AVD_HOME/child29.avd"
          "$ANDROID_HOME/emulator/emulator" -avd child29 -no-window \
            -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim \
            > "$F/child-emulator.log" 2>&1 & PID=$!
          trap 'timeout 15 adb emu kill >/dev/null 2>&1 || true; kill "$PID" >/dev/null 2>&1 || true' EXIT
          timeout 240 adb wait-for-device
          for i in $(seq 1 100); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && break
            sleep 3
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb install -r "$F/child-validation.apk" | tee "$F/child-install.txt"
          grep -q Success "$F/child-install.txt"
          adb logcat -c
          for n in 1 2; do
            adb shell am force-stop com.suhas.multyfiautobuy.child
            adb shell am start -W -n com.suhas.multyfiautobuy.child/com.suhas.multyfiautobuy.stable.MainActivity > "$F/child-launch-$n.txt"
            sleep 4
            adb shell pidof com.suhas.multyfiautobuy.child > "$F/child-pid-$n.txt"
            test -s "$F/child-pid-$n.txt"
          done
          adb shell uiautomator dump /sdcard/child.xml >/dev/null
          adb pull /sdcard/child.xml "$F/child-ui.xml" >/dev/null
          grep -q 'Multyfi AutoBuy CHILD' "$F/child-ui.xml"
          grep -q 'PRIVATE LG G7 CHILD CONSOLE' "$F/child-ui.xml"
          grep -q '2.4.1' "$F/child-ui.xml"
          grep -q 'OFF' "$F/child-ui.xml"
          ! grep -q 'OPEN NOTIFICATION ACCESS' "$F/child-ui.xml"
          adb logcat -d > "$F/child-logcat.txt"
          ! grep -E 'FATAL EXCEPTION|Process: com.suhas.multyfiautobuy.child' "$F/child-logcat.txt"
          adb emu kill >/dev/null 2>&1 || true
          wait "$PID" 2>/dev/null || true
          trap - EXIT

      - name: Release metadata
        shell: bash
        run: |
          set -euo pipefail
          F=android-stable/v241-final
          MS=$(sha256sum "$F/Multyfi-AutoBuy-MASTER-S24-Android16-v2.4.1-UNSIGNED.apk" | awk '{print $1}')
          CS=$(sha256sum "$F/Multyfi-AutoBuy-CHILD-LG-G7-ThinQ-v2.4.1-UNSIGNED.apk" | awk '{print $1}')
          cat > "$F/VALIDATION-v2.4.1.json" <<EOF
          {"version":"2.4.1","version_code":241,"master_package":"com.suhas.multyfiautobuy.stable","child_package":"com.suhas.multyfiautobuy.child","master_unsigned_sha256":"$MS","child_unsigned_sha256":"$CS","unit_tests_master":"PASS","unit_tests_child":"PASS","lint_master":"PASS","lint_child":"PASS","master_android_16_smoke":"PASS","child_android_10_smoke":"PASS","off_mode":"relay_monitor_and_master_listener_stopped_when_flat","active_trade_hard_off":"blocked_for_safety","daily_profit_target":"estimated NET +5000 after published intraday charges","loss_trigger":"GROSS -2000 immediate market exit and day lock","multyfi_stop":"ignored_for_intraday_execution","intraday_broker_side_stop":"NONE_BY_USER_REQUEST","watch_interval_ms":250,"live_broker_test":"NOT PERFORMED","physical_two_phone_relay_test":"NOT PERFORMED"}
          EOF
          cat > "$F/RELEASE-NOTES-v2.4.1.txt" <<'EOF'
          MULTYFI AUTOBUY v2.4.1 — HARD OFF / NET PROFIT / GROSS LOSS
          - Toggle OFF while flat: trading monitor, local MASTER/CHILD relay, and MASTER Multyfi listener runtime stop.
          - Toggle OFF is blocked while an active strategy exists, so an open position cannot be abandoned by the UI.
          - +₹5,000 remains estimated NET profit after current published Groww/NSE intraday charges.
          - -₹2,000 is GROSS price P&L before charges. When detected, trading locks for the IST day and a MARKET SELL is submitted immediately.
          - Original Multyfi stop is ignored for intraday execution; no broker-side intraday stop is created by design.
          - Full-fill fast exits use one MARKET sell order-create request. Partial fills cancel the remaining BUY first, then sell the held position.
          - CHILD offline acceptance is independent of configured budget and CHILD no longer shows Notification Access.
          - Exchange slippage/network failure can make realised loss exceed ₹2,000 gross or realised net profit differ from the trigger estimate.
          - CI does not place live Groww orders and does not replace a physical S24↔LG relay test.
          EOF

      - name: Upload final build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Multyfi-AutoBuy-v2.4.1-FINAL-UNSIGNED
          path: |
            apply-v241.log
            build-v241.log
            android-stable/v241-final/
            android-stable/app/build/reports/tests/testDebugUnitTest/
            android-stable/child/build/reports/tests/testDebugUnitTest/
            android-stable/app/build/reports/lint-results-debug.html
            android-stable/child/build/reports/lint-results-debug.html
          if-no-files-found: warn
