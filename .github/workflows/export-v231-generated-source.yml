name: Export generated v2.3.1 source

on:
  push:
    branches: [multyfi-v2.3.2-source-inspect]
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Apply v2.3.1 release chain
        run: python3 hotfix/run_v231.py
      - name: Upload generated source
        uses: actions/upload-artifact@v4
        with:
          name: multyfi-v231-generated-source
          path: |
            android-stable/app/src/main/java/com/suhas/multyfiautobuy/stable/
            android-stable/app/src/test/java/com/suhas/multyfiautobuy/stable/
            android-stable/app/src/main/res/
            android-stable/app/build.gradle
          if-no-files-found: error
