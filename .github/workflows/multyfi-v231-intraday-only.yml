name: Build Multyfi AutoBuy Pro v2.3.1 Intraday Only

on:
  pull_request:
    branches: [main]
    paths:
      - 'hotfix/run_v231.py'
      - '.github/workflows/multyfi-v231-intraday-only.yml'
  workflow_dispatch:

jobs:
  build-test-android16:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools" "emulator" "system-images;android-36;google_apis;x86_64"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Apply v2.3.1 intraday-only update
        shell: bash
        run: |
          set -euo pipefail
          python3 hotfix/run_v231.py | tee apply-v231.log

      - name: Unit tests, lint and APK builds
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --console=plain -p android-stable \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug \
            :app:assembleRelease | tee build-v231.log

      - name: Verify minimal-scope contracts
        shell: bash
        run: |
          set -euo pipefail
          ROOT=android-stable/app/src/main/java/com/suhas/multyfiautobuy/stable
          TEST=android-stable/app/src/test/java/com/suhas/multyfiautobuy/stable
          grep -q "versionCode 231" android-stable/app/build.gradle
          grep -q "versionName '2.3.1'" android-stable/app/build.gradle
          grep -q "class IntradayOnlyPolicy" "$ROOT/IntradayOnlyPolicy.java"
          grep -q "IGNORED — INTRADAY-ONLY MODE" "$ROOT/ProductionNotificationService.java"
          grep -q "AppPrefs.intradayBudget(this)" "$ROOT/ProductionNotificationService.java"
          grep -q "queueEarlyExit(earlyExit)" "$ROOT/ProductionNotificationService.java"
          grep -q "MULTYFI EARLY EXIT PERSISTED" "$ROOT/ProductionNotificationService.java"
          grep -q "SAVE INTRADAY SETTINGS" "$ROOT/ProductionActivity.java"
          ! grep -q "Swing / ordinary equity budget" "$ROOT/ProductionActivity.java"
          ! grep -q "Multibagger budget" "$ROOT/ProductionActivity.java"
          ! grep -q "Free recommendation budget" "$ROOT/ProductionActivity.java"
          grep -q "rejectsSwingMultibaggerFreeAndUnlabelled" "$TEST/IntradayOnlyPolicyTest.java"

      - name: Stage validation and unsigned release APKs
        shell: bash
        run: |
          set -euo pipefail
          FINAL=android-stable/app/build/outputs/apk/v231
          mkdir -p "$FINAL"
          cp android-stable/app/build/outputs/apk/debug/app-debug.apk \
            "$FINAL/Multyfi-AutoBuy-Pro-S24-Android16-v2.3.1-VALIDATION.apk"
          UNSIGNED=$(find android-stable/app/build/outputs/apk/release -maxdepth 1 -type f -name '*unsigned*.apk' | head -n 1)
          test -n "$UNSIGNED"
          cp "$UNSIGNED" "$FINAL/Multyfi-AutoBuy-Pro-S24-Android16-v2.3.1-UNSIGNED.apk"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 16 install and two cold launches
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          FINAL=android-stable/app/build/outputs/apk/v231
          APK="$FINAL/Multyfi-AutoBuy-Pro-S24-Android16-v2.3.1-VALIDATION.apk"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          export ANDROID_SDK_HOME="$RUNNER_TEMP/android-sdk-home"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_SDK_HOME/.android"
          echo no | avdmanager create avd --force --name s24_v231 --package 'system-images;android-36;google_apis;x86_64' --device 'pixel_8_pro' --path "$ANDROID_AVD_HOME/s24_v231.avd"
          "$ANDROID_HOME/emulator/emulator" -avd s24_v231 -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none > "$FINAL/emulator-v231.log" 2>&1 &
          EMULATOR_PID=$!
          trap 'timeout 15 adb emu kill >/dev/null 2>&1 || true; kill "$EMULATOR_PID" >/dev/null 2>&1 || true' EXIT
          timeout 240 adb wait-for-device
          booted=0
          for i in $(seq 1 100); do
            state=$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$state" = "1" ]; then booted=1; break; fi
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then break; fi
            sleep 4
          done
          test "$booted" = "1"
          adb install -r "$APK" | tee "$FINAL/install-v231.txt"
          grep -q Success "$FINAL/install-v231.txt"
          adb shell pm grant com.suhas.multyfiautobuy.stable android.permission.POST_NOTIFICATIONS
          adb logcat -c
          for n in 1 2; do
            adb shell am force-stop com.suhas.multyfiautobuy.stable
            sleep 2
            adb shell am start -W -n com.suhas.multyfiautobuy.stable/.MainActivity | tee "$FINAL/cold-launch-v231-$n.txt"
            sleep 8
            adb shell pidof com.suhas.multyfiautobuy.stable | tee "$FINAL/pid-v231-$n.txt"
            test -s "$FINAL/pid-v231-$n.txt"
          done
          adb shell uiautomator dump /sdcard/v231-ui.xml
          adb pull /sdcard/v231-ui.xml "$FINAL/ui-v231.xml"
          grep -q 'Multyfi AutoBuy Pro' "$FINAL/ui-v231.xml"
          grep -q '2.3.1' "$FINAL/ui-v231.xml"
          grep -q 'INTRADAY SETTINGS' "$FINAL/ui-v231.xml"
          ! grep -q 'Swing / ordinary equity budget' "$FINAL/ui-v231.xml"
          adb exec-out screencap -p > "$FINAL/startup-v231.png"
          adb logcat -d -v threadtime > "$FINAL/logcat-v231.txt"
          if grep -E 'FATAL EXCEPTION|Process: com.suhas.multyfiautobuy.stable|ClassNotFoundException.*com.suhas.multyfiautobuy.stable' "$FINAL/logcat-v231.txt"; then exit 1; fi

      - name: Create validation manifest and release notes
        shell: bash
        run: |
          set -euo pipefail
          FINAL=android-stable/app/build/outputs/apk/v231
          SHA=$(sha256sum "$FINAL/Multyfi-AutoBuy-Pro-S24-Android16-v2.3.1-UNSIGNED.apk" | awk '{print $1}')
          cat > "$FINAL/VALIDATION-v2.3.1.json" <<EOF
          {
            "version": "2.3.1",
            "version_code": 231,
            "package": "com.suhas.multyfiautobuy.stable",
            "unsigned_release_sha256": "$SHA",
            "unit_tests": "PASS",
            "lint": "PASS",
            "android16_install": "PASS",
            "cold_launch_1": "PASS",
            "cold_launch_2": "PASS",
            "intraday_only": true,
            "swing_entries": false,
            "multibagger_entries": false,
            "free_entries": false,
            "free_intraday_entries": false,
            "authoritative_early_sell_retained": true
          }
          EOF
          cat > "$FINAL/RELEASE-NOTES-v2.3.1.txt" <<'EOF'
          MULTYFI AUTOBUY PRO v2.3.1 — INTRADAY ONLY

          Minimal-scope update from v2.3.0:
          - Accepts new paid Multyfi Intraday/Intra day/MIS calls only.
          - Ignores Swing, Multibagger, Free, Free Intraday and unlabelled equity calls.
          - Shows only the Intraday budget and entry-buffer settings.
          - Keeps the working Intraday entry flow unchanged.
          - Keeps stop protection and authoritative Multyfi early-sell handling unchanged.
          - Existing active strategies remain monitored so updates do not orphan positions.
          EOF

      - name: Upload v2.3.1 package and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Multyfi-AutoBuy-Pro-S24-Android16-v2.3.1-INTRADAY-ONLY
          path: |
            apply-v231.log
            build-v231.log
            android-stable/app/build/outputs/apk/v231/
            android-stable/app/build/reports/tests/testDebugUnitTest/
            android-stable/app/build/reports/lint-results-debug.html
            android-stable/app/src/main/java/com/suhas/multyfiautobuy/stable/IntradayOnlyPolicy.java
          if-no-files-found: warn
