name: Univest v2.0.2 Reliability + Averaging Builder

on:
  push:
    paths:
      - '.github/workflows/univest-v202-build.yml'
      - '.build-temp/univest-v202-final/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct v2.0.2 source
        run: |
          rm -rf UnivestAutoTrade
          mkdir UnivestAutoTrade
          tar -xzf .build-temp/univest-v202-final/source.tar.gz -C UnivestAutoTrade

      - name: Validate locked production contract
        shell: bash
        run: |
          set -euo pipefail
          grep -R -q 'com.univest.capp' UnivestAutoTrade/app/src/main/java
          grep -R -q 'ENTRY_BUDGET = 20000' UnivestAutoTrade/app/src/main/java
          grep -R -q 'REENTRY_BUDGET = 5000' UnivestAutoTrade/app/src/main/java
          grep -R -q 'AVERAGE_BUDGET = 5000' UnivestAutoTrade/app/src/main/java
          grep -R -q 'MAX_AVERAGE_LEVELS = 4' UnivestAutoTrade/app/src/main/java
          grep -R -q 'AVERAGE_DROPS = {0.02, 0.04, 0.06, 0.08}' UnivestAutoTrade/app/src/main/java
          grep -R -q 'PendingSignalStore' UnivestAutoTrade/app/src/main/java
          grep -R -q 'ENTRY_DUPLICATE_BROKER_HOLDING' UnivestAutoTrade/app/src/main/java
          grep -R -q 'recentSignalNotificationsToday' UnivestAutoTrade/app/src/main/java
          grep -R -q 'archive/' UnivestAutoTrade/app/src/main/java/com/suhas/multyfideliverybuy/DiagnosticsStore.java
          grep -q "versionCode 202" UnivestAutoTrade/app/build.gradle
          grep -q "versionName '2.0.2'" UnivestAutoTrade/app/build.gradle

      - name: Unit test and build unsigned release
        working-directory: UnivestAutoTrade
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain clean testReleaseUnitTest assembleRelease 2>&1 | tee /tmp/gradle-v202.log

      - name: Collect and validate unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          APK="$(find UnivestAutoTrade/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -1)"
          test -n "$APK" && test -s "$APK"
          cp "$APK" release/Univest-AutoTrade-v2.0.2-UNSIGNED.apk
          cp /tmp/gradle-v202.log release/GRADLE-BUILD-TEST.log
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee release/APK-BADGING.txt
          grep -q "package: name='com.suhas.multyfideliverybuy'" release/APK-BADGING.txt
          grep -q "versionCode='202'" release/APK-BADGING.txt
          grep -q "versionName='2.0.2'" release/APK-BADGING.txt
          unzip -t "$APK" | tee release/ZIP-INTEGRITY.txt
          sha256sum release/Univest-AutoTrade-v2.0.2-UNSIGNED.apk > release/APK-SHA256.txt
          {
            echo "build=SUCCESS"
            echo "package=com.suhas.multyfideliverybuy"
            echo "versionCode=202"
            echo "versionName=2.0.2"
            echo "univest_source_lock=com.univest.capp"
            echo "cnc_only=true"
            echo "initial_budget=20000"
            echo "back_in_range_budget=5000"
            echo "downward_average_budget=5000"
            echo "downward_average_levels=-2,-4,-6,-8"
            echo "broker_reconciled_duplicate_check=true"
            echo "paper_state_does_not_block_live=true"
            echo "durable_signal_queue=true"
            echo "daily_signal_ui_rotation=true"
            echo "historical_export_archive=true"
          } > release/BUILD-STATUS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Univest-AutoTrade-v2.0.2-UNSIGNED
          retention-days: 7
          path: release/*
          if-no-files-found: error
