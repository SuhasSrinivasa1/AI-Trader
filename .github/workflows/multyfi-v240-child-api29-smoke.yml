name: Multyfi v2.4.0 CHILD Android10 Smoke
on:
  push:
    branches: [multyfi-v2.4.0-master-child-risk]
  workflow_dispatch:
jobs:
  child-api29:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools" "emulator" "system-images;android-29;google_apis;x86_64"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - run: python3 hotfix/run_v240_fix7.py
      - run: gradle --no-daemon --console=plain -p android-stable :child:assembleDebug
      - name: APK metadata
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android-stable/child/build/outputs/apk/debug/child-debug.apk | tee child-badging.txt
          grep -q "package: name='com.suhas.multyfiautobuy.child'" child-badging.txt
          grep -q "sdkVersion:'26'" child-badging.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 10 install and two cold launches
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p child29-smoke
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd29" ANDROID_SDK_HOME="$RUNNER_TEMP/sdk29"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_SDK_HOME/.android"
          echo no | avdmanager create avd --force --name child29 --package 'system-images;android-29;google_apis;x86_64' --device 'pixel_2' --path "$ANDROID_AVD_HOME/child29.avd"
          "$ANDROID_HOME/emulator/emulator" -avd child29 -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim > child29-smoke/emulator.log 2>&1 & PID=$!
          trap 'timeout 15 adb emu kill >/dev/null 2>&1 || true; kill "$PID" >/dev/null 2>&1 || true' EXIT
          timeout 240 adb wait-for-device
          for i in $(seq 1 100); do [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && break; sleep 3; done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          set +e
          adb install -r android-stable/child/build/outputs/apk/debug/child-debug.apk > child29-smoke/install.txt 2>&1
          RC=$?
          set -e
          cat child29-smoke/install.txt
          test "$RC" = 0
          grep -q Success child29-smoke/install.txt
          adb logcat -c
          for n in 1 2; do
            adb shell am force-stop com.suhas.multyfiautobuy.child
            adb shell am start -W -n com.suhas.multyfiautobuy.child/.MainActivity > child29-smoke/launch-$n.txt
            sleep 4
            adb shell pidof com.suhas.multyfiautobuy.child > child29-smoke/pid-$n.txt
            test -s child29-smoke/pid-$n.txt
          done
          adb shell uiautomator dump /sdcard/child.xml >/dev/null
          adb pull /sdcard/child.xml child29-smoke/ui.xml >/dev/null
          grep -q 'Multyfi AutoBuy CHILD' child29-smoke/ui.xml
          grep -q '2.4.0' child29-smoke/ui.xml
          adb logcat -d > child29-smoke/logcat.txt
          ! grep -E 'FATAL EXCEPTION|Process: com.suhas.multyfiautobuy.child' child29-smoke/logcat.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Multyfi-v2.4.0-CHILD-ANDROID10-SMOKE
          path: |
            child-badging.txt
            child29-smoke/
          if-no-files-found: warn
