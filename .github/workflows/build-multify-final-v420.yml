name: Build Multify Trader Pro v4.2 Manual Entry Final

on:
  push:
    branches:
      - multify-final-v420-manual-entry-20261006
    paths:
      - 'multify-final-v420/**'
      - '.github/workflows/build-multify-final-v420.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout v4.2 payload and stable signing material
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            multify-final-v420
            multify-final-v4/stable_signing_key.jks.b64
            .github/workflows/build-multify-final-v420.yml
          sparse-checkout-cone-mode: false

      - name: Restore latest v4.1 source and apply v4.2 patch
        shell: bash
        run: |
          set -euo pipefail
          cat multify-final-v420/source.part* | base64 -d > /tmp/multify-v410-android.tgz
          tar -xzf /tmp/multify-v410-android.tgz
          test -f android/app/build.gradle.kts
          cat multify-final-v420/patch.part* > /tmp/multify-v420.patch
          (cd android && patch -p2 --batch --forward < /tmp/multify-v420.patch)
          grep -q 'versionCode = 420' android/app/build.gradle.kts
          grep -q 'versionName = "4.2.0-manual-entry-final"' android/app/build.gradle.kts
          base64 -d multify-final-v4/stable_signing_key.jks.b64 > android/app/multify-v4-stable.jks

      - name: Verify retained rules and manual-entry contracts
        shell: bash
        run: |
          set -euo pipefail
          ROOT=android/app/src/main/java/com/multify/traderpro
          TEST=android/app/src/test/java/com/multify/traderpro/domain/NotificationParserTest.kt
          grep -q 'AVERAGE_STEP_FRACTION = 0.02' "$ROOT/engine/AdaptiveLearningMath.kt"
          grep -q 'AVERAGE_ADD_RUPEES = 5_000.0' "$ROOT/data/repository/TradingRepository.kt"
          grep -q 'take(30)' "$ROOT/data/repository/TradingRepository.kt"
          grep -q 'MAX_SHORT_RETRACEMENT_FRACTION = 1.0' "$ROOT/engine/AdaptiveLearningMath.kt"
          grep -q 'submitManualSignal' "$ROOT/data/repository/TradingRepository.kt"
          grep -q 'MANUAL.*EQUITY.*BUY' "$ROOT/domain/NotificationParser.kt"
          grep -q 'TradingEngineForegroundService' android/app/src/main/AndroidManifest.xml
          grep -q 'ContextCompat.startForegroundService' "$ROOT/service/TradingEngineForegroundService.kt"
          grep -q 'enqueueRecovery(eventId)' "$ROOT/service/TradingEngineForegroundService.kt"
          grep -q 'parsesManualBuyWithoutInventingTargetOrStop' "$TEST"
          grep -q 'parsesManualBookProfit' "$TEST"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests and lint
        working-directory: android
        run: gradle --no-daemon --console=plain :app:testDebugUnitTest :app:lintDebug

      - name: Build stable-signed APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK signature, identity and stage output
        shell: bash
        run: |
          set -euo pipefail
          OUT=android/app/build/outputs/apk/debug
          STAGE=build-output
          mkdir -p "$STAGE"
          APK="$STAGE/MultifyTraderPro-VivoY73-v4.2.0-manual-entry-final.apk"
          cp "$OUT/app-debug.apk" "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee "$STAGE/SIGNATURE.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee "$STAGE/BADGING.txt"
          grep -q "package: name='com.multify.traderpro.vivoy73final'" "$STAGE/BADGING.txt"
          grep -q "versionCode='420'" "$STAGE/BADGING.txt"
          grep -q "versionName='4.2.0-manual-entry-final-debug'" "$STAGE/BADGING.txt"
          sha256sum "$APK" | tee "$STAGE/SHA256.txt"
          cat > "$STAGE/VALIDATION-v4.2.0.txt" <<'EOF'
          Version: 4.2.0-manual-entry-final
          Manual BUY / Book Profit section: PRESENT
          Manual events use normal parser/NSE/auth/risk/Shadow/Fast Track path: VERIFIED BY SOURCE CONTRACT + TESTS
          Persistent foreground execution lane: PRESENT
          WorkManager: RECOVERY FALLBACK ONLY
          ₹5,000 averaging each further 2% decline: RETAINED
          Rolling 30-trading-day long learning: RETAINED
          Post-sell short retracement initial/cap 100%: RETAINED
          Unit tests: PASS
          Android lint: PASS
          APK build: PASS
          APK signature verification: PASS
          EOF
          (cd android && zip -qr "../$STAGE/MultifyTraderPro-v4.2.0-source.zip" . -x '.gradle/*' '*/build/*' 'app/multify-v4-stable.jks')

      - name: Upload v4.2 APK and validation
        uses: actions/upload-artifact@v4
        with:
          name: MultifyTraderPro-VivoY73-v4.2.0-manual-entry-final
          path: |
            build-output/MultifyTraderPro-VivoY73-v4.2.0-manual-entry-final.apk
            build-output/MultifyTraderPro-v4.2.0-source.zip
            build-output/SIGNATURE.txt
            build-output/BADGING.txt
            build-output/SHA256.txt
            build-output/VALIDATION-v4.2.0.txt
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/reports/lint-results-debug.html
          if-no-files-found: error
          retention-days: 14
