name: PS Shadow Trader v1.1.0 Android Build

on:
  push:
    paths:
      - 'android-stable/ps-shadow-trader-v110-build/**'
      - '.github/workflows/ps-shadow-trader-v110-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct v1.1.0 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ps-shadow-trader
          cat android-stable/ps-shadow-trader-v110-build/source.zip.b64.part* | tr -d '\r\n' | base64 -d > /tmp/ps-shadow-trader-source.zip
          echo "3c95ef00ceb1dadb86b9282f7b35d38cec6eaced9c3abdbeba247ec04ed449f6  /tmp/ps-shadow-trader-source.zip" | sha256sum -c -
          unzip -q /tmp/ps-shadow-trader-source.zip -d /tmp/ps-shadow-trader
          grep -q "versionCode 110" /tmp/ps-shadow-trader/app/build.gradle
          grep -q "versionName '1.1.0'" /tmp/ps-shadow-trader/app/build.gradle
          grep -q "AutomationService" /tmp/ps-shadow-trader/app/src/main/AndroidManifest.xml
          grep -q "EQUITY" /tmp/ps-shadow-trader/app/src/main/java/com/ps/shadowtrader/NotificationParser.java

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK
        working-directory: /tmp/ps-shadow-trader
        run: gradle --no-daemon --console=plain clean assembleRelease

      - name: Verify APK metadata
        working-directory: /tmp/ps-shadow-trader
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -1)"
          test -s "$APK"
          cp "$APK" out/PS-Shadow-Trader-v1.1.0-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging out/PS-Shadow-Trader-v1.1.0-unsigned.apk | tee out/APK-BADGING.txt
          grep -q "package: name='com.ps.shadowtrader'" out/APK-BADGING.txt
          grep -q "versionCode='110'" out/APK-BADGING.txt
          grep -q "versionName='1.1.0'" out/APK-BADGING.txt
          sha256sum out/PS-Shadow-Trader-v1.1.0-unsigned.apk | tee out/SHA256-UNSIGNED.txt

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: PS-Shadow-Trader-v1.1.0-unsigned
          retention-days: 7
          if-no-files-found: error
          path: |
            /tmp/ps-shadow-trader/out/PS-Shadow-Trader-v1.1.0-unsigned.apk
            /tmp/ps-shadow-trader/out/APK-BADGING.txt
            /tmp/ps-shadow-trader/out/SHA256-UNSIGNED.txt
