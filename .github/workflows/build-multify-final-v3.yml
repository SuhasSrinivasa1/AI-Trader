name: Build Multify Trader Pro Final v3

on:
  push:
    branches:
      - multify-final-v3-build-20261002
    paths:
      - 'multify-final-v3/**'
      - '.github/workflows/build-multify-final-v3.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore final Android project
        run: |
          cat multify-final-v3/android_src.part* | base64 -d > /tmp/multify-final-v3-android.tgz
          tar -xzf /tmp/multify-final-v3-android.tgz
          test -f android/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Stage output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/MultifyTraderPro-Final-v3.0.0-debug.apk
          sha256sum build-output/MultifyTraderPro-Final-v3.0.0-debug.apk | tee build-output/SHA256.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: MultifyTraderPro-Final-v3-APK
          path: build-output/*
          if-no-files-found: error
          retention-days: 7
