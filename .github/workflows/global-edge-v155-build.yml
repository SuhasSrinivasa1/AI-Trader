name: Global Edge AI Trader v1.5.5 Strategy Publication Build

on:
  push:
    paths:
      - '.github/workflows/global-edge-v155-build.yml'
      - 'fresh-global-edge/v155/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - name: Prepare v1.5.4 source and apply strategy publication fix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v155
          unzip -q fresh-global-edge/v154/release/Global-Edge-AI-Trader-v1.5.4-source.zip -d /tmp/v155
          SRC=/tmp/v155/Global-Edge-AI-Trader-v1.5.0-source
          python "$GITHUB_WORKSPACE/fresh-global-edge/v155/fix_v155_strategy_publication.py" "$SRC"
          cd "$SRC"
          grep -q 'versionCode = 155' app/build.gradle.kts
          grep -q 'versionName = "1.5.5"' app/build.gradle.kts
          grep -q 'maxNewLivePerPass=5' app/src/main/java/com/suhas/ucsentinel/data/repository/UCSentinelRepository.kt
          grep -q 'StrategyStatus.CHALLENGER->challengerPublished' app/src/main/java/com/suhas/ucsentinel/data/repository/UCSentinelRepository.kt
          grep -q 'GOVERNANCE_SUSPENDED' app/src/main/java/com/suhas/ucsentinel/data/repository/UCSentinelRepository.kt
          grep -q 'GOVERNANCE_PROBATION' app/src/main/java/com/suhas/ucsentinel/data/repository/UCSentinelRepository.kt
          grep -q 'score>=72' app/src/main/java/com/suhas/ucsentinel/data/repository/UCSentinelRepository.kt
          grep -q 'funnel raw' app/src/main/java/com/suhas/ucsentinel/domain/engine/ScannerEngine.kt
          grep -q 'state.strategyTournamentSummary?.message' app/src/main/java/com/suhas/ucsentinel/ui/CompactMarketScreens.kt
          grep -q 'global_live_only_flow_v154' app/src/main/java/com/suhas/ucsentinel/data/local/AppPreferences.kt
          echo "v1.5.5 source verification passed"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unit tests and release APK
        working-directory: /tmp/v155/Global-Edge-AI-Trader-v1.5.0-source
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out
          gradle --no-daemon --console=plain clean testDebugUnitTest assembleRelease 2>&1 | tee out/GRADLE-BUILD-TEST.log
          echo "Unit tests + assembleRelease: PASS" > out/TEST-RESULT-SUMMARY.txt

      - name: Recover preserved signing material
        uses: actions/download-artifact@v4
        with:
          name: Global-Edge-AI-Trader-v1.5.0-FINAL
          repository: SuhasSrinivasa1/AI-Trader
          run-id: 36146076154
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/v150-artifact

      - name: Sign and verify preserved update certificate
        working-directory: /tmp/v155/Global-Edge-AI-Trader-v1.5.0-source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out /tmp/signing
          BACKUP=$(find /tmp/v150-artifact -type f -name 'Global-Edge-AI-Trader-v1.5.0-SIGNING-BACKUP.zip' | head -n1)
          unzip -q "$BACKUP" -d /tmp/signing
          KEYSTORE=/tmp/signing/global-edge-v1.5.0.keystore
          INFO=/tmp/signing/SIGNING-INFO.txt
          STORE_PASS=$(grep '^store_password=' "$INFO" | cut -d= -f2-)
          KEY_PASS=$(grep '^key_password=' "$INFO" | cut -d= -f2-)
          UNSIGNED=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*release*.apk' | head -n1)
          OUT=out/Global-Edge-AI-Trader-v1.5.5.apk

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$KEYSTORE" --ks-pass pass:"$STORE_PASS" --key-pass pass:"$KEY_PASS" --ks-key-alias globaledge --out "$OUT" "$UNSIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$OUT" | tee out/APK-SIGNATURE-VERIFY.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$OUT" | tee out/APK-BADGING.txt
          grep -q "package: name='com.suhas.globaledgeai'" out/APK-BADGING.txt
          grep -q "versionCode='155'" out/APK-BADGING.txt
          grep -q "versionName='1.5.5'" out/APK-BADGING.txt
          CERT_SHA=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$OUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)
          test "$CERT_SHA" = "31ffa51c23b76f450cf099d00b254870bf8eacc5ce79aee4458070a0fab783d7"
          sha256sum "$OUT" | tee out/SHA256.txt
          {
            echo "build=SUCCESS"
            echo "package=com.suhas.globaledgeai"
            echo "versionCode=155"
            echo "versionName=1.5.5"
            echo "signer_sha256=$CERT_SHA"
            echo "manual_order_only=true"
            echo "strategy_scan_cadence=5m"
            echo "strategy_live_threshold=72"
            echo "challenger_live_allowed_after_hard_gates=true"
            echo "probation_live_allowed=false"
            echo "suspended_live_allowed=false"
            echo "max_new_live_per_pass=5"
            echo "uc_gate_lowered=false"
            echo "uc_funnel_diagnostics=true"
            echo "global_flow_preserved=NEXT_TO_LIVE_TO_DONE_ONLY"
          } > out/BUILD-STATUS.txt

      - name: Package source and logs
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/v155/Global-Edge-AI-Trader-v1.5.0-source
          cd /tmp/v155
          zip -qr "$SRC/out/Global-Edge-AI-Trader-v1.5.5-source.zip" Global-Edge-AI-Trader-v1.5.0-source -x '*/.gradle/*' '*/build/*' '*/out/*' '*.keystore' '*.jks'
          cd "$SRC/out"
          zip -q Global-Edge-AI-Trader-v1.5.5-build-logs.zip APK-SIGNATURE-VERIFY.txt APK-BADGING.txt SHA256.txt BUILD-STATUS.txt TEST-RESULT-SUMMARY.txt GRADLE-BUILD-TEST.log

      - name: Upload final v1.5.5 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Global-Edge-AI-Trader-v1.5.5-FINAL
          retention-days: 90
          if-no-files-found: error
          path: |
            /tmp/v155/Global-Edge-AI-Trader-v1.5.0-source/out/Global-Edge-AI-Trader-v1.5.5.apk
            /tmp/v155/Global-Edge-AI-Trader-v1.5.0-source/out/Global-Edge-AI-Trader-v1.5.5-source.zip
            /tmp/v155/Global-Edge-AI-Trader-v1.5.0-source/out/Global-Edge-AI-Trader-v1.5.5-build-logs.zip
            /tmp/v155/Global-Edge-AI-Trader-v1.5.0-source/out/BUILD-STATUS.txt

      - name: Publish v1.5.5 release files
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/v155/Global-Edge-AI-Trader-v1.5.0-source/out
          DEST=fresh-global-edge/v155/release
          mkdir -p "$DEST"
          cp "$SRC/Global-Edge-AI-Trader-v1.5.5.apk" "$DEST/"
          cp "$SRC/Global-Edge-AI-Trader-v1.5.5-source.zip" "$DEST/"
          cp "$SRC/Global-Edge-AI-Trader-v1.5.5-build-logs.zip" "$DEST/"
          cp "$SRC/BUILD-STATUS.txt" "$DEST/"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$DEST"
          git commit -m 'Publish Global Edge AI Trader v1.5.5 strategy publication release [skip ci]'
          git push
