name: NSE Unified Scanner v3.0.0 Production Final
on:
  push:
    branches: [unified-nse-scanner-v1]
    paths: ['.github/workflows/unified-scanner-build-v300b.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Publish run id early
        run: |
          echo "${GITHUB_RUN_ID}" > .scanner-v3.0.0b-run-id.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .scanner-v3.0.0b-run-id.txt
          git commit -m "Record NSE scanner v3.0.0 final build run ${GITHUB_RUN_ID}"
          git push origin HEAD:unified-nse-scanner-v1
      - name: Apply historical scanner patches
        run: |
          set +e
          python .github/scripts/scanner_v12_patch.py > /tmp/v12.log 2>&1
          set -e
          cat /tmp/v12.log
          python .github/scripts/scanner_v12_tail.py
          set +e
          python .github/scripts/scanner_v13_patch.py > /tmp/v13.log 2>&1
          set -e
          cat /tmp/v13.log
          python .github/scripts/scanner_v13_tail.py
          python .github/scripts/scanner_v14_patch.py
          python .github/scripts/scanner_v15_patch.py
          set +e
          python .github/scripts/scanner_v16_patch.py > /tmp/v16.log 2>&1
          set -e
          cat /tmp/v16.log
          python .github/scripts/scanner_v16_tail.py
          python .github/scripts/scanner_v16_ui_fix.py
          python .github/scripts/scanner_v161_patch.py
          python .github/scripts/scanner_v162_patch.py
          python .github/scripts/scanner_v163_patch.py
          python .github/scripts/scanner_v164_patch.py
          python .github/scripts/scanner_v165_patch.py
          python .github/scripts/scanner_v20_patch.py
          python .github/scripts/scanner_v20_compile_fix.py
      - name: Patch v2 Android file I/O compatibility
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('unified-scanner/app/src/main/java/com/suhas/nseunifiedscanner/ScannerEngine.java')
          s=p.read_text().replace('import java.io.File;','import java.io.File;\nimport java.io.FileOutputStream;\nimport java.io.FileInputStream;\nimport java.io.BufferedReader;\nimport java.io.InputStreamReader;').replace('import java.nio.file.Files;\n','')
          s=s.replace('Files.writeString(f.toPath(),r.value,StandardCharsets.UTF_8);','try(FileOutputStream out=new FileOutputStream(f,false)){out.write(r.value.getBytes(StandardCharsets.UTF_8));}')
          s=s.replace('List<String> lines=Files.readAllLines(f.toPath(),StandardCharsets.UTF_8);','List<String> lines=new ArrayList<>();try(BufferedReader br=new BufferedReader(new InputStreamReader(new FileInputStream(f),StandardCharsets.UTF_8))){String line;while((line=br.readLine())!=null)lines.add(line);}')
          p.write_text(s)
          PY
      - name: Apply v3 production architecture
        run: |
          python .github/scripts/scanner_v300_patch.py
          python .github/scripts/scanner_v300_compile_fix.py
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Build test lint and validate production features
        run: |
          gradle --no-daemon --console=plain -p unified-scanner clean testDebugUnitTest lintDebug assembleDebug assembleRelease
          mkdir -p unified-scanner/out
          cp unified-scanner/app/build/outputs/apk/debug/app-debug.apk unified-scanner/out/NSE-Unified-Scanner-S24-v3.0.0-PRODUCTION-DEBUG.apk
          cp unified-scanner/app/build/outputs/apk/release/app-release-unsigned.apk unified-scanner/out/NSE-Unified-Scanner-S24-v3.0.0-PRODUCTION-UNSIGNED.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging unified-scanner/out/NSE-Unified-Scanner-S24-v3.0.0-PRODUCTION-DEBUG.apk | grep "versionName='3.0.0'"
          grep -q 'versionCode 300' unified-scanner/app/build.gradle
          grep -q 'OrderFlowLogic' unified-scanner/app/src/main/java/com/suhas/nseunifiedscanner/ScannerEngine.java
          grep -q 'LiquiditySweepLogic' unified-scanner/app/src/main/java/com/suhas/nseunifiedscanner/ScannerEngine.java
          grep -q 'ExpectedMoveLogic' unified-scanner/app/src/main/java/com/suhas/nseunifiedscanner/ScannerEngine.java
          grep -q 'MarketRegimeLogic' unified-scanner/app/src/main/java/com/suhas/nseunifiedscanner/ScannerEngine.java
          grep -q 'ProductionGateLogic' unified-scanner/app/src/main/java/com/suhas/nseunifiedscanner/MainActivity.java
          grep -q 'AUTO BUY + AUTO SELL' unified-scanner/app/src/main/java/com/suhas/nseunifiedscanner/MainActivity.java
          grep -q 'LearningBackupManager' unified-scanner/app/src/main/java/com/suhas/nseunifiedscanner/MainActivity.java
          cp -r unified-scanner/app/src/main/java/com/suhas/nseunifiedscanner unified-scanner/out/patched-source
          cp -r unified-scanner/app/src/test/java/com/suhas/nseunifiedscanner unified-scanner/out/patched-tests
          cp unified-scanner/app/build/reports/lint-results-debug.html unified-scanner/out/LINT.html
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs unified-scanner/out/NSE-Unified-Scanner-S24-v3.0.0-PRODUCTION-DEBUG.apk > unified-scanner/out/DEBUG-SIGNATURE.txt
          sha256sum unified-scanner/out/NSE-Unified-Scanner-S24-v3.0.0-PRODUCTION-DEBUG.apk > unified-scanner/out/DEBUG-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NSE-Unified-Scanner-S24-v3.0.0-PRODUCTION-FINAL-BUILD
          path: |
            unified-scanner/out/**
            unified-scanner/app/build/reports/tests/testDebugUnitTest/**
          retention-days: 30
