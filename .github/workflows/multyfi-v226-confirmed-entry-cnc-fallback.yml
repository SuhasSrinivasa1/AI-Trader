name: Build Multyfi AutoBuy Pro v2.2.6 Confirmed Entry CNC Fallback

on:
  pull_request:
    branches: [main]
    paths:
      - 'hotfix/run_v226.py'
      - '.github/workflows/multyfi-v226-confirmed-entry-cnc-fallback.yml'
  workflow_dispatch:

jobs:
  build-test-android16:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools" "emulator" "system-images;android-36;google_apis;x86_64"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Apply v2.2.6 source update
        shell: bash
        run: |
          set +e
          python3 hotfix/run_v226.py > apply-v226.log 2>&1
          code=$?
          cat apply-v226.log
          echo "$code" > apply-v226-exit-code.txt
          exit "$code"

      - name: Unit tests, lint and source-built APK
        shell: bash
        run: |
          set +e
          gradle --no-daemon --console=plain -p android-stable :app:testDebugUnitTest :app:lintDebug :app:assembleDebug > build-v226.log 2>&1
          code=$?
          cat build-v226.log
          echo "$code" > build-v226-exit-code.txt
          exit "$code"

      - name: Verify LASERPOWER fix and retained safety contracts
        shell: bash
        run: |
          set -euo pipefail
          ROOT=android-stable/app/src/main/java/com/suhas/multyfiautobuy/stable
          TEST=android-stable/app/src/test/java/com/suhas/multyfiautobuy/stable
          grep -q "versionCode 226" android-stable/app/build.gradle
          grep -q "versionName '2.2.6'" android-stable/app/build.gradle
          grep -q "class EntryOrderPolicy" "$ROOT/EntryOrderPolicy.java"
          grep -q 'NEW' "$ROOT/EntryOrderPolicy.java"
          grep -q 'assigned basket' "$ROOT/EntryOrderPolicy.java"
          grep -q 'placeConfirmedEntryLimit' "$ROOT/GrowwClient.java"
          grep -q 'ENTRY SUBMITTED — BROKER CONFIRMATION PENDING' "$ROOT/ProductionNotificationService.java"
          grep -q 'MIS BLOCKED BY GROWW — TRYING CNC SAME-DAY FALLBACK' "$ROOT/ProductionNotificationService.java"
          grep -q 'CNC_FALLBACK_LIMIT' "$ROOT/ProductionNotificationService.java"
          grep -q 'reconcilePendingEntry' "$ROOT/StrategyMonitorService.java"
          grep -q '"INTRADAY".equalsIgnoreCase(category)' "$ROOT/Strategy.java"
          grep -q 'newAndAckedAreNotAccepted' "$TEST/EntryOrderPolicyTest.java"
          grep -q 'assignedBasketTriggersOnlyTheCncFallbackFamily' "$TEST/EntryOrderPolicyTest.java"
          grep -q 'createMisStopLossOrder' "$ROOT/StrategyMonitorService.java"
          grep -q 'findDurableMisStop' "$ROOT/GrowwClient.java"
          grep -q 'TradeTypeBudgetPolicy.budget' "$ROOT/ProductionNotificationService.java"
          grep -q 'DailyAuthManager.ensureVerified(this)' "$ROOT/ProductionNotificationService.java"
          grep -q 'NotificationRoutePolicy.entryMode(signal)' "$ROOT/ProductionNotificationService.java"
          grep -q '0.10d' "$ROOT/GrowwClient.java"
          python3 - <<'PY'
          from pathlib import Path
          service = Path('android-stable/app/src/main/java/com/suhas/multyfiautobuy/stable/ProductionNotificationService.java').read_text()
          client = Path('android-stable/app/src/main/java/com/suhas/multyfiautobuy/stable/GrowwClient.java').read_text()
          assert 'acceptStrategy(strategy, signal, summary, mis.message' in service
          assert 'if (mis.isDurable())' in service
          assert 'if (mis.isRejected() && EntryOrderPolicy.isMisBasketRestriction' in service
          assert 'placeConfirmedEntryLimit(\n                    token, signal, quantity, "CNC"' in service
          assert 'for (int i = 0; i < 40; i++)' in client
          assert 'EntryOrderPolicy.isDurable' in client
          assert 'EntryOrderPolicy.isTerminalFailure' in client
          PY

      - name: Verify debug APK signature and stage candidate
        shell: bash
        run: |
          set -euo pipefail
          OUT=android-stable/app/build/outputs/apk/debug
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs "$OUT/app-debug.apk"
          cp "$OUT/app-debug.apk" "$OUT/Multyfi-AutoBuy-Pro-S24-Android16-v2.2.6-CANDIDATE.apk"

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 16 install, two cold launches and crash scan
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          OUT=android-stable/app/build/outputs/apk/debug
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          export ANDROID_SDK_HOME="$RUNNER_TEMP/android-sdk-home"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_SDK_HOME/.android"
          AVD_PATH="$ANDROID_AVD_HOME/s24_v226_api36.avd"
          echo no | avdmanager create avd --force --name s24_v226_api36 --package 'system-images;android-36;google_apis;x86_64' --device 'pixel_8_pro' --path "$AVD_PATH"
          "$ANDROID_HOME/emulator/emulator" -avd s24_v226_api36 -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none > "$OUT/emulator-v226.log" 2>&1 &
          EMULATOR_PID=$!
          trap 'timeout 15 adb emu kill >/dev/null 2>&1 || true; kill "$EMULATOR_PID" >/dev/null 2>&1 || true' EXIT
          timeout 240 adb wait-for-device
          booted=0
          for i in $(seq 1 100); do
            state=$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$state" = "1" ]; then booted=1; break; fi
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then break; fi
            sleep 4
          done
          test "$booted" = "1"
          APK="$OUT/Multyfi-AutoBuy-Pro-S24-Android16-v2.2.6-CANDIDATE.apk"
          adb install -r "$APK" | tee "$OUT/install-v226.txt"
          grep -q Success "$OUT/install-v226.txt"
          adb shell pm grant com.suhas.multyfiautobuy.stable android.permission.POST_NOTIFICATIONS
          adb logcat -c
          for n in 1 2; do
            adb shell am force-stop com.suhas.multyfiautobuy.stable
            sleep 2
            adb shell am start -W -n com.suhas.multyfiautobuy.stable/.MainActivity | tee "$OUT/cold-launch-v226-$n.txt"
            sleep 10
            adb shell pidof com.suhas.multyfiautobuy.stable | tee "$OUT/pid-v226-$n.txt"
            test -s "$OUT/pid-v226-$n.txt"
          done
          adb shell uiautomator dump /sdcard/multyfi-v226-ui.xml
          adb pull /sdcard/multyfi-v226-ui.xml "$OUT/ui-v226.xml"
          grep -q 'Multyfi AutoBuy Pro' "$OUT/ui-v226.xml"
          grep -q 'stable release 2.2.6' "$OUT/ui-v226.xml"
          grep -q 'TRADE-TYPE BUDGETS' "$OUT/ui-v226.xml"
          adb exec-out screencap -p > "$OUT/startup-v226.png"
          adb logcat -d -v threadtime > "$OUT/logcat-v226.txt"
          if grep -E 'FATAL EXCEPTION|Process: com.suhas.multyfiautobuy.stable|ClassNotFoundException.*com.suhas.multyfiautobuy.stable' "$OUT/logcat-v226.txt"; then
            exit 1
          fi

      - name: Create validation manifest
        shell: bash
        run: |
          set -euo pipefail
          OUT=android-stable/app/build/outputs/apk/debug
          SHA=$(sha256sum "$OUT/Multyfi-AutoBuy-Pro-S24-Android16-v2.2.6-CANDIDATE.apk" | awk '{print $1}')
          cat > "$OUT/VALIDATION-v2.2.6.json" <<EOF
          {
            "version": "2.2.6-candidate",
            "package": "com.suhas.multyfiautobuy.stable",
            "android_api": 36,
            "candidate_sha256": "$SHA",
            "unit_tests": "PASS",
            "lint": "PASS",
            "debug_signature": "PASS",
            "android16_install": "PASS",
            "cold_launch_1": "PASS",
            "cold_launch_2": "PASS",
            "crash_scan": "PASS",
            "laserpower_fix": {
              "NEW_ACKED": "pending, never accepted",
              "durable_acceptance": "OPEN/APPROVED/fill/executed states",
              "assigned_basket": "one full-cash CNC LIMIT fallback",
              "fallback_budget": "same Intraday trade-type budget",
              "fallback_exit": "same-day Intraday force exit",
              "final_rejection": "no active position, no stop-loss, no successful-buy count"
            },
            "retained": {
              "trade_type_budgets": "Intraday, Swing, Multibagger, Free",
              "MIS_protection": "durable regular DAY SL_M SELL",
              "CNC_protection": "broker-side stop-loss GTT",
              "daily_groww_verification": "automatic",
              "early_exit": "Multyfi notification supersedes target",
              "price_grid": "INR 0.10 generated-order grid"
            }
          }
          EOF

      - name: Upload v2.2.6 candidate and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Multyfi-AutoBuy-Pro-S24-Android16-v2.2.6-CANDIDATE
          path: |
            apply-v226.log
            apply-v226-exit-code.txt
            build-v226.log
            build-v226-exit-code.txt
            android-stable/app/build/outputs/apk/debug/Multyfi-AutoBuy-Pro-S24-Android16-v2.2.6-CANDIDATE.apk
            android-stable/app/build/outputs/apk/debug/VALIDATION-v2.2.6.json
            android-stable/app/build/outputs/apk/debug/install-v226.txt
            android-stable/app/build/outputs/apk/debug/cold-launch-v226-*.txt
            android-stable/app/build/outputs/apk/debug/pid-v226-*.txt
            android-stable/app/build/outputs/apk/debug/ui-v226.xml
            android-stable/app/build/outputs/apk/debug/logcat-v226.txt
            android-stable/app/build/outputs/apk/debug/startup-v226.png
            android-stable/app/build/outputs/apk/debug/emulator-v226.log
            android-stable/app/build/reports/tests/testDebugUnitTest/
            android-stable/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
