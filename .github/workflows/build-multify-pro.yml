name: Build Multify Pro APK

on:
  push:
    branches:
      - multify-pro-v2-build
    paths:
      - 'multify-pro/**'
      - '.github/workflows/build-multify-pro.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: multify-pro-v2-build
          fetch-depth: 1
          sparse-checkout: |
            multify-pro
          sparse-checkout-cone-mode: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build and test
        working-directory: multify-pro
        run: |
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Stage artifact
        run: |
          mkdir -p build-output
          cp multify-pro/app/build/outputs/apk/debug/app-debug.apk build-output/MultifyAutoTrader-Pro-v2.0.0-internal.apk
          sha256sum build-output/MultifyAutoTrader-Pro-v2.0.0-internal.apk > build-output/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: MultifyAutoTrader-Pro-v2
          path: build-output/*
          if-no-files-found: error
          retention-days: 7
