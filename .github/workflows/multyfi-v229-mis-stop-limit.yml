name: Build Multyfi AutoBuy Pro v2.2.9 Final

on:
  pull_request:
    branches: [main]
    paths:
      - 'hotfix/run_v229.py'
      - '.github/workflows/multyfi-v229-mis-stop-limit.yml'
  workflow_dispatch:

jobs:
  build-test-sign-android16:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "platform-tools" \
            "emulator" \
            "system-images;android-36;google_apis;x86_64"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Apply v2.2.9 source fix
        shell: bash
        run: |
          set -euo pipefail
          python3 hotfix/run_v229.py | tee apply-v229.log

      - name: Unit tests, lint and release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --console=plain -p android-stable \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleRelease | tee build-v229.log

      - name: Verify BLUESTONE regression contracts
        shell: bash
        run: |
          set -euo pipefail
          ROOT=android-stable/app/src/main/java/com/suhas/multyfiautobuy/stable
          TEST=android-stable/app/src/test/java/com/suhas/multyfiautobuy/stable

          grep -q "versionCode 229" android-stable/app/build.gradle
          grep -q "versionName '2.2.9'" android-stable/app/build.gradle
          grep -q 'body.put("order_type", "SL")' "$ROOT/GrowwClient.java"
          grep -q 'body.put("price", price(limitPrice))' "$ROOT/GrowwClient.java"
          grep -q 'body.put("trigger_price", price(strategy.stopLossPrice))' "$ROOT/GrowwClient.java"
          grep -q "MisStopLimitPolicy.limitPrice" "$ROOT/GrowwClient.java"
          grep -q "MIS STOP REJECTED — EMERGENCY EXIT QUEUED" "$ROOT/StrategyMonitorService.java"
          grep -q "no identical stop retry will be submitted" "$ROOT/StrategyMonitorService.java"
          grep -q "bluestoneTriggerUsesOneTickLowerSellLimit" "$TEST/MisStopLimitPolicyTest.java"
          grep -q "MULTYFI EARLY EXIT PERSISTED" "$ROOT/ProductionNotificationService.java"

      - name: Sign with permanent update certificate
        shell: bash
        env:
          MULTYFI_SIGNING_KEY: ${{ secrets.MULTYFI_SIGNING_KEY }}
          MULTYFI_STORE_PASSWORD: ${{ secrets.MULTYFI_STORE_PASSWORD }}
          MULTYFI_KEY_PASSWORD: ${{ secrets.MULTYFI_KEY_PASSWORD }}
          MULTYFI_KEY_ALIAS: ${{ secrets.MULTYFI_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$MULTYFI_SIGNING_KEY"
          test -n "$MULTYFI_STORE_PASSWORD"
          test -n "$MULTYFI_KEY_PASSWORD"
          test -n "$MULTYFI_KEY_ALIAS"

          OUT=android-stable/app/build/outputs/apk
          RELEASE_DIR="$OUT/release"
          FINAL_DIR="$OUT/final"
          mkdir -p "$FINAL_DIR"

          UNSIGNED=$(find "$RELEASE_DIR" -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$UNSIGNED"

          KEYSTORE="$RUNNER_TEMP/multyfi-update.jks"
          printf '%s' "$MULTYFI_SIGNING_KEY" \
            | tr -d '\r\n ' \
            | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"

          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass "$MULTYFI_STORE_PASSWORD" \
            -alias "$MULTYFI_KEY_ALIAS" > "$FINAL_DIR/keystore-v229.txt"

          ALIGNED="$FINAL_DIR/Multyfi-v2.2.9-aligned.apk"
          FINAL="$FINAL_DIR/Multyfi-AutoBuy-Pro-S24-Android16-v2.2.9-FINAL.apk"

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -f -p 4 "$UNSIGNED" "$ALIGNED"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$MULTYFI_KEY_ALIAS" \
            --ks-pass env:MULTYFI_STORE_PASSWORD \
            --key-pass env:MULTYFI_KEY_PASSWORD \
            --out "$FINAL" \
            "$ALIGNED"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose --print-certs "$FINAL" \
            | tee "$FINAL_DIR/signature-v229.txt"

          rm -f "$KEYSTORE" "$ALIGNED"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 16 install and two cold launches
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          FINAL_DIR=android-stable/app/build/outputs/apk/final
          APK="$FINAL_DIR/Multyfi-AutoBuy-Pro-S24-Android16-v2.2.9-FINAL.apk"

          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          export ANDROID_SDK_HOME="$RUNNER_TEMP/android-sdk-home"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_SDK_HOME/.android"

          echo no | avdmanager create avd \
            --force \
            --name s24_v229 \
            --package 'system-images;android-36;google_apis;x86_64' \
            --device 'pixel_8_pro' \
            --path "$ANDROID_AVD_HOME/s24_v229.avd"

          "$ANDROID_HOME/emulator/emulator" \
            -avd s24_v229 \
            -no-window \
            -gpu swiftshader_indirect \
            -no-snapshot \
            -noaudio \
            -no-boot-anim \
            -camera-back none \
            > "$FINAL_DIR/emulator-v229.log" 2>&1 &
          EMULATOR_PID=$!
          trap 'timeout 15 adb emu kill >/dev/null 2>&1 || true; kill "$EMULATOR_PID" >/dev/null 2>&1 || true' EXIT

          timeout 240 adb wait-for-device
          booted=0
          for i in $(seq 1 100); do
            state=$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$state" = "1" ]; then
              booted=1
              break
            fi
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              break
            fi
            sleep 4
          done
          test "$booted" = "1"

          adb install -r "$APK" | tee "$FINAL_DIR/install-v229.txt"
          grep -q Success "$FINAL_DIR/install-v229.txt"
          adb shell pm grant \
            com.suhas.multyfiautobuy.stable \
            android.permission.POST_NOTIFICATIONS

          adb logcat -c
          for n in 1 2; do
            adb shell am force-stop com.suhas.multyfiautobuy.stable
            sleep 2
            adb shell am start -W \
              -n com.suhas.multyfiautobuy.stable/.MainActivity \
              | tee "$FINAL_DIR/cold-launch-v229-$n.txt"
            sleep 8
            adb shell pidof com.suhas.multyfiautobuy.stable \
              | tee "$FINAL_DIR/pid-v229-$n.txt"
            test -s "$FINAL_DIR/pid-v229-$n.txt"
          done

          adb shell uiautomator dump /sdcard/v229-ui.xml
          adb pull /sdcard/v229-ui.xml "$FINAL_DIR/ui-v229.xml"
          grep -q 'Multyfi AutoBuy Pro' "$FINAL_DIR/ui-v229.xml"
          grep -q '2.2.9' "$FINAL_DIR/ui-v229.xml"

          adb exec-out screencap -p > "$FINAL_DIR/startup-v229.png"
          adb logcat -d -v threadtime > "$FINAL_DIR/logcat-v229.txt"
          if grep -E \
            'FATAL EXCEPTION|Process: com.suhas.multyfiautobuy.stable|ClassNotFoundException.*com.suhas.multyfiautobuy.stable' \
            "$FINAL_DIR/logcat-v229.txt"; then
            exit 1
          fi

      - name: Create release files
        shell: bash
        run: |
          set -euo pipefail
          FINAL_DIR=android-stable/app/build/outputs/apk/final
          APK="$FINAL_DIR/Multyfi-AutoBuy-Pro-S24-Android16-v2.2.9-FINAL.apk"
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          CERT=$(sed -n \
            's/^Signer #1 certificate SHA-256 digest: //p' \
            "$FINAL_DIR/signature-v229.txt" | head -n 1)

          cat > "$FINAL_DIR/VALIDATION-v2.2.9.json" <<EOF
          {
            "release": "Multyfi AutoBuy Pro v2.2.9 FINAL",
            "package": "com.suhas.multyfiautobuy.stable",
            "version_name": "2.2.9",
            "version_code": 229,
            "android_target": "Android 16 / Galaxy S24 Ultra",
            "apk_sha256": "$SHA",
            "signing_certificate_sha256": "$CERT",
            "validation": {
              "source_patch": "PASS",
              "unit_tests": "PASS",
              "lint": "PASS",
              "apk_signature_verification": "PASS",
              "android_16_install": "PASS",
              "cold_launch_1": "PASS",
              "cold_launch_2": "PASS",
              "startup_crash_scan": "PASS",
              "bluestone_16448_regression": "PASS"
            },
            "fixed_behaviour": {
              "mis_protection_order": "regular DAY SL SELL",
              "mis_stop_limit": "one INR 0.10 grid tick below trigger",
              "identical_rejected_retry_loop": false,
              "failed_mis_protection": "durable emergency market exit request",
              "armed_preference_retained": true,
              "new_entries_blocked_until_zero_position": true
            }
          }
          EOF

          cat > "$FINAL_DIR/RELEASE-NOTES-v2.2.9.txt" <<'EOF'
          MULTYFI AUTOBUY PRO v2.2.9 FINAL

          Fixes the live BLUESTONE MIS protection failure:
          - MIS protection now uses a regular DAY SL SELL, not SL-M.
          - Trigger remains the Multyfi stop-loss.
          - Sell limit is exactly one INR 0.10 grid tick below the trigger.
          - NEW/ACKED still does not count as protection.
          - A broker-rejected MIS stop is not retried indefinitely.
          - A failed MIS protection attempt persists an emergency market exit.
          - New entries remain paused until Groww confirms zero position.
          - The user's 24x7 armed preference remains enabled.
          - CNC stop-loss GTT and durable Multyfi early exits are retained.
          EOF

          cat > "$FINAL_DIR/INSTALL-S24-ULTRA-LADB-v2.2.9.txt" <<'EOF'
          MULTYFI AUTOBUY PRO v2.2.9 FINAL - S24 ULTRA / LADB

          Install as an UPDATE. Do not uninstall the existing app.

          Run each command separately in LADB. Do not type adb shell.

          cp "$(find /sdcard/Download -type f -name 'Multyfi-AutoBuy-Pro-S24-Android16-v2.2.9-FINAL.apk' 2>/dev/null | head -n 1)" "/data/local/tmp/Multyfi-v2.2.9.apk"

          ls -lh "/data/local/tmp/Multyfi-v2.2.9.apk"

          am force-stop com.suhas.multyfiautobuy.stable

          pm install -r -g "/data/local/tmp/Multyfi-v2.2.9.apk"

          pm grant com.suhas.multyfiautobuy.stable android.permission.POST_NOTIFICATIONS

          dumpsys deviceidle whitelist +com.suhas.multyfiautobuy.stable

          am start -n com.suhas.multyfiautobuy.stable/.MainActivity

          dumpsys package com.suhas.multyfiautobuy.stable | grep -E "versionName|versionCode"

          Expected:
          versionName=2.2.9
          versionCode=229

          rm "/data/local/tmp/Multyfi-v2.2.9.apk"
          EOF

      - name: Upload signed final package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Multyfi-AutoBuy-Pro-S24-Android16-v2.2.9-FINAL
          path: |
            apply-v229.log
            build-v229.log
            android-stable/app/build/outputs/apk/final/Multyfi-AutoBuy-Pro-S24-Android16-v2.2.9-FINAL.apk
            android-stable/app/build/outputs/apk/final/VALIDATION-v2.2.9.json
            android-stable/app/build/outputs/apk/final/RELEASE-NOTES-v2.2.9.txt
            android-stable/app/build/outputs/apk/final/INSTALL-S24-ULTRA-LADB-v2.2.9.txt
            android-stable/app/build/outputs/apk/final/signature-v229.txt
            android-stable/app/build/outputs/apk/final/install-v229.txt
            android-stable/app/build/outputs/apk/final/cold-launch-v229-*.txt
            android-stable/app/build/outputs/apk/final/pid-v229-*.txt
            android-stable/app/build/outputs/apk/final/ui-v229.xml
            android-stable/app/build/outputs/apk/final/logcat-v229.txt
            android-stable/app/build/outputs/apk/final/startup-v229.png
            android-stable/app/build/reports/tests/testDebugUnitTest/
            android-stable/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
