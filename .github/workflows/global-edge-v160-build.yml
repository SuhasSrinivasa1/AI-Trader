name: Global Edge AI Trader v1.6.0 Groww API Hygiene Build

on:
  push:
    paths:
      - '.github/workflows/global-edge-v160-build.yml'
      - 'fresh-global-edge/v160/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - name: Recover exact v1.5.9 source
        shell: bash
        run: |
          set -euo pipefail
          SRCZIP=fresh-global-edge/v159/release/Global-Edge-AI-Trader-v1.5.9-source.zip
          test -s "$SRCZIP"
          rm -rf /tmp/v160 && mkdir -p /tmp/v160
          unzip -q "$SRCZIP" -d /tmp/v160
          test -f /tmp/v160/Global-Edge-AI-Trader-v1.5.0-source/app/build.gradle.kts

      - name: Apply v1.6.0 Groww API hygiene patch
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/v160/Global-Edge-AI-Trader-v1.5.0-source
          tr -d '\r\n ' < fresh-global-edge/v160/v159-to-v160.patch.gz.b64 | base64 -d > /tmp/v160.patch.gz
          gunzip -c /tmp/v160.patch.gz > /tmp/v160.patch
          cd "$SRC"
          patch -p1 --batch < /tmp/v160.patch
          grep -q 'versionCode = 160' app/build.gradle.kts
          grep -q 'versionName = "1.6.0"' app/build.gradle.kts
          grep -q 'INTERNAL_LIVE_PER_MINUTE = 240' app/src/main/java/com/suhas/ucsentinel/data/remote/GrowwApiHealth.kt
          grep -q 'Groww API hygiene' app/src/main/java/com/suhas/ucsentinel/ui/MoreScreen.kt
          grep -q 'growwApiHealth' app/src/main/java/com/suhas/ucsentinel/ui/MainViewModel.kt
          grep -q 'growwApiHealth=' app/src/main/java/com/suhas/ucsentinel/data/repository/UCSentinelRepository.kt
          test -s CHANGELOG-v1.6.0.txt
          echo 'v1.6.0 source verification passed'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unit tests and release APK
        working-directory: /tmp/v160/Global-Edge-AI-Trader-v1.5.0-source
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out
          gradle --no-daemon --console=plain clean testDebugUnitTest assembleRelease 2>&1 | tee out/GRADLE-BUILD-TEST.log
          echo 'Unit tests + assembleRelease: PASS' > out/TEST-RESULT-SUMMARY.txt

      - name: Recover preserved signing material
        uses: actions/download-artifact@v4
        with:
          name: Global-Edge-AI-Trader-v1.5.0-FINAL
          repository: SuhasSrinivasa1/AI-Trader
          run-id: 36146076154
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/v150-artifact

      - name: Sign and verify preserved update certificate
        working-directory: /tmp/v160/Global-Edge-AI-Trader-v1.5.0-source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out /tmp/signing
          BACKUP=$(find /tmp/v150-artifact -type f -name 'Global-Edge-AI-Trader-v1.5.0-SIGNING-BACKUP.zip' | head -n1)
          test -n "$BACKUP" && test -s "$BACKUP"
          unzip -q "$BACKUP" -d /tmp/signing
          KEYSTORE=/tmp/signing/global-edge-v1.5.0.keystore
          INFO=/tmp/signing/SIGNING-INFO.txt
          STORE_PASS=$(grep '^store_password=' "$INFO" | cut -d= -f2-)
          KEY_PASS=$(grep '^key_password=' "$INFO" | cut -d= -f2-)
          UNSIGNED=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*release*.apk' | head -n1)
          OUT=out/Global-Edge-AI-Trader-v1.6.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$KEYSTORE" --ks-pass pass:"$STORE_PASS" --key-pass pass:"$KEY_PASS" --ks-key-alias globaledge --out "$OUT" "$UNSIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$OUT" | tee out/APK-SIGNATURE-VERIFY.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$OUT" | tee out/APK-BADGING.txt
          grep -q "package: name='com.suhas.globaledgeai'" out/APK-BADGING.txt
          grep -q "versionCode='160'" out/APK-BADGING.txt
          grep -q "versionName='1.6.0'" out/APK-BADGING.txt
          CERT_SHA=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$OUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)
          test "$CERT_SHA" = '31ffa51c23b76f450cf099d00b254870bf8eacc5ce79aee4458070a0fab783d7'
          sha256sum "$OUT" | tee out/SHA256.txt
          {
            echo 'build=SUCCESS'
            echo 'package=com.suhas.globaledgeai'
            echo 'versionCode=160'
            echo 'versionName=1.6.0'
            echo "signer_sha256=$CERT_SHA"
            echo 'update_certificate_preserved=true'
            echo 'manual_order_only=true'
            echo 'groww_api_hygiene_monitor=true'
            echo 'live_data_published_limit=300_per_minute_10_per_second'
            echo 'live_data_internal_budget=240_per_minute'
            echo 'live_data_reserve=20_percent'
            echo 'orders_published_limit=250_per_minute'
            echo 'non_trading_published_limit=500_per_minute'
            echo 'authentication_published_limit=30_per_minute'
            echo 'rate_limit_429_tracking=true'
            echo 'settings_health_card=true'
            echo 'v159_ledger_integrity_preserved=true'
            echo 'five_minute_foreground_automation_preserved=true'
          } > out/BUILD-STATUS.txt

      - name: Package source and logs
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/v160/Global-Edge-AI-Trader-v1.5.0-source
          cd /tmp/v160
          zip -qr "$SRC/out/Global-Edge-AI-Trader-v1.6.0-source.zip" Global-Edge-AI-Trader-v1.5.0-source -x '*/.gradle/*' '*/build/*' '*/out/*' '*.keystore' '*.jks'
          cd "$SRC/out"
          zip -q Global-Edge-AI-Trader-v1.6.0-build-logs.zip APK-SIGNATURE-VERIFY.txt APK-BADGING.txt SHA256.txt BUILD-STATUS.txt TEST-RESULT-SUMMARY.txt GRADLE-BUILD-TEST.log

      - name: Upload final v1.6.0 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Global-Edge-AI-Trader-v1.6.0-FINAL
          retention-days: 90
          if-no-files-found: error
          path: |
            /tmp/v160/Global-Edge-AI-Trader-v1.5.0-source/out/Global-Edge-AI-Trader-v1.6.0.apk
            /tmp/v160/Global-Edge-AI-Trader-v1.5.0-source/out/Global-Edge-AI-Trader-v1.6.0-source.zip
            /tmp/v160/Global-Edge-AI-Trader-v1.5.0-source/out/Global-Edge-AI-Trader-v1.6.0-build-logs.zip
            /tmp/v160/Global-Edge-AI-Trader-v1.5.0-source/out/BUILD-STATUS.txt

      - name: Publish v1.6.0 release files
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/v160/Global-Edge-AI-Trader-v1.5.0-source/out
          DEST=fresh-global-edge/v160/release
          mkdir -p "$DEST"
          cp "$SRC/Global-Edge-AI-Trader-v1.6.0.apk" "$DEST/"
          cp "$SRC/Global-Edge-AI-Trader-v1.6.0-source.zip" "$DEST/"
          cp "$SRC/Global-Edge-AI-Trader-v1.6.0-build-logs.zip" "$DEST/"
          cp "$SRC/BUILD-STATUS.txt" "$DEST/"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$DEST"
          git commit -m 'Publish Global Edge AI Trader v1.6.0 Groww API hygiene release [skip ci]'
          git push
