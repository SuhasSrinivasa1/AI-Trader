name: Global Edge AI Trader v1.8.1 Canonical Signed Build

on:
  push:
    paths:
      - 'fresh-global-edge/v191/TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout signing repository
        uses: actions/checkout@v4
        with:
          path: signing-repo

      - name: Checkout canonical v1.8.1 source
        uses: actions/checkout@v4
        with:
          repository: SuhasSrinivasa1/Global-Edge-AI-Trader
          ref: main
          path: canonical
          persist-credentials: false

      - name: Verify canonical source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 191' canonical/app/build.gradle.kts
          grep -q 'versionName = "1.8.1"' canonical/app/build.gradle.kts
          grep -q 'scanUpperCircuitThreePm' canonical/app/src/main/java/com/suhas/ucsentinel/data/repository/UCSentinelRepository.kt
          grep -q '!phase.open' canonical/app/src/main/java/com/suhas/ucsentinel/domain/engine/GlobalLeadEngine.kt
          grep -q 'thresholdPool' canonical/app/src/main/java/com/suhas/ucsentinel/domain/engine/ScannerEngine.kt
          grep -q 'scanner_service_heartbeat_at_v170' canonical/app/src/main/java/com/suhas/ucsentinel/data/local/AppPreferences.kt
          grep -q 'SESSION_SYMBOL_CHURN_BLOCK' canonical/app/src/main/java/com/suhas/ucsentinel/data/repository/UCSentinelRepository.kt
          grep -q 'SESSION_KILL_SWITCH' canonical/app/src/main/java/com/suhas/ucsentinel/data/repository/UCSentinelRepository.kt
          grep -q 'isThreePmPriorityWindow' canonical/app/src/main/java/com/suhas/ucsentinel/domain/engine/AutomationPolicy.kt
          test -f canonical/app/src/main/java/com/suhas/ucsentinel/data/local/PersistentLearningVault.kt
          grep -q 'global_edge_learning_vault_control_v171' canonical/app/src/main/java/com/suhas/ucsentinel/data/local/PersistentLearningVault.kt
          grep -q 'restoreLearningVault' canonical/app/src/main/java/com/suhas/ucsentinel/data/repository/UCSentinelRepository.kt
          test -f canonical/app/src/main/java/com/suhas/ucsentinel/data/local/StrategyLearningDatabase.kt
          test -f canonical/app/src/main/java/com/suhas/ucsentinel/domain/engine/StrategyGovernanceV2.kt
          grep -q 'StrategyStatus.QUALIFIED' canonical/app/src/main/java/com/suhas/ucsentinel/domain/engine/StrategyGovernanceV2.kt
          grep -q 'productionEligible' canonical/app/src/main/java/com/suhas/ucsentinel/domain/engine/StrategyGovernanceV2.kt
          grep -q 'buildFrozenRoster' canonical/app/src/main/java/com/suhas/ucsentinel/domain/engine/StrategyGovernanceV2.kt
          grep -q 'SHADOW_V2' canonical/app/src/main/java/com/suhas/ucsentinel/data/repository/UCSentinelRepository.kt
          grep -q 'componentStrategyIds' canonical/app/src/main/java/com/suhas/ucsentinel/data/repository/UCSentinelRepository.kt
          grep -q 'Portfolio selector' canonical/app/src/main/java/com/suhas/ucsentinel/data/repository/UCSentinelRepository.kt
          grep -q 'previousSessionClose' canonical/app/src/main/java/com/suhas/ucsentinel/domain/engine/TradingStrategyEngine.kt
          grep -q 'sameSlotHistoricalVolumes' canonical/app/src/main/java/com/suhas/ucsentinel/domain/engine/TradingStrategyEngine.kt
          grep -q 'unavailable intelligence is neutral' canonical/app/src/main/java/com/suhas/ucsentinel/domain/engine/HandbookSynergyEngine.kt
          grep -q 'PRODUCTION GOVERNANCE V2' canonical/app/src/main/java/com/suhas/ucsentinel/ui/CompactMarketScreens.kt
          grep -q 'currentSessionStart' canonical/app/src/main/java/com/suhas/ucsentinel/data/repository/UCSentinelRepository.kt
          grep -q 'parseHistoricalEpochSeconds' canonical/app/src/main/java/com/suhas/ucsentinel/data/remote/GrowwClient.kt
          test -f canonical/app/src/main/java/com/suhas/ucsentinel/worker/NearCloseAlarmScheduler.kt
          grep -q 'setAndAllowWhileIdle' canonical/app/src/main/java/com/suhas/ucsentinel/worker/NearCloseAlarmScheduler.kt
          grep -q 'context-fallback' canonical/app/src/main/java/com/suhas/ucsentinel/data/repository/UCSentinelRepository.kt
          grep -q 'isTodayIst' canonical/app/src/main/java/com/suhas/ucsentinel/data/repository/UCSentinelRepository.kt
          ! grep -Rqi 'multify' canonical/app/src/main canonical/app/src/test
          ! grep -q 'NotificationListenerService' canonical/app/src/main/AndroidManifest.xml

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unit tests and release APK
        working-directory: canonical
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out
          gradle --no-daemon --console=plain clean testDebugUnitTest assembleRelease 2>&1 | tee out/GRADLE-BUILD-TEST.log
          echo 'Unit tests + assembleRelease: PASS' > out/TEST-RESULT-SUMMARY.txt

      - name: Recover preserved signing material
        uses: actions/download-artifact@v4
        with:
          name: Global-Edge-AI-Trader-v1.5.0-FINAL
          repository: SuhasSrinivasa1/AI-Trader
          run-id: 36146076154
          github-token: ${{ github.token }}
          path: /tmp/v150-artifact

      - name: Sign and verify preserved update certificate
        working-directory: canonical
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out /tmp/signing
          BACKUP=$(find /tmp/v150-artifact -type f -name 'Global-Edge-AI-Trader-v1.5.0-SIGNING-BACKUP.zip' | head -n1)
          test -n "$BACKUP" && test -s "$BACKUP"
          unzip -q "$BACKUP" -d /tmp/signing
          KEYSTORE=/tmp/signing/global-edge-v1.5.0.keystore
          INFO=/tmp/signing/SIGNING-INFO.txt
          STORE_PASS=$(grep '^store_password=' "$INFO" | cut -d= -f2-)
          KEY_PASS=$(grep '^key_password=' "$INFO" | cut -d= -f2-)
          UNSIGNED=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*release*.apk' | head -n1)
          OUT=out/Global-Edge-AI-Trader-v1.8.1.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$KEYSTORE" --ks-pass pass:"$STORE_PASS" --key-pass pass:"$KEY_PASS" --ks-key-alias globaledge --out "$OUT" "$UNSIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$OUT" | tee out/APK-SIGNATURE-VERIFY.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$OUT" | tee out/APK-BADGING.txt
          grep -q "package: name='com.suhas.globaledgeai'" out/APK-BADGING.txt
          grep -q "versionCode='191'" out/APK-BADGING.txt
          grep -q "versionName='1.8.1'" out/APK-BADGING.txt
          CERT_SHA=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$OUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)
          test "$CERT_SHA" = '31ffa51c23b76f450cf099d00b254870bf8eacc5ce79aee4458070a0fab783d7'
          sha256sum "$OUT" | tee out/SHA256.txt
          {
            echo 'build=SUCCESS'
            echo 'canonical_repo=SuhasSrinivasa1/Global-Edge-AI-Trader'
            echo 'package=com.suhas.globaledgeai'
            echo 'versionCode=190'
            echo 'versionName=1.8.1'
            echo "signer_sha256=$CERT_SHA"
            echo 'update_certificate_preserved=true'
            echo 'v167_execution_hardening_preserved=true'
            echo 'android_backup_disabled=true'
            echo 'global_offhours_live_blocked=true'
            echo 'uc_three_pm_next_session_lane=true'
            echo 'uc_adaptive_live_pool=true'
            echo 'strategy_historical_path_reconcile=true'
            echo 'foreground_duplicate_scans_removed=true'
            echo 'min_sdk=28'
            echo 'single_owner_market_scanner=true'
            echo 'workmanager_stale_only_fallback=true'
            echo 'scanner_heartbeat_watchdog=true'
            echo 'uc_three_pm_absolute_priority=true'
            echo 'uc_three_pm_1510_1530=true'
            echo 'strategy_same_session_symbol_churn_block=true'
            echo 'strategy_same_day_cold_probation=true'
            echo 'process_restart_cadence_restored=true'
            echo 'persistent_learning_vault=true'
            echo 'vault_survives_normal_uninstall=true'
            echo 'vault_excludes_credentials_and_tokens=true'
            echo 'vault_restore_disarms_real_orders=true'
            echo 'vault_auto_snapshot_interval_minutes=2'
            echo 'strategy_architecture=v2'
            echo 'strategy_room_event_store=true'
            echo 'strategy_legacy_learning_migrated=true'
            echo 'strategy_roster_frozen_before_open=true'
            echo 'strategy_context_open_mid_late=true'
            echo 'strategy_context_long_short_regime=true'
            echo 'challenger_shadow_only=true'
            echo 'qualified_and_champion_production_only=true'
            echo 'shadow_live_objective_parity=true'
            echo 'strategy_one_minute_outcome_replay=true'
            echo 'ambiguous_bars_excluded_from_learning=true'
            echo 'strategy_ensemble_component_credit=true'
            echo 'strategy_distinct_session_weighting=true'
            echo 'strategy_calibrated_target_probability=true'
            echo 'strategy_net_expectancy_r=true'
            echo 'strategy_portfolio_diversification=true'
            echo 'strategy_true_prior_session_gap=true'
            echo 'strategy_same_clock_rvol=true'
            echo 'handbook_missing_evidence_neutral=true'
            echo 'strategy_ui_separates_live_shadow_metrics=true'
            echo 'three_pm_precompute_fast_confirm=true'
            echo 'learning_vault_room_schema=2'
            echo 'multify_feature_removed=true'
            echo 'notification_listener_removed=true'
            echo 'strategy_live_history_fallback=true'
            echo 'strategy_context_window_previous_session=true'
            echo 'strategy_zero_match_diagnostics=true'
            echo 'closed_calls_ui_today_only=true'
            echo 'durable_learning_history_preserved=true'
            echo 'groww_historical_string_timestamp_parser=true'
            echo 'near_close_alarm_watchdog=true'
          } > out/BUILD-STATUS.txt

      - name: Package source and logs
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/canonical"
          cd "$SRC"
          zip -qr out/Global-Edge-AI-Trader-v1.8.1-source.zip . -x '.git/*' '*/.gradle/*' '*/build/*' 'out/*' '*.keystore' '*.jks'
          cd out
          zip -q Global-Edge-AI-Trader-v1.8.1-build-logs.zip APK-SIGNATURE-VERIFY.txt APK-BADGING.txt SHA256.txt BUILD-STATUS.txt TEST-RESULT-SUMMARY.txt GRADLE-BUILD-TEST.log

      - name: Upload final v1.8.1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Global-Edge-AI-Trader-v1.8.1-FINAL
          retention-days: 90
          if-no-files-found: error
          path: |
            canonical/out/Global-Edge-AI-Trader-v1.8.1.apk
            canonical/out/Global-Edge-AI-Trader-v1.8.1-source.zip
            canonical/out/Global-Edge-AI-Trader-v1.8.1-build-logs.zip
            canonical/out/BUILD-STATUS.txt
