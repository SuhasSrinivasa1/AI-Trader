name: NSE Unified Scanner v1.2
on:
  push:
    branches: [unified-nse-scanner-v1]
    paths: ['.github/workflows/unified-scanner-build-v12.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Publish run id early
        run: |
          echo "${GITHUB_RUN_ID}" > .scanner-v1.2-run-id.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .scanner-v1.2-run-id.txt
          git commit -m "Record NSE scanner v1.2 build run ${GITHUB_RUN_ID}"
          git push origin HEAD:unified-nse-scanner-v1
      - name: Apply v1.2 strategy and UI patch
        run: python .github/scripts/scanner_v12_patch.py
      - name: Patch Android file I/O compatibility
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('unified-scanner/app/src/main/java/com/suhas/nseunifiedscanner/ScannerEngine.java')
          s=p.read_text().replace('import java.io.File;','import java.io.File;\nimport java.io.FileOutputStream;\nimport java.io.FileInputStream;\nimport java.io.BufferedReader;\nimport java.io.InputStreamReader;').replace('import java.nio.file.Files;\n','')
          s=s.replace('Files.writeString(f.toPath(),r.value,StandardCharsets.UTF_8);','try(FileOutputStream out=new FileOutputStream(f,false)){out.write(r.value.getBytes(StandardCharsets.UTF_8));}')
          s=s.replace('List<String> lines=Files.readAllLines(f.toPath(),StandardCharsets.UTF_8);','List<String> lines=new ArrayList<>();try(BufferedReader br=new BufferedReader(new InputStreamReader(new FileInputStream(f),StandardCharsets.UTF_8))){String line;while((line=br.readLine())!=null)lines.add(line);}')
          p.write_text(s)
          PY
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Build and validate
        run: |
          gradle --no-daemon --console=plain -p unified-scanner clean testDebugUnitTest lintDebug assembleDebug assembleRelease
          mkdir -p unified-scanner/out
          cp unified-scanner/app/build/outputs/apk/debug/app-debug.apk unified-scanner/out/NSE-Unified-Scanner-S24-v1.2.0-DEBUG.apk
          cp unified-scanner/app/build/outputs/apk/release/app-release-unsigned.apk unified-scanner/out/NSE-Unified-Scanner-S24-v1.2.0-UNSIGNED.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging unified-scanner/out/NSE-Unified-Scanner-S24-v1.2.0-DEBUG.apk | grep "versionName='1.2.0'"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs unified-scanner/out/NSE-Unified-Scanner-S24-v1.2.0-DEBUG.apk > unified-scanner/out/DEBUG-SIGNATURE.txt
          sha256sum unified-scanner/out/NSE-Unified-Scanner-S24-v1.2.0-DEBUG.apk > unified-scanner/out/DEBUG-SHA256.txt
          grep -q 'ACCURACY SCORE' unified-scanner/app/src/main/java/com/suhas/nseunifiedscanner/MainActivity.java
          grep -q 'HOD/resistance blocks target' unified-scanner/app/src/main/java/com/suhas/nseunifiedscanner/ScannerEngine.java
          grep -q 'RECOVERY' unified-scanner/app/src/main/java/com/suhas/nseunifiedscanner/ScannerEngine.java
          grep -q 'notifyQualifiedSetups' unified-scanner/app/src/main/java/com/suhas/nseunifiedscanner/UnifiedService.java
          grep -q 'IMPORTANCE_HIGH' unified-scanner/app/src/main/java/com/suhas/nseunifiedscanner/UnifiedService.java
          grep -q 'hodroom' unified-scanner/app/src/main/java/com/suhas/nseunifiedscanner/LearningStore.java
      - uses: actions/upload-artifact@v4
        with:
          name: NSE-Unified-Scanner-S24-v1.2.0-BUILD
          path: |
            unified-scanner/out/**
            unified-scanner/app/build/reports/tests/testDebugUnitTest/**
            unified-scanner/app/build/reports/lint-results-debug.html
          retention-days: 30
