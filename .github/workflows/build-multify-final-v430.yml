name: Build Multify Trader Pro v4.3 Statistical Execution

on:
  push:
    branches:
      - multify-final-v430-statistical-execution-20261006
    paths:
      - 'multify-final-v420/**'
      - 'multify-final-v430/**'
      - '.github/workflows/build-multify-final-v430.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout v4.3 payload and stable signing material
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            multify-final-v420
            multify-final-v430
            multify-final-v4/stable_signing_key.jks.b64
            .github/workflows/build-multify-final-v430.yml
          sparse-checkout-cone-mode: false

      - name: Restore v4.2 source and apply v4.3 delta
        shell: bash
        run: |
          set -euo pipefail
          cat multify-final-v420/source.part* | base64 -d > /tmp/multify-v410-android.tgz
          tar -xzf /tmp/multify-v410-android.tgz
          test -f android/app/build.gradle.kts
          cat multify-final-v420/patch.part* > /tmp/multify-v420.patch
          (cd android && patch -p2 --batch --forward < /tmp/multify-v420.patch)
          sed -i -E 's#<domain>([^<]+)</domain>#<domain includeSubdomains="false">\1</domain>#g' android/app/src/debug/res/xml/network_security_config.xml
          sed -i '/applicationIdSuffix = ".debug"/d' android/app/build.gradle.kts

          cat multify-final-v430/patch.gz.b64.part* | base64 -d | gzip -d > /tmp/multify-v430.patch
          (cd android && patch -p1 --batch --forward < /tmp/multify-v430.patch)

          grep -q 'versionCode = 430' android/app/build.gradle.kts
          grep -q 'versionName = "4.3.0-statistical-execution-forecast"' android/app/build.gradle.kts
          base64 -d multify-final-v4/stable_signing_key.jks.b64 > android/app/multify-v4-stable.jks

      - name: Verify v4.3 execution contracts
        shell: bash
        run: |
          set -euo pipefail
          ROOT=android/app/src/main/java/com/multify/traderpro
          grep -q 'AVERAGE_STEP_FRACTION = 0.02' "$ROOT/engine/AdaptiveLearningMath.kt"
          grep -q 'AVERAGE_ADD_RUPEES = 5_000.0' "$ROOT/data/repository/TradingRepository.kt"
          grep -q 'PROFIT_TRAIL_RUPEES = 1.0' "$ROOT/data/repository/TradingRepository.kt"
          grep -q 'DAILY_SHORT_LOSS_BLOCKER = 2_000.0' "$ROOT/data/repository/TradingRepository.kt"
          grep -q 'executionMode' "$ROOT/data/preferences/AppPreferences.kt"
          grep -q 'waveCount' "$ROOT/data/preferences/AppPreferences.kt"
          grep -q '"LONG_ONLY"' "$ROOT/data/repository/TradingRepository.kt"
          grep -q '"SHORT_ONLY"' "$ROOT/data/repository/TradingRepository.kt"
          grep -q 'waveStats' "$ROOT/data/network/ApiModels.kt"
          grep -q 'updateForecastOutcome' "$ROOT/data/local/LearningDao.kt"
          grep -q 'TradingEngineForegroundService' android/app/src/main/AndroidManifest.xml
          grep -q '750L' "$ROOT/service/TradingEngineForegroundService.kt"
          grep -q 'submitManualSignal' "$ROOT/data/repository/TradingRepository.kt"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests and lint
        working-directory: android
        run: gradle --no-daemon --console=plain :app:testDebugUnitTest :app:lintDebug

      - name: Build stable-signed APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK signature, identity and stage output
        shell: bash
        run: |
          set -euo pipefail
          OUT=android/app/build/outputs/apk/debug
          STAGE=build-output
          mkdir -p "$STAGE"
          APK="$STAGE/MultifyTraderPro-VivoY73-v4.3.0-statistical-execution-forecast.apk"
          cp "$OUT/app-debug.apk" "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee "$STAGE/SIGNATURE.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee "$STAGE/BADGING.txt"
          grep -q "package: name='com.multify.traderpro.vivoy73final'" "$STAGE/BADGING.txt"
          grep -q "versionCode='430'" "$STAGE/BADGING.txt"
          grep -q "versionName='4.3.0-statistical-execution-forecast-debug'" "$STAGE/BADGING.txt"
          sha256sum "$APK" | tee "$STAGE/SHA256.txt"
          cat > "$STAGE/VALIDATION-v4.3.0.txt" <<'EOF'
          Version: 4.3.0-statistical-execution-forecast
          Master ARM/DISARM + mutually exclusive AUTO/LONG ONLY/SHORT ONLY: PRESENT
          Wave selector 1-20: PRESENT
          Shared budget ₹10k-₹2L in ₹5k steps: PRESENT
          Always-on Shadow lane: PRESENT
          Long stop-loss: NONE in deterministic Multify lane
          Negative long sell: PROHIBITED in deterministic Multify lane
          Long averaging: ₹5,000 each further 2% decline within campaign budget
          Long/short learned move: TRAILING ARM LEVEL
          Profit trail: ₹1
          Short averaging: NONE
          Per-trade short stop-loss: NONE
          Daily cumulative gross short loss blocker: ₹2,000
          Independent wave stats 1-20: PRESENT
          Forecast Lab frozen max 5/day + after-market WIN/FAIL audit: PRESENT
          Persistent foreground execution lane: PRESENT
          WorkManager: RECOVERY FALLBACK ONLY
          Unit tests: PASS
          Android lint: PASS
          APK build: PASS
          APK signature verification: PASS
          EOF
          (cd android && zip -qr "../$STAGE/MultifyTraderPro-v4.3.0-source.zip" . -x '.gradle/*' '*/build/*' 'app/multify-v4-stable.jks')

      - name: Upload v4.3 APK and validation
        uses: actions/upload-artifact@v4
        with:
          name: MultifyTraderPro-VivoY73-v4.3.0-statistical-execution-forecast
          path: |
            build-output/MultifyTraderPro-VivoY73-v4.3.0-statistical-execution-forecast.apk
            build-output/MultifyTraderPro-v4.3.0-source.zip
            build-output/SIGNATURE.txt
            build-output/BADGING.txt
            build-output/SHA256.txt
            build-output/VALIDATION-v4.3.0.txt
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/reports/lint-results-debug.html
          if-no-files-found: error
          retention-days: 14
