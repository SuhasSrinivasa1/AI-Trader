name: v2.7.7 Trailing Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [multyfi-v2.7.4-final-stable]
    paths:
      - '.github/workflows/v277-trailing-diagnostic.yml'

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct v2.7.6 source
        shell: bash
        run: |
          set -euo pipefail
          python3 hotfix/run_v2411_exit_reconciliation_fresh.py
          cat stage2/patch.* > /tmp/stage2.b64
          base64 -d /tmp/stage2.b64 | gzip -dc > /tmp/stage2.patch
          git apply /tmp/stage2.patch
          cat v270/override.00 v270/override.01 v270/override.02 v270/override.03 \
              v270/override.04.00.00 v270/override.04.00.01 v270/override.04.00.02 v270/override.04.00.03 \
              v270/override.04.01 v270/override.04.02 v270/override.05 \
              v270/override.06.00 v270/override.06.01 v270/override.06.02 > /tmp/v270.b64
          base64 -d /tmp/v270.b64 > /tmp/v270-overrides.tgz
          tar -xzf /tmp/v270-overrides.tgz -C android-stable
          python3 v271/apply_v271_gtt_fix.py
          python3 v272/apply_v272_duplicate_reconcile.py
          python3 v272/repair_v272_host_tests.py
          python3 v273/apply_v273_legacy_gtt_test.py
          base64 -d v274/apply_v274_final_stable.py.gz.b64 | gzip -dc > /tmp/apply_v274.py
          python3 /tmp/apply_v274.py
          python3 v274/sync_v274_tests.py
          python3 v275/apply_v275_manual_exit_reentry.py
          python3 v276/apply_v276_wallet_prewarm.py
      - name: Inspect entry basis and trailing path
        shell: bash
        run: |
          set -euo pipefail
          J=android-stable/app/src/main/java/com/suhas/multyfiautobuy/stable
          echo '=== ENTRY AVERAGE REFERENCES ==='
          grep -RniE 'entry average|entryAverage|averageFill|average_fill|observed.*average|net_price|netPrice|entryPrice|peakNet|profitTrail|protectedFloor|PROFIT_TRAIL' "$J" | head -n 700 || true
          echo '=== STRATEGY FIELDS ==='
          grep -n -C 5 -E 'average|entry|filled|protected|peak' "$J/Strategy.java" | head -n 400 || true
          echo '=== MONITOR ACTIVE POSITION ==='
          grep -n -C 25 -E 'STAGE2 ADAPTIVE WATCH ARMED|estimatedNetPnl|profitTrail|entryAverage|averageFill|observedFilled' "$J/StrategyMonitorService.java" | head -n 1000 || true
          echo '=== STAGE2 ENGINE ==='
          grep -n -C 30 -E 'profitTrail|peakNet|protectedFloor|estimatedNetPnl|entryPrice|average' "$J/Stage2Engine.java" | head -n 1000 || true
          echo '=== GROWW POSITION PARSING ==='
          grep -n -C 30 -E 'positions/user|positions/trading-symbol|net_price|netPrice|credit_price|debit_price|average_fill_price' "$J/GrowwClient.java" | head -n 1000 || true
