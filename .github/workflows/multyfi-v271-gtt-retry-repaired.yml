name: Multyfi v2.7.1 GTT Retry Repaired APK

on:
  push:
    branches: [multyfi-v2.7.0-work]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Rebuild v2.7.0 source baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 hotfix/run_v2411_exit_reconciliation_fresh.py
          cat stage2/patch.* > /tmp/stage2.b64
          echo '367e021e4a6978e96fa9ec0df22b7a510f938b8fc7bcdf3ac9dae26cc844b9b4  /tmp/stage2.b64' | sha256sum -c -
          base64 -d /tmp/stage2.b64 | gzip -dc > /tmp/stage2.patch
          echo '4cd2f7e1144b58e7adc4522ea6aee6f3dccdc65715743672273ae7973d49119b  /tmp/stage2.patch' | sha256sum -c -
          git apply --check /tmp/stage2.patch
          git apply /tmp/stage2.patch
          cat v270/override.00 v270/override.01 v270/override.02 v270/override.03 \
              v270/override.04.00.00 v270/override.04.00.01 v270/override.04.00.02 v270/override.04.00.03 \
              v270/override.04.01 v270/override.04.02 v270/override.05 \
              v270/override.06.00 v270/override.06.01 v270/override.06.02 > /tmp/v270.b64
          base64 -d /tmp/v270.b64 > /tmp/v270-overrides.tgz
          echo '3b1e85a0b17901916640d89e694878319bb6cce0eeb5c16e59980a99456d6403  /tmp/v270-overrides.tgz' | sha256sum -c -
          tar -xzf /tmp/v270-overrides.tgz -C android-stable

      - name: Apply v2.7.1 GTT fix and compile repair
        shell: bash
        run: |
          set -euo pipefail
          python3 v271/apply_v271_gtt_fix.py

      - name: Set v2.7.1 identity and verify safety contracts
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s/applicationId 'com.suhas.multyfiautobuy.v2411fresh'/applicationId 'com.suhas.multyfiautobuy.v271fresh'/" android-stable/app/build.gradle
          sed -i "s/versionCode 251/versionCode 271/" android-stable/app/build.gradle
          sed -i "s/versionName '2.4.11'/versionName '2.7.1'/" android-stable/app/build.gradle
          sed -i 's/Multyfi AutoBuy 2.7.0 FINAL/Multyfi AutoBuy 2.7.1 GTT RETRY/g' android-stable/app/src/main/res/values/strings.xml
          M=android-stable/app/src/main/java/com/suhas/multyfiautobuy/stable
          grep -q 'SMART_CREATE_MAX_ATTEMPTS = 3' "$M/GrowwClient.java"
          grep -q 'isTransientSmartCreateHttpCode' "$M/GrowwClient.java"
          test "$(grep -c 'HttpResult http = createSmartOrderWithRetry(accessToken, body);' "$M/GrowwClient.java")" -eq 3
          grep -q 'return smartCreateFailure(http);' "$M/GrowwClient.java"
          grep -q 'protectedNetFloor' "$M/Stage2DecisionPolicy.java"
          ! grep -q 'double protected =' "$M/Stage2DecisionPolicy.java"
          grep -q 'PROFIT_TRAIL_ARM_NET_RATE = 0.005' "$M/Stage2Policy.java"
          grep -q 'REENTRY_MIN_NET_RATE = 0.005' "$M/Stage2Policy.java"
          grep -q 'PER_CALL_NET_LOSS_LIMIT = 1000' "$M/Stage2Policy.java"
          grep -q 'DAILY_NET_LOSS_LIMIT = 2000' "$M/Stage2Policy.java"
          grep -q 'ENTRY_CUTOFF_MINUTE = 14 \* 60' "$M/Stage2Policy.java"
          grep -q 'FORCE_EXIT_MINUTE = 14 \* 60 + 59' "$M/Stage2Policy.java"
          grep -q 'GrowwClient.placeEarlyExitMarketSell' "$M/ProductionNotificationService.java"
          grep -q 'P0 SELL ≤100 ms app-dispatch target' "$M/ProductionActivity.java"

      - name: Test lint and release build
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --console=plain -p android-stable :app:testDebugUnitTest :app:lintDebug :app:assembleRelease | tee build.log
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          t=f=e=0
          for p in Path('android-stable/app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'):
              x=ET.parse(p).getroot(); t+=int(x.attrib.get('tests',0)); f+=int(x.attrib.get('failures',0)); e+=int(x.attrib.get('errors',0))
          print(f'Tests={t} Failures={f} Errors={e}')
          assert t>=105 and f==0 and e==0
          Path('/tmp/tests.txt').write_text(f'Tests: {t}\nFailures: {f}\nErrors: {e}\n')
          PY

      - name: Fresh sign validate and package
        shell: bash
        run: |
          set -euo pipefail
          OUT=android-stable/v271-repaired; mkdir -p "$OUT"
          KS="$RUNNER_TEMP/v271-repaired.jks"; PASS='MultyfiV271Repaired_2026!'
          keytool -genkeypair -keystore "$KS" -storepass "$PASS" -keypass "$PASS" -alias multyfi-v271-repaired -keyalg RSA -keysize 4096 -validity 3650 -dname 'CN=Multyfi AutoBuy v2.7.1 GTT Retry, OU=Private Build, O=Multyfi AutoBuy, L=Bengaluru, ST=Karnataka, C=IN'
          UNSIGNED=$(find android-stable/app/build/outputs/apk/release -maxdepth 1 -type f -name '*unsigned*.apk' | head -n1)
          FINAL="$OUT/Multyfi-AutoBuy-v2.7.1-GTT-RETRY-FRESH-SIGNED.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$UNSIGNED" "$OUT/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$KS" --ks-key-alias multyfi-v271-repaired --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out "$FINAL" "$OUT/aligned.apk"
          rm -f "$OUT/aligned.apk" "$KS"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$FINAL" | tee "$OUT/SIGNATURE-VERIFY.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$FINAL" | tee "$OUT/BADGING.txt"
          grep -q "package: name='com.suhas.multyfiautobuy.v271fresh'" "$OUT/BADGING.txt"
          grep -q "versionCode='271'" "$OUT/BADGING.txt"
          grep -q "versionName='2.7.1'" "$OUT/BADGING.txt"
          sha256sum "$FINAL" | tee "$OUT/SHA256.txt"
          {
            echo 'Multyfi AutoBuy v2.7.1 — GTT transient-service retry repair'
            echo '============================================================='
            echo 'Groww Smart Order create: retry HTTP 429/500/502/503/504 up to 3 attempts.'
            echo 'Retries reuse the exact same request body and reference_id.'
            echo 'HTTP 400/401/403/422 are not blindly retried.'
            echo '1-share GTT test reports exhausted transient server failure clearly.'
            echo 'P0 Multyfi SELL direct MARKET path unchanged; no Smart Order retry sleeps on P0 SELL.'
            echo 'v2.7.0 profit trail, re-entry, risk and time policies unchanged.'
            cat /tmp/tests.txt
            echo 'Lint: passed'
            echo 'Release assemble: passed'
            echo 'APK signing/badging: passed'
            echo 'Physical-device Groww GTT create/cancel must still be re-tested by the user.'
            cat "$OUT/SHA256.txt"
          } | tee "$OUT/VALIDATION.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: Multyfi-AutoBuy-v2.7.1-GTT-RETRY-REPAIRED
          path: android-stable/v271-repaired/*
          if-no-files-found: error
