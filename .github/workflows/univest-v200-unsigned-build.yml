name: Univest v2.0.0 Unsigned Builder
on:
  push:
    paths:
      - '.github/workflows/univest-v200-unsigned-build.yml'
      - '.build-temp/univest-v200-final/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct source
        run: |
          rm -rf UnivestAutoTrade
          mkdir UnivestAutoTrade
          tar -xzf .build-temp/univest-v200-final/source.tar.gz -C UnivestAutoTrade

      - name: Validate locked rules
        run: |
          grep -R -q 'com.univest.capp' UnivestAutoTrade/app/src/main/java
          grep -R -q 'ENTRY_BUDGET = 20000' UnivestAutoTrade/app/src/main/java
          grep -R -q 'REENTRY_BUDGET = 5000' UnivestAutoTrade/app/src/main/java
          grep -R -q 'EXPORT COMPLETE DEBUG ZIP' UnivestAutoTrade/app/src/main/java
          grep -R -q 'SYMBOL_MAPPING_FAILED' UnivestAutoTrade/app/src/main/java

      - name: Test and build unsigned release
        working-directory: UnivestAutoTrade
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain clean testReleaseUnitTest assembleRelease

      - name: Collect unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          APK="$(find UnivestAutoTrade/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -1)"
          test -n "$APK" && test -s "$APK"
          cp "$APK" release/Univest-AutoTrade-v2.0.0-UNSIGNED.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee release/APK-BADGING.txt
          grep -q "package: name='com.suhas.multyfideliverybuy'" release/APK-BADGING.txt
          grep -q "versionCode='200'" release/APK-BADGING.txt
          grep -q "versionName='2.0.0'" release/APK-BADGING.txt
          sha256sum release/Univest-AutoTrade-v2.0.0-UNSIGNED.apk > release/APK-SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Univest-AutoTrade-v2.0.0-UNSIGNED
          retention-days: 7
          path: release/*
          if-no-files-found: error
