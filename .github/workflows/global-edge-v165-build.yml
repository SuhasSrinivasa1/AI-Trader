name: Global Edge AI Trader v1.6.5 Multify Live Execution Build

on:
  push:
    paths:
      - '.github/workflows/global-edge-v165-build.yml'
      - 'fresh-global-edge/v165/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - name: Recover exact v1.6.4 source
        shell: bash
        run: |
          set -euo pipefail
          SRCZIP=fresh-global-edge/v164/release/Global-Edge-AI-Trader-v1.6.4-source.zip
          test -s "$SRCZIP"
          rm -rf /tmp/v165 && mkdir -p /tmp/v165
          unzip -q "$SRCZIP" -d /tmp/v165
          test -f /tmp/v165/Global-Edge-AI-Trader-v1.5.0-source/app/build.gradle.kts

      - name: Apply v1.6.5 Multify LIVE patch
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/v165/Global-Edge-AI-Trader-v1.5.0-source
          echo '6a0094bc2373087efd7869911009c3f34416e84b70bcd9a8a18158a5e34ab0fc  fresh-global-edge/v165/patch-parts/part-00.b64' | sha256sum -c -
          echo '91e00cf1b71a61909888a19aba5e094a6d6071e6664591498e46be8b02840eed  fresh-global-edge/v165/patch-parts/part-01.b64' | sha256sum -c -
          echo '80881df8a8795d605b46be54ef5f99942df4d2beefcd8c50329d65d00c43df6b  fresh-global-edge/v165/patch-parts/part-02.b64' | sha256sum -c -
          cat fresh-global-edge/v165/patch-parts/part-*.b64 | tr -d '\r\n ' | base64 -d > /tmp/v165.patch.gz
          echo '742b7d24d5e4834295a17126beca73b34dc9bf322ec5a3257b01a85c51562790  /tmp/v165.patch.gz' | sha256sum -c -
          gzip -t /tmp/v165.patch.gz
          gunzip -c /tmp/v165.patch.gz > /tmp/v165.patch
          cd "$SRC"
          patch -p1 --batch < /tmp/v165.patch
          grep -q 'versionCode = 165' app/build.gradle.kts
          grep -q 'versionName = "1.6.5"' app/build.gradle.kts
          grep -q 'multifyLiveTradingEnabled' app/src/main/java/com/suhas/ucsentinel/domain/model/Models.kt
          grep -q 'placeIntradayMarketOrder' app/src/main/java/com/suhas/ucsentinel/data/remote/GrowwClient.kt
          grep -q 'placeMultifyLiveOrder' app/src/main/java/com/suhas/ucsentinel/data/repository/UCSentinelRepository.kt
          grep -q 'liveEntryReference' app/src/main/java/com/suhas/ucsentinel/domain/model/MultifyModels.kt
          grep -q 'REAL ORDERS' app/src/main/java/com/suhas/ucsentinel/ui/MultifyScreen.kt
          grep -q 'EXIT ALL MULTIFY POSITIONS' app/src/main/java/com/suhas/ucsentinel/ui/MultifyScreen.kt
          grep -q 'writeCentralizedBundle' app/src/main/java/com/suhas/ucsentinel/diagnostics/DiagnosticLog.kt
          grep -q 'Export all logs' app/src/main/java/com/suhas/ucsentinel/ui/MoreScreen.kt
          grep -q 'MULTIFY_CAPITAL_BUDGET=200_000.0' app/src/main/java/com/suhas/ucsentinel/data/repository/UCSentinelRepository.kt
          grep -q 'MULTIFY_DAILY_NET_TARGET=5_000.0' app/src/main/java/com/suhas/ucsentinel/data/repository/UCSentinelRepository.kt
          test -s CHANGELOG-v1.6.5.txt
          echo 'v1.6.5 source verification passed'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unit tests and release APK
        working-directory: /tmp/v165/Global-Edge-AI-Trader-v1.5.0-source
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out
          gradle --no-daemon --console=plain clean testDebugUnitTest assembleRelease 2>&1 | tee out/GRADLE-BUILD-TEST.log
          echo 'Unit tests + assembleRelease: PASS' > out/TEST-RESULT-SUMMARY.txt

      - name: Recover preserved signing material
        uses: actions/download-artifact@v4
        with:
          name: Global-Edge-AI-Trader-v1.5.0-FINAL
          repository: SuhasSrinivasa1/AI-Trader
          run-id: 36146076154
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/v150-artifact

      - name: Sign and verify preserved update certificate
        working-directory: /tmp/v165/Global-Edge-AI-Trader-v1.5.0-source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out /tmp/signing
          BACKUP=$(find /tmp/v150-artifact -type f -name 'Global-Edge-AI-Trader-v1.5.0-SIGNING-BACKUP.zip' | head -n1)
          test -n "$BACKUP" && test -s "$BACKUP"
          unzip -q "$BACKUP" -d /tmp/signing
          KEYSTORE=/tmp/signing/global-edge-v1.5.0.keystore
          INFO=/tmp/signing/SIGNING-INFO.txt
          STORE_PASS=$(grep '^store_password=' "$INFO" | cut -d= -f2-)
          KEY_PASS=$(grep '^key_password=' "$INFO" | cut -d= -f2-)
          UNSIGNED=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*release*.apk' | head -n1)
          OUT=out/Global-Edge-AI-Trader-v1.6.5.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$KEYSTORE" --ks-pass pass:"$STORE_PASS" --key-pass pass:"$KEY_PASS" --ks-key-alias globaledge --out "$OUT" "$UNSIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$OUT" | tee out/APK-SIGNATURE-VERIFY.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$OUT" | tee out/APK-BADGING.txt
          grep -q "package: name='com.suhas.globaledgeai'" out/APK-BADGING.txt
          grep -q "versionCode='165'" out/APK-BADGING.txt
          grep -q "versionName='1.6.5'" out/APK-BADGING.txt
          CERT_SHA=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$OUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)
          test "$CERT_SHA" = '31ffa51c23b76f450cf099d00b254870bf8eacc5ce79aee4458070a0fab783d7'
          sha256sum "$OUT" | tee out/SHA256.txt
          {
            echo 'build=SUCCESS'
            echo 'package=com.suhas.globaledgeai'
            echo 'versionCode=165'
            echo 'versionName=1.6.5'
            echo "signer_sha256=$CERT_SHA"
            echo 'update_certificate_preserved=true'
            echo 'multify_equity_only=true'
            echo 'multify_shadow_live_same_decision=true'
            echo 'multify_real_order_toggle=true'
            echo 'multify_real_order_auto_execution=true'
            echo 'multify_intraday_product=MIS'
            echo 'multify_live_resets_daily=true'
            echo 'multify_static_ip_guard=true'
            echo 'multify_duplicate_order_guard=true'
            echo 'multify_exit_auto_management=true'
            echo 'multify_capital_budget=200000'
            echo 'multify_daily_net_target=5000'
            echo 'multify_daily_loss_circuit_breaker=-5000'
            echo 'multify_stock_specific_strategy_memory=true'
            echo 'centralized_log_export=true'
            echo 'v164_multify_lab_preserved=true'
            echo 'v163_signal_visibility_preserved=true'
            echo 'v159_ledger_integrity_preserved=true'
          } > out/BUILD-STATUS.txt

      - name: Package source and logs
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/v165/Global-Edge-AI-Trader-v1.5.0-source
          cd /tmp/v165
          zip -qr "$SRC/out/Global-Edge-AI-Trader-v1.6.5-source.zip" Global-Edge-AI-Trader-v1.5.0-source -x '*/.gradle/*' '*/build/*' '*/out/*' '*.keystore' '*.jks'
          cd "$SRC/out"
          zip -q Global-Edge-AI-Trader-v1.6.5-build-logs.zip APK-SIGNATURE-VERIFY.txt APK-BADGING.txt SHA256.txt BUILD-STATUS.txt TEST-RESULT-SUMMARY.txt GRADLE-BUILD-TEST.log

      - name: Upload final v1.6.5 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Global-Edge-AI-Trader-v1.6.5-FINAL
          retention-days: 90
          if-no-files-found: error
          path: |
            /tmp/v165/Global-Edge-AI-Trader-v1.5.0-source/out/Global-Edge-AI-Trader-v1.6.5.apk
            /tmp/v165/Global-Edge-AI-Trader-v1.5.0-source/out/Global-Edge-AI-Trader-v1.6.5-source.zip
            /tmp/v165/Global-Edge-AI-Trader-v1.5.0-source/out/Global-Edge-AI-Trader-v1.6.5-build-logs.zip
            /tmp/v165/Global-Edge-AI-Trader-v1.5.0-source/out/BUILD-STATUS.txt

      - name: Publish v1.6.5 release files
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/v165/Global-Edge-AI-Trader-v1.5.0-source/out
          DEST=fresh-global-edge/v165/release
          mkdir -p "$DEST"
          cp "$SRC/Global-Edge-AI-Trader-v1.6.5.apk" "$DEST/"
          cp "$SRC/Global-Edge-AI-Trader-v1.6.5-source.zip" "$DEST/"
          cp "$SRC/Global-Edge-AI-Trader-v1.6.5-build-logs.zip" "$DEST/"
          cp "$SRC/BUILD-STATUS.txt" "$DEST/"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$DEST"
          git commit -m 'Publish Global Edge AI Trader v1.6.5 Multify live execution release [skip ci]'
          git push
