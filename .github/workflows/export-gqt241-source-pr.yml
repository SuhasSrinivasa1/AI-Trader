name: Export GQT v2.4.1 source for patching

on:
  pull_request:
    branches: [main]
    paths:
      - 'global-quant-v241/**'
      - '.github/workflows/export-gqt241-source-pr.yml'

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact v2.4.1 source
        shell: bash
        run: |
          set -euo pipefail
          cat \
            global-quant-v241/part00.b64 \
            global-quant-v241/part01.b64 \
            global-quant-v241/exact/p02_00.txt \
            global-quant-v241/exact/p02_01.txt \
            global-quant-v241/exact/p02_02.txt \
            global-quant-v241/exact/p02_03.txt \
            global-quant-v241/exact/p03_00.txt \
            global-quant-v241/exact/p03_01_00.txt \
            global-quant-v241/exact/p03_01_01.txt \
            global-quant-v241/exact/p03_01_02.txt \
            global-quant-v241/exact/p03_01_03.txt \
            global-quant-v241/exact/p03_02.txt \
            global-quant-v241/exact/p03_03.txt \
            > /tmp/gqt241.b64
          base64 -d /tmp/gqt241.b64 > /tmp/gqt241.tar.gz
          rm -rf /tmp/gqt241
          mkdir -p /tmp/gqt241
          tar -xzf /tmp/gqt241.tar.gz -C /tmp/gqt241

          python3 - /tmp/gqt241 <<'PY'
          from pathlib import Path
          import sys
          base=Path(sys.argv[1])/"app/src/main/java/com/suhas/arbitrageedge"
          for name in ("SecurePrefs.kt","ArbitrageRepository.kt","UI.kt"):
              p=base/name
              if p.exists():
                  x=p.read_text()
                  x=x.replace("\\n","\n")
                  if name=="ArbitrageRepository.kt":
                      x=x.replace('\\\"','"')
                  p.write_text(x)
          test=Path(sys.argv[1])/"app/src/test/java/com/suhas/arbitrageedge/LiveTogglePolicyTest.kt"
          if test.exists():
              x=test.read_text().replace("\\n","\n")
              test.write_text(x)
          PY

          echo '' | base64 -d > "/tmp/gqt241/app/src/main/java/com/suhas/arbitrageedge/AppLog.kt"

          cat \
            global-quant-v241/overlay/part00.txt \
            global-quant-v241/overlay/part01.txt \
            global-quant-v241/overlay/part02.txt \
            > /tmp/gqt241-overlay.b64
          base64 -d /tmp/gqt241-overlay.b64 > /tmp/gqt241-overlay.tar.gz
          tar -xzf /tmp/gqt241-overlay.tar.gz -C /tmp/gqt241

          cd /tmp/gqt241
          zip -qr /tmp/Global-Quant-Trader-AI-v2.4.1-source-reconstructed.zip . -x '.gradle/*' 'app/build/*' 'build/*'

      - name: Upload reconstructed source
        uses: actions/upload-artifact@v4
        with:
          name: GQT-v2.4.1-reconstructed-source
          path: /tmp/Global-Quant-Trader-AI-v2.4.1-source-reconstructed.zip
          if-no-files-found: error
