name: TEMP Capture v2.7.8 Run

on:
  workflow_run:
    workflows: ["Multyfi v2.7.8 Zero Buffer + Reentry Stable"]
    types: [completed]

permissions:
  contents: write

jobs:
  capture:
    if: github.event.workflow_run.head_branch == 'multyfi-v2.7.4-final-stable'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Write run marker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-status
          cat > ci-status/v278-last-run.txt <<EOF
          run_id=${{ github.event.workflow_run.id }}
          conclusion=${{ github.event.workflow_run.conclusion }}
          head_sha=${{ github.event.workflow_run.head_sha }}
          html_url=${{ github.event.workflow_run.html_url }}
          EOF
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add ci-status/v278-last-run.txt
          git commit -m 'TEMP record v2.7.8 run [skip ci]' || true
          git push origin HEAD:main
