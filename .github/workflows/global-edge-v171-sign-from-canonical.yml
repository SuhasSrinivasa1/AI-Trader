name: Global Edge AI Trader v1.6.11 Canonical Signed Build

on:
  push:
    paths:
      - 'fresh-global-edge/v171/TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout signing repository
        uses: actions/checkout@v4
        with:
          path: signing-repo

      - name: Checkout canonical v1.6.11 source
        uses: actions/checkout@v4
        with:
          repository: SuhasSrinivasa1/Global-Edge-AI-Trader
          ref: main
          path: canonical
          persist-credentials: false

      - name: Verify canonical source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 171' canonical/app/build.gradle.kts
          grep -q 'versionName = "1.6.11"' canonical/app/build.gradle.kts
          grep -q 'trusted_multify_package_v168' canonical/app/src/main/java/com/suhas/ucsentinel/notifications/MultifyNotificationService.kt
          grep -q 'bayesianWinRatePct' canonical/app/src/main/java/com/suhas/ucsentinel/data/repository/UCSentinelRepository.kt
          grep -q 'CONFIRM_1M' canonical/app/src/main/java/com/suhas/ucsentinel/data/repository/UCSentinelRepository.kt
          grep -q 'scanUpperCircuitThreePm' canonical/app/src/main/java/com/suhas/ucsentinel/data/repository/UCSentinelRepository.kt
          grep -q '!phase.open' canonical/app/src/main/java/com/suhas/ucsentinel/domain/engine/GlobalLeadEngine.kt
          grep -q 'thresholdPool' canonical/app/src/main/java/com/suhas/ucsentinel/domain/engine/ScannerEngine.kt
          grep -q 'scanner_service_heartbeat_at_v170' canonical/app/src/main/java/com/suhas/ucsentinel/data/local/AppPreferences.kt
          grep -q 'SESSION_SYMBOL_CHURN_BLOCK' canonical/app/src/main/java/com/suhas/ucsentinel/data/repository/UCSentinelRepository.kt
          grep -q 'SESSION_COLD_PROBATION' canonical/app/src/main/java/com/suhas/ucsentinel/data/repository/UCSentinelRepository.kt
          grep -q 'isThreePmPriorityWindow' canonical/app/src/main/java/com/suhas/ucsentinel/domain/engine/AutomationPolicy.kt
          test -f canonical/app/src/main/java/com/suhas/ucsentinel/data/local/PersistentLearningVault.kt
          grep -q 'global_edge_learning_vault_control_v171' canonical/app/src/main/java/com/suhas/ucsentinel/data/local/PersistentLearningVault.kt
          grep -q 'restoreLearningVault' canonical/app/src/main/java/com/suhas/ucsentinel/data/repository/UCSentinelRepository.kt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unit tests and release APK
        working-directory: canonical
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out
          gradle --no-daemon --console=plain clean testDebugUnitTest assembleRelease 2>&1 | tee out/GRADLE-BUILD-TEST.log
          echo 'Unit tests + assembleRelease: PASS' > out/TEST-RESULT-SUMMARY.txt

      - name: Recover preserved signing material
        uses: actions/download-artifact@v4
        with:
          name: Global-Edge-AI-Trader-v1.5.0-FINAL
          repository: SuhasSrinivasa1/AI-Trader
          run-id: 36146076154
          github-token: ${{ github.token }}
          path: /tmp/v150-artifact

      - name: Sign and verify preserved update certificate
        working-directory: canonical
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out /tmp/signing
          BACKUP=$(find /tmp/v150-artifact -type f -name 'Global-Edge-AI-Trader-v1.5.0-SIGNING-BACKUP.zip' | head -n1)
          test -n "$BACKUP" && test -s "$BACKUP"
          unzip -q "$BACKUP" -d /tmp/signing
          KEYSTORE=/tmp/signing/global-edge-v1.5.0.keystore
          INFO=/tmp/signing/SIGNING-INFO.txt
          STORE_PASS=$(grep '^store_password=' "$INFO" | cut -d= -f2-)
          KEY_PASS=$(grep '^key_password=' "$INFO" | cut -d= -f2-)
          UNSIGNED=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*release*.apk' | head -n1)
          OUT=out/Global-Edge-AI-Trader-v1.6.11.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$KEYSTORE" --ks-pass pass:"$STORE_PASS" --key-pass pass:"$KEY_PASS" --ks-key-alias globaledge --out "$OUT" "$UNSIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$OUT" | tee out/APK-SIGNATURE-VERIFY.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$OUT" | tee out/APK-BADGING.txt
          grep -q "package: name='com.suhas.globaledgeai'" out/APK-BADGING.txt
          grep -q "versionCode='171'" out/APK-BADGING.txt
          grep -q "versionName='1.6.11'" out/APK-BADGING.txt
          CERT_SHA=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$OUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)
          test "$CERT_SHA" = '31ffa51c23b76f450cf099d00b254870bf8eacc5ce79aee4458070a0fab783d7'
          sha256sum "$OUT" | tee out/SHA256.txt
          {
            echo 'build=SUCCESS'
            echo 'canonical_repo=SuhasSrinivasa1/Global-Edge-AI-Trader'
            echo 'package=com.suhas.globaledgeai'
            echo 'versionCode=171'
            echo 'versionName=1.6.11'
            echo "signer_sha256=$CERT_SHA"
            echo 'update_certificate_preserved=true'
            echo 'v167_execution_hardening_preserved=true'
            echo 'multify_explicit_exact_package_trust=true'
            echo 'multify_auto_package_trust=false'
            echo 'multify_live_requires_trusted_source=true'
            echo 'multify_latency_chain=true'
            echo 'multify_bayesian_champion_shrinkage=true'
            echo 'multify_recency_weighted_champion=true'
            echo 'multify_counterfactual_delayed_entry=true'
            echo 'broker_based_emergency_flatten_extended=true'
            echo 'real_orders_daily_reset_preserved=true'
            echo 'android_backup_disabled=true'
            echo 'global_offhours_live_blocked=true'
            echo 'uc_three_pm_next_session_lane=true'
            echo 'uc_adaptive_live_pool=true'
            echo 'strategy_historical_path_reconcile=true'
            echo 'foreground_duplicate_scans_removed=true'
            echo 'min_sdk=28'
            echo 'single_owner_market_scanner=true'
            echo 'workmanager_stale_only_fallback=true'
            echo 'scanner_heartbeat_watchdog=true'
            echo 'uc_three_pm_absolute_priority=true'
            echo 'uc_three_pm_1510_1530=true'
            echo 'strategy_same_session_symbol_churn_block=true'
            echo 'strategy_same_day_cold_probation=true'
            echo 'process_restart_cadence_restored=true'
            echo 'persistent_learning_vault=true'
            echo 'vault_survives_normal_uninstall=true'
            echo 'vault_excludes_credentials_and_tokens=true'
            echo 'vault_restore_disarms_real_orders=true'
            echo 'vault_auto_snapshot_interval_minutes=2'
          } > out/BUILD-STATUS.txt

      - name: Package source and logs
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/canonical"
          cd "$SRC"
          zip -qr out/Global-Edge-AI-Trader-v1.6.11-source.zip . -x '.git/*' '*/.gradle/*' '*/build/*' 'out/*' '*.keystore' '*.jks'
          cd out
          zip -q Global-Edge-AI-Trader-v1.6.11-build-logs.zip APK-SIGNATURE-VERIFY.txt APK-BADGING.txt SHA256.txt BUILD-STATUS.txt TEST-RESULT-SUMMARY.txt GRADLE-BUILD-TEST.log

      - name: Upload final v1.6.11 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Global-Edge-AI-Trader-v1.6.11-FINAL
          retention-days: 90
          if-no-files-found: error
          path: |
            canonical/out/Global-Edge-AI-Trader-v1.6.11.apk
            canonical/out/Global-Edge-AI-Trader-v1.6.11-source.zip
            canonical/out/Global-Edge-AI-Trader-v1.6.11-build-logs.zip
            canonical/out/BUILD-STATUS.txt
