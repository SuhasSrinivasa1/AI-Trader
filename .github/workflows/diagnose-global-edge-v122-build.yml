name: Diagnose Global Edge v1.2.2 Build

on:
  push:
    paths:
      - '.github/workflows/diagnose-global-edge-v122-build.yml'
      - 'fresh-global-edge/v122/fix_v122.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Reconstruct, patch and compile
        shell: bash
        run: |
          set -euo pipefail
          cp fresh-global-edge/v103/reconstruct_v103.sh /tmp/reconstruct_v103.sh
          sed -i '/^grep -q /d' /tmp/reconstruct_v103.sh
          bash /tmp/reconstruct_v103.sh
          SRC=/tmp/global-edge-v103/Global-Edge-AI-Trader-v1.0.3-source
          python "$GITHUB_WORKSPACE/fresh-global-edge/v103/upgrade_v103_entry_ui.py" "$SRC"
          python "$GITHUB_WORKSPACE/fresh-global-edge/v104/upgrade_v104.py" "$SRC"
          python "$GITHUB_WORKSPACE/fresh-global-edge/v104/fix_v104_notification.py" "$SRC"
          apply_patch_file() {
            dir="$1"; file="$2"
            cat "$GITHUB_WORKSPACE/fresh-global-edge/$dir/$file" | tr -d '\r\n ' | base64 -d > /tmp/p.gz
            gunzip -c /tmp/p.gz > /tmp/p.patch
            cd "$SRC"
            patch -p1 --batch < /tmp/p.patch
          }
          apply_patch_file v110 v104-to-v110.patch.gz.b64
          apply_patch_file v111 v110-to-v111.patch.gz.b64
          python "$GITHUB_WORKSPACE/fresh-global-edge/v111/fix_v111_experimental.py" "$SRC"
          apply_patch_file v112 v111-to-v112.patch.gz.b64
          apply_patch_file v113 v112-to-v113.patch.gz.b64
          apply_patch_file v114 v113-to-v114.patch.gz.b64
          python "$GITHUB_WORKSPACE/fresh-global-edge/v115/upgrade_v115.py" "$SRC"
          apply_patch_file v116 v115-to-v116.patch.gz.b64
          apply_patch_file v117 v116-to-v117.patch.gz.b64
          apply_patch_file v118 v117-to-v118.patch.gz.b64
          apply_patch_file v119 v118-to-v119.patch.gz.b64
          apply_patch_file v120 v119-to-v120.patch.gz.b64
          cd "$SRC"
          cat \
            "$GITHUB_WORKSPACE/fresh-global-edge/v121/patch.part00" \
            "$GITHUB_WORKSPACE/fresh-global-edge/v121/patch.part01" \
            "$GITHUB_WORKSPACE/fresh-global-edge/v121/patch.part02" \
            "$GITHUB_WORKSPACE/fresh-global-edge/v121/patch.part03" \
            "$GITHUB_WORKSPACE/fresh-global-edge/v121/patch.part04" \
            "$GITHUB_WORKSPACE/fresh-global-edge/v121/patch.part05" \
            | tr -d '\r\n ' | base64 -d > /tmp/v121.gz
          gunzip -c /tmp/v121.gz > /tmp/v121.patch
          patch -p1 --batch < /tmp/v121.patch
          python "$GITHUB_WORKSPACE/fresh-global-edge/v122/fix_v122.py" "$SRC"

          set +e
          gradle --no-daemon --console=plain clean testDebugUnitTest assembleRelease > /tmp/v122-gradle.log 2>&1
          RC=$?
          set -e
          mkdir -p "$GITHUB_WORKSPACE/fresh-global-edge/v122/build-diagnostic"
          { echo "gradle_exit=$RC"; echo "run_id=$GITHUB_RUN_ID"; } > "$GITHUB_WORKSPACE/fresh-global-edge/v122/build-diagnostic/status.txt"
          tail -n 500 /tmp/v122-gradle.log > "$GITHUB_WORKSPACE/fresh-global-edge/v122/build-diagnostic/gradle-tail.txt"
          find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -printf '%f %s bytes\n' \
            > "$GITHUB_WORKSPACE/fresh-global-edge/v122/build-diagnostic/apks.txt" 2>/dev/null || true

          if [ "$RC" -eq 0 ]; then
            EXPORT="$GITHUB_WORKSPACE/fresh-global-edge/v122/export"
            mkdir -p "$EXPORT"
            APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
            cp "$APK" "$EXPORT/Global-Edge-AI-Trader-v1.2.2-UNSIGNED.apk"
            cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" "$EXPORT/apksigner-35.0.0.jar"
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > "$EXPORT/APK-BADGING-UNSIGNED.txt"
            sha256sum "$EXPORT/Global-Edge-AI-Trader-v1.2.2-UNSIGNED.apk" > "$EXPORT/SHA256-UNSIGNED.txt"
          fi

          cd "$GITHUB_WORKSPACE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add fresh-global-edge/v122/build-diagnostic fresh-global-edge/v122/export
          git commit -m 'Publish v1.2.2 build diagnostic [skip ci]'
          git push

      - name: Upload v1.2.2 build handoff
        uses: actions/upload-artifact@v4
        with:
          name: Global-Edge-v1.2.2-build-handoff
          retention-days: 30
          if-no-files-found: error
          path: |
            fresh-global-edge/v122/export/Global-Edge-AI-Trader-v1.2.2-UNSIGNED.apk
            fresh-global-edge/v122/export/apksigner-35.0.0.jar
            fresh-global-edge/v122/export/APK-BADGING-UNSIGNED.txt
            fresh-global-edge/v122/export/SHA256-UNSIGNED.txt
