name: Global Edge AI Trader v1.0.3 Opening Entry Alert Build

on:
  push:
    paths:
      - 'fresh-global-edge/v103/upgrade_v103.py'
      - '.github/workflows/global-edge-v103-build.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore v1.0.1 source and apply v1.0.2 + v1.0.3 upgrades
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/global-edge-v103 /tmp/v101-artifact
          mkdir -p /tmp/global-edge-v103 /tmp/v101-artifact

          curl --fail --retry 3 -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o /tmp/v101-artifact.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10439043849/zip"
          unzip -q /tmp/v101-artifact.zip -d /tmp/v101-artifact
          test -s /tmp/v101-artifact/Global-Edge-AI-Trader-v1.0.1-source.zip
          unzip -q /tmp/v101-artifact/Global-Edge-AI-Trader-v1.0.1-source.zip -d /tmp/global-edge-v103
          SRC=/tmp/global-edge-v103/Global-Edge-AI-Trader-v1.0.1-source
          test -f "$SRC/app/build.gradle.kts"

          python "$GITHUB_WORKSPACE/fresh-global-edge/v102/upgrade_v102.py" "$SRC"
          python "$GITHUB_WORKSPACE/fresh-global-edge/v103/upgrade_v103.py" "$SRC"
          mv "$SRC" /tmp/global-edge-v103/Global-Edge-AI-Trader-v1.0.3-source
          SRC=/tmp/global-edge-v103/Global-Edge-AI-Trader-v1.0.3-source

          grep -q 'versionCode = 103' "$SRC/app/build.gradle.kts"
          grep -q 'versionName = "1.0.3"' "$SRC/app/build.gradle.kts"
          grep -q 'Global Lead: 9:15 entry signal' "$SRC/app/src/main/java/com/suhas/ucsentinel/notifications/AppNotifier.kt"
          grep -q 'notifyStrategySetups' "$SRC/app/src/main/java/com/suhas/ucsentinel/worker/ScanWorker.kt"
          grep -q 'notifyGlobalLead' "$SRC/app/src/main/java/com/suhas/ucsentinel/worker/ScanWorker.kt"
          grep -q '09:15 entry window' "$SRC/app/src/main/java/com/suhas/ucsentinel/ui/GlobalLeadScreen.kt"
          echo 'v1.0.3 source verification passed'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unit tests and release APK
        working-directory: /tmp/global-edge-v103/Global-Edge-AI-Trader-v1.0.3-source
        run: gradle --no-daemon --console=plain clean testDebugUnitTest assembleRelease

      - name: Sign and verify APK
        working-directory: /tmp/global-edge-v103/Global-Edge-AI-Trader-v1.0.3-source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          UNSIGNED=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*release*.apk' | head -n 1)
          test -n "$UNSIGNED"
          test -s "$UNSIGNED"

          KEYSTORE=/tmp/global-edge-v103-release.keystore
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -alias globaledge \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=Global Edge AI Trader, O=Private Research, C=IN'

          OUT=out/Global-Edge-AI-Trader-v1.0.3.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-pass pass:"$PASS" \
            --key-pass pass:"$PASS" \
            --ks-key-alias globaledge \
            --out "$OUT" "$UNSIGNED"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$OUT" | tee out/APK-SIGNATURE-VERIFY.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$OUT" | tee out/APK-BADGING.txt
          grep -q "package: name='com.suhas.globaledgeai'" out/APK-BADGING.txt
          grep -q "versionCode='103'" out/APK-BADGING.txt
          grep -q "versionName='1.0.3'" out/APK-BADGING.txt
          sha256sum "$OUT" | tee out/SHA256.txt

          cd ..
          zip -qr Global-Edge-AI-Trader-v1.0.3-source.zip Global-Edge-AI-Trader-v1.0.3-source \
            -x 'Global-Edge-AI-Trader-v1.0.3-source/.gradle/*' \
               'Global-Edge-AI-Trader-v1.0.3-source/app/build/*' \
               'Global-Edge-AI-Trader-v1.0.3-source/build/*' \
               'Global-Edge-AI-Trader-v1.0.3-source/out/*'
          mv Global-Edge-AI-Trader-v1.0.3-source.zip Global-Edge-AI-Trader-v1.0.3-source/out/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Global-Edge-AI-Trader-v1.0.3
          retention-days: 30
          if-no-files-found: error
          path: |
            /tmp/global-edge-v103/Global-Edge-AI-Trader-v1.0.3-source/out/Global-Edge-AI-Trader-v1.0.3.apk
            /tmp/global-edge-v103/Global-Edge-AI-Trader-v1.0.3-source/out/Global-Edge-AI-Trader-v1.0.3-source.zip
            /tmp/global-edge-v103/Global-Edge-AI-Trader-v1.0.3-source/out/APK-SIGNATURE-VERIFY.txt
            /tmp/global-edge-v103/Global-Edge-AI-Trader-v1.0.3-source/out/APK-BADGING.txt
            /tmp/global-edge-v103/Global-Edge-AI-Trader-v1.0.3-source/out/SHA256.txt

      - name: Publish APK into repository for direct download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fresh-global-edge/v103/release
          cp /tmp/global-edge-v103/Global-Edge-AI-Trader-v1.0.3-source/out/Global-Edge-AI-Trader-v1.0.3.apk fresh-global-edge/v103/release/
          cp /tmp/global-edge-v103/Global-Edge-AI-Trader-v1.0.3-source/out/SHA256.txt fresh-global-edge/v103/release/
          cp /tmp/global-edge-v103/Global-Edge-AI-Trader-v1.0.3-source/out/APK-BADGING.txt fresh-global-edge/v103/release/
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add fresh-global-edge/v103/release
          git commit -m 'Publish Global Edge AI Trader v1.0.3 APK [skip ci]'
          git push
