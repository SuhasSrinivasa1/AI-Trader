name: Multyfi v2.6.0 Stage2 Full Fresh Signed APK

on:
  push:
    branches: [multyfi-v2.6.0-stage2-full]
  workflow_dispatch:

jobs:
  build-sign-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate exact validated v2.4.11 baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 hotfix/run_v2411_exit_reconciliation_fresh.py | tee apply-v2411.log

      - name: Reconstruct and apply Stage2 implementation
        shell: bash
        run: |
          set -euo pipefail
          cat stage2/patch.* > /tmp/v260-stage2.patch.gz.b64
          echo '367e021e4a6978e96fa9ec0df22b7a510f938b8fc7bcdf3ac9dae26cc844b9b4  /tmp/v260-stage2.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/v260-stage2.patch.gz.b64 | gzip -dc > /tmp/v260-stage2.patch
          echo '4cd2f7e1144b58e7adc4522ea6aee6f3dccdc65715743672273ae7973d49119b  /tmp/v260-stage2.patch' | sha256sum -c -
          git apply --check /tmp/v260-stage2.patch
          git apply /tmp/v260-stage2.patch

      - name: Set v2.6.0 fresh-install identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          gradle=Path('android-stable/app/build.gradle')
          s=gradle.read_text()
          replacements={
              "applicationId 'com.suhas.multyfiautobuy.v2411fresh'":"applicationId 'com.suhas.multyfiautobuy.v260stage2'",
              'versionCode 251':'versionCode 260',
              "versionName '2.4.11'":"versionName '2.6.0'",
          }
          for old,new in replacements.items():
              if s.count(old)!=1: raise SystemExit(f'identity pattern mismatch: {old}')
              s=s.replace(old,new,1)
          gradle.write_text(s)
          strings=Path('android-stable/app/src/main/res/values/strings.xml')
          s=strings.read_text()
          old='<string name="app_name">Multyfi AutoBuy 2.4.11</string>'
          new='<string name="app_name">Multyfi AutoBuy 2.6.0 Stage2</string>'
          if s.count(old)!=1: raise SystemExit('app name pattern mismatch')
          strings.write_text(s.replace(old,new,1))
          PY

      - name: Verify Stage2 source contracts
        shell: bash
        run: |
          set -euo pipefail
          M=android-stable/app/src/main/java/com/suhas/multyfiautobuy/stable
          MON="$M/StrategyMonitorService.java"
          NS="$M/ProductionNotificationService.java"
          grep -q "applicationId 'com.suhas.multyfiautobuy.v260stage2'" android-stable/app/build.gradle
          grep -q 'versionCode 260' android-stable/app/build.gradle
          grep -q "versionName '2.6.0'" android-stable/app/build.gradle
          grep -q 'MAX_ACTIVE_POSITIONS = 3' "$M/Stage2Policy.java"
          grep -q 'ENTRY_CUTOFF_MINUTE = 14 \* 60' "$M/Stage2Policy.java"
          grep -q 'FORCE_EXIT_MINUTE = 14 \* 60 + 59' "$M/Stage2Policy.java"
          grep -q 'candleImpulse' "$M/Stage2Engine.java"
          grep -q 'pulledBackSincePeak' "$M/Stage2Engine.java"
          grep -q 'getMarketQuote' "$M/GrowwClient.java"
          grep -q 'getAvailableMisMargin' "$M/GrowwClient.java"
          grep -q 'getRequiredMisMargin' "$M/GrowwClient.java"
          grep -q 'STAGE2 AUTONOMOUS EXIT TRIGGERED' "$MON"
          grep -q 'STAGE2 REENTRY ACCEPTED' "$MON"
          grep -q 'STAGE2 PORTFOLIO LOSS LIMIT' "$MON"
          grep -q 'GrowwClient.placeEarlyExitMarketSell' "$NS"
          grep -q 'EARLY EXIT FULL POSITION CONFIRMED' "$MON"
          if grep -q 'NEW ENTRY BLOCKED — ONE STOCK AT A TIME' "$NS"; then
            echo 'old one-stock lock still present' >&2; exit 1
          fi
          if grep -q 'IntradayProtectionPolicy.targetHit' "$MON"; then
            echo 'fixed Multyfi target is still an automatic Stage2 profit exit' >&2; exit 1
          fi

      - name: Build, unit test and lint
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --console=plain -p android-stable \
            :app:testDebugUnitTest :app:lintDebug :app:assembleRelease \
            | tee build-v260-stage2.log

      - name: Verify unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root=Path('android-stable/app/build/test-results/testDebugUnitTest')
          tests=failures=errors=0
          for p in root.glob('TEST-*.xml'):
              x=ET.parse(p).getroot()
              tests += int(x.attrib.get('tests',0))
              failures += int(x.attrib.get('failures',0))
              errors += int(x.attrib.get('errors',0))
          print('v2.6.0 Stage2 tests', tests, 'failures', failures, 'errors', errors)
          assert tests >= 93
          assert failures == 0 and errors == 0
          Path('/tmp/test-summary.txt').write_text(f'Tests: {tests}\nFailures: {failures}\nErrors: {errors}\n')
          PY

      - name: Generate fresh signing key and sign APK
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/multyfi-v260-stage2.jks"
          PASS='MultyfiV260Stage2_2026!'
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -alias multyfi-v260-stage2 \
            -keyalg RSA -keysize 4096 -validity 3650 \
            -dname 'CN=Multyfi AutoBuy v2.6.0 Stage2, OU=Private Build, O=Multyfi AutoBuy, L=Bengaluru, ST=Karnataka, C=IN'
          UNSIGNED=$(find android-stable/app/build/outputs/apk/release -maxdepth 1 -type f -name '*unsigned*.apk' | head -n1)
          test -n "$UNSIGNED"
          OUTDIR=android-stable/v260-stage2-signed
          mkdir -p "$OUTDIR"
          ALIGNED="$OUTDIR/Multyfi-AutoBuy-v2.6.0-STAGE2-ALIGNED.apk"
          FINAL="$OUTDIR/Multyfi-AutoBuy-v2.6.0-STAGE2-FULL-FRESH-SIGNED.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias multyfi-v260-stage2 \
            --ks-pass "pass:$PASS" \
            --key-pass "pass:$PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$FINAL" "$ALIGNED"
          rm -f "$ALIGNED" "$KEYSTORE"

      - name: Verify APK and generate validation report
        shell: bash
        run: |
          set -euo pipefail
          OUTDIR=android-stable/v260-stage2-signed
          FINAL="$OUTDIR/Multyfi-AutoBuy-v2.6.0-STAGE2-FULL-FRESH-SIGNED.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$FINAL" | tee "$OUTDIR/SIGNATURE-VERIFY.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$FINAL" | tee "$OUTDIR/BADGING.txt"
          grep -q "package: name='com.suhas.multyfiautobuy.v260stage2'" "$OUTDIR/BADGING.txt"
          grep -q "versionCode='260'" "$OUTDIR/BADGING.txt"
          grep -q "versionName='2.6.0'" "$OUTDIR/BADGING.txt"
          sha256sum "$FINAL" | tee "$OUTDIR/SHA256.txt"
          {
            echo 'Multyfi AutoBuy v2.6.0 Stage2 — CI Validation'
            echo '================================================'
            echo 'Fresh package: com.suhas.multyfiautobuy.v260stage2'
            cat /tmp/test-summary.txt
            echo 'Lint: passed'
            echo 'Release assemble: passed'
            echo 'APK signature verification: passed'
            echo 'Badging/version verification: passed'
            echo 'Stage2 contracts: passed'
            echo
            echo 'Stage2 implementation:'
            echo '- Up to 3 simultaneous MIS portfolio slots; 32% configured portfolio budget per slot.'
            echo '- New entries and re-entries stop at 14:00 IST; forced MIS liquidation starts at 14:59 IST.'
            echo '- 500 ms batched LTP supervision plus sampled quote/market-depth snapshots.'
            echo '- RUNNER / RANGE / BREAKDOWN regime classification from EMA, volatility, 5-second micro-candles, volume and order-book imbalance.'
            echo '- Early profit uses structural/soft protection; established runners use adaptive protected-profit floors.'
            echo '- Tactical range/breakdown exits can arm pullback or breakout re-entry; authoritative Multyfi exits do not auto-reenter.'
            echo '- Re-entry quality score, daily high-water tightening, max 2 re-entries per symbol/day.'
            echo '- Re-entry validates available MIS margin and exact required margin before BUY.'
            echo '- Aggregate realised + open gross portfolio loss guard at -INR 2,000.'
            echo '- Existing high-priority direct Multyfi early-exit MARKET SELL path retained.'
            echo '- Learning is persisted heuristic outcome bias, not a trained ML model.'
            echo '- No fixed daily profit cap and no fixed Multyfi target profit-taking exit in Stage2.'
            echo
            echo 'Not validated by CI: physical-device Android installation, live Groww authentication/order fill, market slippage, or profitability.'
            echo
            cat "$OUTDIR/SHA256.txt"
          } | tee "$OUTDIR/VALIDATION.txt"

      - name: Upload Stage2 APK and validation
        uses: actions/upload-artifact@v4
        with:
          name: Multyfi-AutoBuy-v2.6.0-STAGE2-FULL-FRESH-SIGNED
          path: |
            android-stable/v260-stage2-signed/Multyfi-AutoBuy-v2.6.0-STAGE2-FULL-FRESH-SIGNED.apk
            android-stable/v260-stage2-signed/VALIDATION.txt
            android-stable/v260-stage2-signed/SHA256.txt
            android-stable/v260-stage2-signed/SIGNATURE-VERIFY.txt
            android-stable/v260-stage2-signed/BADGING.txt
          if-no-files-found: error
