name: TEMP v2.7.8 Diagnostic

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-v278-diagnostic.yml']

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: multyfi-v2.7.4-final-stable
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Reconstruct and diagnose
        shell: bash
        run: |
          set -euo pipefail
          python3 hotfix/run_v2411_exit_reconciliation_fresh.py
          cat stage2/patch.* > /tmp/stage2.b64
          base64 -d /tmp/stage2.b64 | gzip -dc > /tmp/stage2.patch
          git apply /tmp/stage2.patch
          cat v270/override.00 v270/override.01 v270/override.02 v270/override.03 \
              v270/override.04.00.00 v270/override.04.00.01 v270/override.04.00.02 v270/override.04.00.03 \
              v270/override.04.01 v270/override.04.02 v270/override.05 \
              v270/override.06.00 v270/override.06.01 v270/override.06.02 > /tmp/v270.b64
          base64 -d /tmp/v270.b64 > /tmp/v270-overrides.tgz
          tar -xzf /tmp/v270-overrides.tgz -C android-stable
          python3 v271/apply_v271_gtt_fix.py
          python3 v272/apply_v272_duplicate_reconcile.py
          python3 v272/repair_v272_host_tests.py
          python3 v273/apply_v273_legacy_gtt_test.py
          base64 -d v274/apply_v274_final_stable.py.gz.b64 | gzip -dc > /tmp/apply_v274.py
          python3 /tmp/apply_v274.py
          python3 v274/sync_v274_tests.py
          python3 v275/apply_v275_manual_exit_reentry.py
          python3 v276/apply_v276_wallet_prewarm.py
          python3 v277/apply_v277_entry_basis_trailing_fix.py
          python3 v277/repair_v277_compile.py
          python3 v277/add_v277_tests.py
          python3 v278/apply_v278_reentry_zero_buffer_trail.py
          python3 v278/add_v278_tests.py
          set +e
          gradle --no-daemon --console=plain -p android-stable :app:testDebugUnitTest :app:lintDebug :app:assembleRelease > /tmp/v278-build.log 2>&1
          echo $? > /tmp/v278-build.rc
          set -e
          tail -n 260 /tmp/v278-build.log > /tmp/v278-build-tail.txt
      - uses: actions/checkout@v4
        with:
          ref: main
          path: marker-main
      - name: Publish diagnostic tail
        shell: bash
        run: |
          set -euo pipefail
          cd marker-main
          mkdir -p ci-status
          { echo "rc=$(cat /tmp/v278-build.rc)"; cat /tmp/v278-build-tail.txt; } > ci-status/v278-build-diagnostic.txt
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add ci-status/v278-build-diagnostic.txt
          git commit -m 'TEMP v2.7.8 build diagnostic [skip ci]' || true
          git push origin HEAD:main
