name: Build Multyfi AutoBuy Pro v2.2.5 Durable MIS Stop

on:
  pull_request:
    branches: [main]
    paths:
      - 'hotfix/run_v225.py'
      - 'hotfix/run_v225_safe.py'
      - '.github/workflows/multyfi-v225-durable-mis-stop.yml'
  workflow_dispatch:

jobs:
  build-test-android16:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools" "emulator" "system-images;android-36;google_apis;x86_64"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Apply v2.2.5 source update
        shell: bash
        run: |
          set +e
          python3 hotfix/run_v225_safe.py > apply-v225.log 2>&1
          code=$?
          cat apply-v225.log
          echo "$code" > apply-v225-exit-code.txt
          exit "$code"

      - name: Unit tests, lint and source-built APK
        shell: bash
        run: |
          set +e
          gradle --no-daemon --console=plain -p android-stable :app:testDebugUnitTest :app:lintDebug :app:assembleDebug > build-v225.log 2>&1
          code=$?
          cat build-v225.log
          echo "$code" > build-v225-exit-code.txt
          exit "$code"

      - name: Verify KARURVYSYA protection fix and retained contracts
        shell: bash
        run: |
          set -euo pipefail
          ROOT=android-stable/app/src/main/java/com/suhas/multyfiautobuy/stable
          TEST=android-stable/app/src/test/java/com/suhas/multyfiautobuy/stable
          grep -q "versionCode 225" android-stable/app/build.gradle
          grep -q "versionName '2.2.5'" android-stable/app/build.gradle
          grep -q "class MisStopOrderPolicy" "$ROOT/MisStopOrderPolicy.java"
          grep -q 'TRIGGER_PENDING' "$ROOT/MisStopOrderPolicy.java"
          grep -q 'freshReference' "$ROOT/MisStopOrderPolicy.java"
          grep -q 'findDurableMisStop' "$ROOT/GrowwClient.java"
          grep -q 'NEW/ACKED is not counted as protection' "$ROOT/GrowwClient.java"
          grep -q 'order/list?segment=CASH' "$ROOT/GrowwClient.java"
          grep -q 'body.put("order_type", "SL_M")' "$ROOT/GrowwClient.java"
          python3 - <<'PY'
          from pathlib import Path
          text = Path('android-stable/app/src/main/java/com/suhas/multyfiautobuy/stable/GrowwClient.java').read_text()
          start = text.index('    static ApiResult createMisStopLossOrder(')
          end = text.index('    private static ApiResult findDurableMisStop(', start)
          method = text[start:end]
          assert 'body.put("trigger_price", price(strategy.stopLossPrice))' in method
          assert 'body.put("price"' not in method
          assert 'MisStopOrderPolicy.isDurable' in method
          assert 'MisStopOrderPolicy.isTerminalFailure' in method
          PY
          grep -q 'onlyDurableStatusesCountAsProtection' "$TEST/MisStopOrderPolicyTest.java"
          grep -q 'rejectedAttemptGetsFreshValidReference' "$TEST/MisStopOrderPolicyTest.java"
          grep -q 'TradeTypeBudgetPolicy.budget' "$ROOT/ProductionNotificationService.java"
          grep -q 'createMisStopLossOrder' "$ROOT/StrategyMonitorService.java"
          grep -q 'createStopLossGtt' "$ROOT/StrategyMonitorService.java"
          grep -q 'DailyAuthManager.ensureVerified(this)' "$ROOT/ProductionNotificationService.java"
          grep -q 'NotificationRoutePolicy.entryMode(signal)' "$ROOT/ProductionNotificationService.java"
          grep -q '0.10d' "$ROOT/GrowwClient.java"

      - name: Verify APK signature and stage candidate
        shell: bash
        run: |
          set -euo pipefail
          OUT=android-stable/app/build/outputs/apk/debug
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs "$OUT/app-debug.apk"
          cp "$OUT/app-debug.apk" "$OUT/Multyfi-AutoBuy-Pro-S24-Android16-v2.2.5-CANDIDATE.apk"

      - name: Download offline release signer
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o android-stable/app/build/outputs/apk/debug/uber-apk-signer-1.3.0.jar \
            https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          echo 'e1299fd6fcf4da527dd53735b56127e8ea922a321128123b9c32d619bba1d835  android-stable/app/build/outputs/apk/debug/uber-apk-signer-1.3.0.jar' | sha256sum -c -

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 16 install, two cold launches and crash scan
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          OUT=android-stable/app/build/outputs/apk/debug
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          export ANDROID_SDK_HOME="$RUNNER_TEMP/android-sdk-home"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_SDK_HOME/.android"
          AVD_PATH="$ANDROID_AVD_HOME/s24_v225_api36.avd"
          echo no | avdmanager create avd --force --name s24_v225_api36 --package 'system-images;android-36;google_apis;x86_64' --device 'pixel_8_pro' --path "$AVD_PATH"
          "$ANDROID_HOME/emulator/emulator" -avd s24_v225_api36 -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none > "$OUT/emulator-v225.log" 2>&1 &
          EMULATOR_PID=$!
          trap 'timeout 15 adb emu kill >/dev/null 2>&1 || true; kill "$EMULATOR_PID" >/dev/null 2>&1 || true' EXIT
          timeout 240 adb wait-for-device
          booted=0
          for i in $(seq 1 100); do
            state=$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$state" = "1" ]; then booted=1; break; fi
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then break; fi
            sleep 4
          done
          test "$booted" = "1"
          APK="$OUT/Multyfi-AutoBuy-Pro-S24-Android16-v2.2.5-CANDIDATE.apk"
          adb install -r "$APK" | tee "$OUT/install-v225.txt"
          grep -q Success "$OUT/install-v225.txt"
          adb shell pm grant com.suhas.multyfiautobuy.stable android.permission.POST_NOTIFICATIONS
          adb logcat -c
          for n in 1 2; do
            adb shell am force-stop com.suhas.multyfiautobuy.stable
            sleep 2
            adb shell am start -W -n com.suhas.multyfiautobuy.stable/.MainActivity | tee "$OUT/cold-launch-v225-$n.txt"
            sleep 10
            adb shell pidof com.suhas.multyfiautobuy.stable | tee "$OUT/pid-v225-$n.txt"
            test -s "$OUT/pid-v225-$n.txt"
          done
          adb shell uiautomator dump /sdcard/multyfi-v225-ui.xml
          adb pull /sdcard/multyfi-v225-ui.xml "$OUT/ui-v225.xml"
          grep -q 'Multyfi AutoBuy Pro' "$OUT/ui-v225.xml"
          grep -q 'stable release 2.2.5' "$OUT/ui-v225.xml"
          grep -q 'TRADE-TYPE BUDGETS' "$OUT/ui-v225.xml"
          adb exec-out screencap -p > "$OUT/startup-v225.png"
          adb logcat -d -v threadtime > "$OUT/logcat-v225.txt"
          if grep -E 'FATAL EXCEPTION|Process: com.suhas.multyfiautobuy.stable|ClassNotFoundException.*com.suhas.multyfiautobuy.stable' "$OUT/logcat-v225.txt"; then
            exit 1
          fi

      - name: Create validation manifest
        shell: bash
        run: |
          set -euo pipefail
          OUT=android-stable/app/build/outputs/apk/debug
          SHA=$(sha256sum "$OUT/Multyfi-AutoBuy-Pro-S24-Android16-v2.2.5-CANDIDATE.apk" | awk '{print $1}')
          cat > "$OUT/VALIDATION-v2.2.5.json" <<EOF
          {
            "version": "2.2.5-candidate",
            "package": "com.suhas.multyfiautobuy.stable",
            "android_api": 36,
            "candidate_sha256": "$SHA",
            "unit_tests": "PASS",
            "lint": "PASS",
            "debug_signature": "PASS",
            "android16_install": "PASS",
            "cold_launch_1": "PASS",
            "cold_launch_2": "PASS",
            "crash_scan": "PASS",
            "karurvysya_fix": {
              "sl_m_price_field": "omitted",
              "durable_statuses": ["TRIGGER_PENDING", "OPEN", "APPROVED"],
              "new_acked": "not protected",
              "rejected_retry": "fresh 20-character reference",
              "ambiguous_create": "recover matching durable MIS stop from order list"
            },
            "retained": {
              "trade_type_budgets": "Intraday, Swing, Multibagger, Free",
              "routing": "explicit Intraday/MIS => MIS LIMIT; otherwise CNC entry GTT",
              "MIS_protection": "regular DAY SL_M SELL with product MIS",
              "CNC_protection": "broker-side stop-loss GTT",
              "daily_groww_verification": "automatic",
              "price_grid": "INR 0.10 generated-order grid"
            }
          }
          EOF

      - name: Upload v2.2.5 candidate, signer and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Multyfi-AutoBuy-Pro-S24-Android16-v2.2.5-CANDIDATE
          path: |
            apply-v225.log
            apply-v225-exit-code.txt
            build-v225.log
            build-v225-exit-code.txt
            android-stable/app/build/outputs/apk/debug/Multyfi-AutoBuy-Pro-S24-Android16-v2.2.5-CANDIDATE.apk
            android-stable/app/build/outputs/apk/debug/uber-apk-signer-1.3.0.jar
            android-stable/app/build/outputs/apk/debug/VALIDATION-v2.2.5.json
            android-stable/app/build/outputs/apk/debug/install-v225.txt
            android-stable/app/build/outputs/apk/debug/cold-launch-v225-*.txt
            android-stable/app/build/outputs/apk/debug/pid-v225-*.txt
            android-stable/app/build/outputs/apk/debug/ui-v225.xml
            android-stable/app/build/outputs/apk/debug/logcat-v225.txt
            android-stable/app/build/outputs/apk/debug/startup-v225.png
            android-stable/app/build/outputs/apk/debug/emulator-v225.log
            android-stable/app/build/reports/tests/testDebugUnitTest/
            android-stable/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
