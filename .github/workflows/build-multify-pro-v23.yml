name: Build Multify Trader Pro v2.3

on:
  push:
    branches:
      - multify-pro-v23-build-20261002
    paths:
      - 'multify-pro-v23-build/**'
      - '.github/workflows/build-multify-pro-v23.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore v2.1 Android project
        run: |
          cat multify-pro-v21-build/android_src.part* | base64 -d > /tmp/android_v21.tgz
          tar -xzf /tmp/android_v21.tgz
          test -f android/app/build.gradle.kts

      - name: Apply v2.2 TOTP fix
        run: python multify-pro-v22-build/patch_v22.py

      - name: Apply v2.3 shadow engine
        run: |
          cat multify-pro-v23-build/patch_v23.part00 multify-pro-v23-build/patch_v23.part01 | base64 -d | gunzip > /tmp/patch_v23.py
          python /tmp/patch_v23.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Stage output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/MultifyTraderPro-v2.3.0-debug.apk
          sha256sum build-output/MultifyTraderPro-v2.3.0-debug.apk | tee build-output/SHA256.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: MultifyTraderPro-v23-APK
          path: build-output/*
          if-no-files-found: error
          retention-days: 7
