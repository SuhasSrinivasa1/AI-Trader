name: Build Multify Trader Pro v4.3 Statistical Waves

on:
  push:
    branches:
      - multify-v430-statistical-waves-20261006
    paths:
      - 'multify-final-v430/**'
      - '.github/workflows/build-multify-v430.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout v4.3 payload and stable signing material
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            multify-final-v420
            multify-final-v430
            multify-final-v4/stable_signing_key.jks.b64
            .github/workflows/build-multify-v430.yml
          sparse-checkout-cone-mode: false

      - name: Restore signed v4.2 source and apply v4.3 patch
        shell: bash
        run: |
          set -euo pipefail
          cat multify-final-v420/source.part* | base64 -d > /tmp/multify-v410-android.tgz
          tar -xzf /tmp/multify-v410-android.tgz
          test -f android/app/build.gradle.kts
          cat multify-final-v420/patch.part* > /tmp/multify-v420.patch
          (cd android && patch -p2 --batch --forward < /tmp/multify-v420.patch)
          cat multify-final-v430/patch.gz.b64.part* | base64 -d | gzip -dc > /tmp/multify-v430.patch
          echo "84a09882a3074df01db6600f394dceeec535916dcec620381425f3f98a1c9b64  /tmp/multify-v430.patch" | sha256sum -c -
          (cd android && patch -p1 --batch --forward < /tmp/multify-v430.patch)
          # Android 15 lint requires explicit subdomain handling for every debug-only cleartext host.
          sed -i -E 's#<domain>([^<]+)</domain>#<domain includeSubdomains="false">\1</domain>#g' android/app/src/debug/res/xml/network_security_config.xml
          # Keep the stable package id so this APK updates the existing Multify Trader Pro install.
          sed -i '/applicationIdSuffix = ".debug"/d' android/app/build.gradle.kts
          grep -q 'versionCode = 430' android/app/build.gradle.kts
          grep -q 'versionName = "4.3.0-statistical-waves"' android/app/build.gradle.kts
          base64 -d multify-final-v4/stable_signing_key.jks.b64 > android/app/multify-v4-stable.jks

      - name: Verify v4.3 deterministic execution contracts
        shell: bash
        run: |
          set -euo pipefail
          ROOT=android/app/src/main/java/com/multify/traderpro
          TEST=android/app/src/test/java/com/multify/traderpro/engine/DeterministicExecutionRulesTest.kt
          grep -q 'AVERAGE_STEP_FRACTION = 0.02' "$ROOT/engine/AdaptiveLearningMath.kt"
          grep -q 'AVERAGE_ADD_RUPEES = 5_000.0' "$ROOT/data/repository/TradingRepository.kt"
          grep -q 'take(30)' "$ROOT/data/repository/TradingRepository.kt"
          grep -q 'PROFIT_TRAIL_RUPEES = 1.0' "$ROOT/engine/DeterministicExecutionRules.kt"
          grep -q 'DAILY_SHORT_GROSS_LOSS_LIMIT = 2_000.0' "$ROOT/engine/DeterministicExecutionRules.kt"
          grep -q 'executionMode' "$ROOT/data/preferences/AppPreferences.kt"
          grep -q 'waveCount' "$ROOT/data/preferences/AppPreferences.kt"
          grep -q 'LONG_ONLY' "$ROOT/engine/DeterministicExecutionRules.kt"
          grep -q 'SHORT_ONLY' "$ROOT/engine/DeterministicExecutionRules.kt"
          grep -q 'longTrailExit' "$ROOT/data/repository/TradingRepository.kt"
          grep -q 'shortTrailExit' "$ROOT/data/repository/TradingRepository.kt"
          grep -q 'openFastTrackShortDirect' "$ROOT/data/repository/TradingRepository.kt"
          grep -q '20-wave statistical memory' "$ROOT/ui/screens/TraderApp.kt"
          grep -q 'DYNAMIC_FORECAST_SCAN' "$ROOT/data/repository/TradingRepository.kt"
          grep -q 'dailyShortBlockIsGrossTwoThousand' "$TEST"
          grep -q 'longDoesNotExitBeforeTargetAndOneRupeeReversal' "$TEST"
          grep -q 'TradingEngineForegroundService' android/app/src/main/AndroidManifest.xml
          grep -q 'enqueueRecovery(eventId)' "$ROOT/service/TradingEngineForegroundService.kt"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests and lint
        working-directory: android
        run: gradle --no-daemon --console=plain :app:testDebugUnitTest :app:lintDebug

      - name: Build stable-signed APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK signature, identity and stage output
        shell: bash
        run: |
          set -euo pipefail
          OUT=android/app/build/outputs/apk/debug
          STAGE=build-output
          mkdir -p "$STAGE"
          APK="$STAGE/MultifyTraderPro-VivoY73-v4.3.0-statistical-waves.apk"
          cp "$OUT/app-debug.apk" "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee "$STAGE/SIGNATURE.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee "$STAGE/BADGING.txt"
          grep -q "package: name='com.multify.traderpro.vivoy73final'" "$STAGE/BADGING.txt"
          grep -q "versionCode='430'" "$STAGE/BADGING.txt"
          grep -q "versionName='4.3.0-statistical-waves-debug'" "$STAGE/BADGING.txt"
          sha256sum "$APK" | tee "$STAGE/SHA256.txt"
          cat > "$STAGE/VALIDATION-v4.3.0.txt" <<'VALIDATION'
          Version: 4.3.0-statistical-waves
          Stable package/signing lineage: RETAINED
          Live execution arm/disarm: PRESENT
          Mutually exclusive AUTO / LONG ONLY / SHORT ONLY: PRESENT
          Wave selector 1–20: PRESENT
          Budget ₹10,000–₹2,00,000 in ₹5,000 increments: PRESENT
          Shadow uses selected budget and runs independently of live arm: PRESENT
          Long negative sell prohibited / long stop-loss absent: VERIFIED BY SOURCE CONTRACT + TESTS
          ₹5,000 averaging each further 2% decline, long only: RETAINED
          Long learned target -> ₹1 trailing exit: PRESENT
          Short averaging absent / per-trade stop absent: PRESENT
          Short learned target -> ₹1 trailing cover: PRESENT
          Daily short gross-loss circuit breaker −₹2,000: PRESENT
          Independent Up/Down wave statistics 1–20: PRESENT
          Live fast lane ~1 second and analytics skipped while managed live position exists: PRESENT
          Forecast Lab max five frozen candidates/day with after-hours WIN/FAIL: PRESENT
          WorkManager: RECOVERY FALLBACK ONLY
          Unit tests: PASS
          Android lint: PASS
          APK build: PASS
          APK signature verification: PASS
          VALIDATION
          (cd android && zip -qr "../$STAGE/MultifyTraderPro-v4.3.0-source.zip" . -x '.gradle/*' '*/build/*' 'app/multify-v4-stable.jks')

      - name: Upload v4.3 APK and validation
        uses: actions/upload-artifact@v4
        with:
          name: MultifyTraderPro-VivoY73-v4.3.0-statistical-waves
          path: |
            build-output/MultifyTraderPro-VivoY73-v4.3.0-statistical-waves.apk
            build-output/MultifyTraderPro-v4.3.0-source.zip
            build-output/SIGNATURE.txt
            build-output/BADGING.txt
            build-output/SHA256.txt
            build-output/VALIDATION-v4.3.0.txt
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/reports/lint-results-debug.html
          if-no-files-found: error
          retention-days: 14
