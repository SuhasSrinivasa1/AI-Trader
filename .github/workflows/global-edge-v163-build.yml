name: Global Edge AI Trader v1.6.3 Signal Visibility Build

on:
  push:
    paths:
      - '.github/workflows/global-edge-v163-build.yml'
      - 'fresh-global-edge/v163/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - name: Recover exact v1.6.2 source
        shell: bash
        run: |
          set -euo pipefail
          SRCZIP=fresh-global-edge/v162/release/Global-Edge-AI-Trader-v1.6.2-source.zip
          test -s "$SRCZIP"
          rm -rf /tmp/v163 && mkdir -p /tmp/v163
          unzip -q "$SRCZIP" -d /tmp/v163
          test -f /tmp/v163/Global-Edge-AI-Trader-v1.5.0-source/app/build.gradle.kts

      - name: Apply v1.6.3 signal visibility patch
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/v163/Global-Edge-AI-Trader-v1.5.0-source
          echo '9ed5304b732eb8bf8338b453efacc07e63e34dd9af841e8c602388becd44baec  fresh-global-edge/v163/patch-parts/part-00.b64' | sha256sum -c -
          echo 'ca44a32006c5eef35214f9e9f8653a72b8f33231ade097cf412add3389c237f1  fresh-global-edge/v163/patch-parts/part-01.b64' | sha256sum -c -
          echo '9cbf6053d45f6106b0e1cced43e75b8b889cdfa503a54b0d3bbe8889e27f3792  fresh-global-edge/v163/patch-parts/part-02.b64' | sha256sum -c -
          echo 'b70ef909a574d927d1f07fa5f8747a5038d0415f02464266e145ff7111f1a78d  fresh-global-edge/v163/patch-parts/part-03.b64' | sha256sum -c -
          cat fresh-global-edge/v163/patch-parts/part-*.b64 | tr -d '\r\n ' | base64 -d > /tmp/v163.patch.gz
          echo 'a097b67c748cbb9f1ebeb7262b55455bf52861b64221e5b6b0dfe1a44c32f9a5  /tmp/v163.patch.gz' | sha256sum -c -
          gzip -t /tmp/v163.patch.gz
          gunzip -c /tmp/v163.patch.gz > /tmp/v163.patch
          cd "$SRC"
          patch -p1 --batch < /tmp/v163.patch
          git diff --check --no-index /dev/null CHANGELOG-v1.6.3.txt >/dev/null 2>&1 || true
          grep -q 'versionCode = 163' app/build.gradle.kts
          grep -q 'versionName = "1.6.3"' app/build.gradle.kts
          grep -q 'INTERNAL_LIVE_PER_MINUTE = 285' app/src/main/java/com/suhas/ucsentinel/data/remote/GrowwApiHealth.kt
          grep -q 'UC_DEVELOPING' app/src/main/java/com/suhas/ucsentinel/domain/engine/ScannerEngine.kt
          grep -q 'UC_LIVE' app/src/main/java/com/suhas/ucsentinel/domain/engine/ScannerEngine.kt
          grep -q 'legacy_recall' app/src/main/java/com/suhas/ucsentinel/data/repository/UCSentinelRepository.kt
          grep -q 'EXECUTION CAUTION' app/src/main/java/com/suhas/ucsentinel/data/repository/UCSentinelRepository.kt
          grep -q 'MultifyNotificationService' app/src/main/AndroidManifest.xml
          grep -q 'NIGHTLY' app/src/main/java/com/suhas/ucsentinel/worker/NightlyLearningWorker.kt
          grep -q 'DEVELOPING' app/src/main/java/com/suhas/ucsentinel/ui/CompactMarketScreens.kt
          grep -Fq 'withTimeout(5L*60_000L)' app/src/main/java/com/suhas/ucsentinel/worker/MarketScanService.kt
          test -s CHANGELOG-v1.6.3.txt
          echo 'v1.6.3 source verification passed'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unit tests and release APK
        working-directory: /tmp/v163/Global-Edge-AI-Trader-v1.5.0-source
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out
          gradle --no-daemon --console=plain clean testDebugUnitTest assembleRelease 2>&1 | tee out/GRADLE-BUILD-TEST.log
          echo 'Unit tests + assembleRelease: PASS' > out/TEST-RESULT-SUMMARY.txt

      - name: Recover preserved signing material
        uses: actions/download-artifact@v4
        with:
          name: Global-Edge-AI-Trader-v1.5.0-FINAL
          repository: SuhasSrinivasa1/AI-Trader
          run-id: 36146076154
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/v150-artifact

      - name: Sign and verify preserved update certificate
        working-directory: /tmp/v163/Global-Edge-AI-Trader-v1.5.0-source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out /tmp/signing
          BACKUP=$(find /tmp/v150-artifact -type f -name 'Global-Edge-AI-Trader-v1.5.0-SIGNING-BACKUP.zip' | head -n1)
          test -n "$BACKUP" && test -s "$BACKUP"
          unzip -q "$BACKUP" -d /tmp/signing
          KEYSTORE=/tmp/signing/global-edge-v1.5.0.keystore
          INFO=/tmp/signing/SIGNING-INFO.txt
          STORE_PASS=$(grep '^store_password=' "$INFO" | cut -d= -f2-)
          KEY_PASS=$(grep '^key_password=' "$INFO" | cut -d= -f2-)
          UNSIGNED=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*release*.apk' | head -n1)
          OUT=out/Global-Edge-AI-Trader-v1.6.3.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$KEYSTORE" --ks-pass pass:"$STORE_PASS" --key-pass pass:"$KEY_PASS" --ks-key-alias globaledge --out "$OUT" "$UNSIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$OUT" | tee out/APK-SIGNATURE-VERIFY.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$OUT" | tee out/APK-BADGING.txt
          grep -q "package: name='com.suhas.globaledgeai'" out/APK-BADGING.txt
          grep -q "versionCode='163'" out/APK-BADGING.txt
          grep -q "versionName='1.6.3'" out/APK-BADGING.txt
          CERT_SHA=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$OUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)
          test "$CERT_SHA" = '31ffa51c23b76f450cf099d00b254870bf8eacc5ce79aee4458070a0fab783d7'
          sha256sum "$OUT" | tee out/SHA256.txt
          {
            echo 'build=SUCCESS'
            echo 'package=com.suhas.globaledgeai'
            echo 'versionCode=163'
            echo 'versionName=1.6.3'
            echo "signer_sha256=$CERT_SHA"
            echo 'update_certificate_preserved=true'
            echo 'manual_order_only=true'
            echo 'multify_notification_listener=true'
            echo 'multify_event_replay=true'
            echo 'nightly_deep_learning=true'
            echo 'off_hours_learning_preserved=true'
            echo 'pressure_fast_lane_preserved=true'
            echo 'legacy_recall_shadow=true'
            echo 'groww_healthy_live_budget=285_per_minute'
            echo 'groww_429_cooldown_budget=220_per_minute'
            echo 'serialized_groww_engines=true'
            echo 'scan_timeout=5_minutes'
            echo 'uc_live_developing_watch=true'
            echo 'uc_only_live_enters_ledger=true'
            echo 'strategy_developing_watch=true'
            echo 'discovery_quote_research_visibility=true'
            echo 'strict_live_execution_gate_preserved=true'
            echo 'execution_caution_visibility=true'
            echo 'v159_ledger_integrity_preserved=true'
          } > out/BUILD-STATUS.txt

      - name: Package source and logs
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/v163/Global-Edge-AI-Trader-v1.5.0-source
          cd /tmp/v163
          zip -qr "$SRC/out/Global-Edge-AI-Trader-v1.6.3-source.zip" Global-Edge-AI-Trader-v1.5.0-source -x '*/.gradle/*' '*/build/*' '*/out/*' '*.keystore' '*.jks'
          cd "$SRC/out"
          zip -q Global-Edge-AI-Trader-v1.6.3-build-logs.zip APK-SIGNATURE-VERIFY.txt APK-BADGING.txt SHA256.txt BUILD-STATUS.txt TEST-RESULT-SUMMARY.txt GRADLE-BUILD-TEST.log

      - name: Upload final v1.6.3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Global-Edge-AI-Trader-v1.6.3-FINAL
          retention-days: 90
          if-no-files-found: error
          path: |
            /tmp/v163/Global-Edge-AI-Trader-v1.5.0-source/out/Global-Edge-AI-Trader-v1.6.3.apk
            /tmp/v163/Global-Edge-AI-Trader-v1.5.0-source/out/Global-Edge-AI-Trader-v1.6.3-source.zip
            /tmp/v163/Global-Edge-AI-Trader-v1.5.0-source/out/Global-Edge-AI-Trader-v1.6.3-build-logs.zip
            /tmp/v163/Global-Edge-AI-Trader-v1.5.0-source/out/BUILD-STATUS.txt

      - name: Publish v1.6.3 release files
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/v163/Global-Edge-AI-Trader-v1.5.0-source/out
          DEST=fresh-global-edge/v163/release
          mkdir -p "$DEST"
          cp "$SRC/Global-Edge-AI-Trader-v1.6.3.apk" "$DEST/"
          cp "$SRC/Global-Edge-AI-Trader-v1.6.3-source.zip" "$DEST/"
          cp "$SRC/Global-Edge-AI-Trader-v1.6.3-build-logs.zip" "$DEST/"
          cp "$SRC/BUILD-STATUS.txt" "$DEST/"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$DEST"
          git commit -m 'Publish Global Edge AI Trader v1.6.3 signal-visibility release [skip ci]'
          git push
