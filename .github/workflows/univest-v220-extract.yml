name: Univest v2.2.0 Source Extraction
on:
  push:
    branches: [univest-v220-build]
    paths:
      - '.github/workflows/univest-v220-extract.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: univest-v220-build
      - name: Extract v2.1.0 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .build-temp/univest-v220-work
          mkdir -p .build-temp/univest-v220-work/source
          tar -xzf .build-temp/univest-v210-final/source.tar.gz -C .build-temp/univest-v220-work/source
          find .build-temp/univest-v220-work/source -type f | sort > .build-temp/univest-v220-work/source-inventory.txt
          (cd .build-temp/univest-v220-work/source && zip -qr ../Univest-AutoTrade-v2.1.0-extracted-source.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: Univest-v2.1.0-extracted-source
          path: |
            .build-temp/univest-v220-work/Univest-AutoTrade-v2.1.0-extracted-source.zip
            .build-temp/univest-v220-work/source-inventory.txt
      - name: Commit extracted source for patching
        shell: bash
        run: |
          set -euo pipefail
          rm -f .build-temp/univest-v220-work/Univest-AutoTrade-v2.1.0-extracted-source.zip
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .build-temp/univest-v220-work/source .build-temp/univest-v220-work/source-inventory.txt
          git diff --cached --quiet && exit 0
          git commit -m "Extract Univest v2.1.0 source for v2.2.0"
          git push origin HEAD:univest-v220-build
