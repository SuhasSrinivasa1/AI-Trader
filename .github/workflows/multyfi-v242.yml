name: Multyfi v2.4.2 HOTSPOT RELAY

on:
  push:
    branches: [multyfi-v2.4.2-hotspot-gateway-relay]
  workflow_dispatch:

jobs:
  build-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "platform-tools" \
            "emulator" \
            "system-images;android-36;google_apis;x86_64" \
            "system-images;android-29;google_apis;x86_64"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Apply v2.4.2
        shell: bash
        run: |
          set -euo pipefail
          python3 hotfix/run_v242.py | tee apply-v242.log

      - name: Tests lint release builds
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --console=plain -p android-stable \
            :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease \
            :child:testDebugUnitTest :child:lintDebug :child:assembleDebug :child:assembleRelease \
            | tee build-v242.log

      - name: Source contracts
        shell: bash
        run: |
          set -euo pipefail
          M=android-stable/app/src/main/java/com/suhas/multyfiautobuy/stable
          C=android-stable/child/src/main/java/com/suhas/multyfiautobuy/stable
          grep -q "versionCode 242" android-stable/app/build.gradle
          grep -q "versionName '2.4.2'" android-stable/app/build.gradle
          grep -q "versionCode 242" android-stable/child/build.gradle
          grep -q "versionName '2.4.2'" android-stable/child/build.gradle
          grep -q "NetworkCapabilities.TRANSPORT_WIFI" "$C/LanChildRelayService.java"
          grep -q "wifi.bindSocket(d)" "$C/LanChildRelayService.java"
          grep -q "wifi.bindSocket(s)" "$C/LanChildRelayService.java"
          grep -q "wifiGateway(wifi)" "$C/LanChildRelayService.java"
          grep -q "targets.add(gateway)" "$C/LanChildRelayService.java"
          grep -q "Groww remains on VPN" "$C/LanChildRelayService.java"
          grep -q "GROSS_LOSS_LIMIT = 2000d" "$M/DailyRiskPolicy.java"
          grep -q "NET_PROFIT_TARGET = 5000d" "$M/DailyRiskPolicy.java"
          grep -q "AppRuntimeControl.deactivate(this)" "$M/ProductionActivity.java"
          grep -q "!AppPrefs.isArmed(c)" "$M/LanMasterRelayService.java"
          grep -q "!AppPrefs.isArmed(c)" "$C/LanChildRelayService.java"
          ! grep -q 'android:name=".MultyfiNotificationService"' android-stable/child/src/main/AndroidManifest.xml

      - name: Stage APKs and generated source
        shell: bash
        run: |
          set -euo pipefail
          F=android-stable/v242
          mkdir -p "$F"
          MU=$(find android-stable/app/build/outputs/apk/release -maxdepth 1 -type f -name '*unsigned*.apk' | head -n1)
          CU=$(find android-stable/child/build/outputs/apk/release -maxdepth 1 -type f -name '*unsigned*.apk' | head -n1)
          cp "$MU" "$F/Multyfi-AutoBuy-MASTER-S24-Android16-v2.4.2-UNSIGNED.apk"
          cp "$CU" "$F/Multyfi-AutoBuy-CHILD-LG-G7-ThinQ-v2.4.2-UNSIGNED.apk"
          cp android-stable/app/build/outputs/apk/debug/app-debug.apk "$F/master-validation.apk"
          cp android-stable/child/build/outputs/apk/debug/child-debug.apk "$F/child-validation.apk"
          cp -R android-stable/app/src/main "$F/master-source"
          cp -R android-stable/child/src/main "$F/child-source"
          sha256sum "$F"/*.apk > "$F/SHA256-UNSIGNED.txt"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: MASTER Android 16 smoke and hard-OFF
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          F=android-stable/v242
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd36" ANDROID_SDK_HOME="$RUNNER_TEMP/sdk36"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_SDK_HOME/.android"
          echo no | avdmanager create avd --force --name master36 \
            --package 'system-images;android-36;google_apis;x86_64' \
            --device 'pixel_8_pro' --path "$ANDROID_AVD_HOME/master36.avd"
          "$ANDROID_HOME/emulator/emulator" -avd master36 -no-window -gpu swiftshader_indirect \
            -no-snapshot -noaudio -no-boot-anim > "$F/master-emulator.log" 2>&1 & PID=$!
          trap 'timeout 15 adb emu kill >/dev/null 2>&1 || true; kill "$PID" >/dev/null 2>&1 || true' EXIT
          timeout 240 adb wait-for-device
          for i in $(seq 1 100); do [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && break; sleep 3; done
          adb install -r "$F/master-validation.apk" | tee "$F/master-install.txt"
          grep -q Success "$F/master-install.txt"
          adb shell am start -W -n com.suhas.multyfiautobuy.stable/.MainActivity > "$F/master-launch.txt"
          sleep 4
          adb shell uiautomator dump /sdcard/master.xml >/dev/null
          adb pull /sdcard/master.xml "$F/master-ui.xml" >/dev/null
          grep -q '2.4.2' "$F/master-ui.xml"
          adb shell dumpsys activity services com.suhas.multyfiautobuy.stable > "$F/master-services-off.txt"
          ! grep -q 'LanMasterRelayService' "$F/master-services-off.txt"
          ! grep -q 'StrategyMonitorService' "$F/master-services-off.txt"
          adb emu kill >/dev/null 2>&1 || true
          wait "$PID" 2>/dev/null || true
          trap - EXIT

      - name: CHILD Android 10 smoke and hard-OFF
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          F=android-stable/v242
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd29" ANDROID_SDK_HOME="$RUNNER_TEMP/sdk29"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_SDK_HOME/.android"
          echo no | avdmanager create avd --force --name child29 \
            --package 'system-images;android-29;google_apis;x86_64' \
            --device 'pixel_2' --path "$ANDROID_AVD_HOME/child29.avd"
          "$ANDROID_HOME/emulator/emulator" -avd child29 -no-window -gpu swiftshader_indirect \
            -no-snapshot -noaudio -no-boot-anim > "$F/child-emulator.log" 2>&1 & PID=$!
          trap 'timeout 15 adb emu kill >/dev/null 2>&1 || true; kill "$PID" >/dev/null 2>&1 || true' EXIT
          timeout 240 adb wait-for-device
          for i in $(seq 1 100); do [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && break; sleep 3; done
          adb install -r "$F/child-validation.apk" | tee "$F/child-install.txt"
          grep -q Success "$F/child-install.txt"
          adb shell am start -W -n com.suhas.multyfiautobuy.child/com.suhas.multyfiautobuy.stable.MainActivity > "$F/child-launch.txt"
          sleep 4
          adb shell uiautomator dump /sdcard/child.xml >/dev/null
          adb pull /sdcard/child.xml "$F/child-ui.xml" >/dev/null
          grep -q 'Multyfi AutoBuy CHILD' "$F/child-ui.xml"
          grep -q '2.4.2' "$F/child-ui.xml"
          grep -q 'Hard OFF' "$F/child-ui.xml"
          adb shell dumpsys activity services com.suhas.multyfiautobuy.child > "$F/child-services-off.txt"
          ! grep -q 'LanChildRelayService' "$F/child-services-off.txt"
          ! grep -q 'StrategyMonitorService' "$F/child-services-off.txt"
          adb emu kill >/dev/null 2>&1 || true
          wait "$PID" 2>/dev/null || true
          trap - EXIT

      - name: Release notes
        shell: bash
        run: |
          cat > android-stable/v242/RELEASE-NOTES-v2.4.2.txt <<'EOF'
          Multyfi AutoBuy MASTER + CHILD v2.4.2

          HOTSPOT RELAY FIX
          - CHILD local relay now finds the physical Wi-Fi network even when Surfshark/VPN is active.
          - CHILD pins only MASTER/CHILD UDP/TCP relay sockets to physical Wi-Fi.
          - CHILD probes the Wi-Fi DHCP/default gateway first. When the G7 is connected to the S24 hotspot, that gateway is the MASTER phone.
          - Authenticated UDP discovery and broadcast remain as fallback.
          - Groww API traffic is NOT pinned to Wi-Fi and continues to use the configured Surfshark VPN/static IP route.

          UNCHANGED SAFETY RULES
          - Hard OFF stops monitor and MASTER/CHILD relay when flat.
          - Daily +₹5,000 target is estimated NET after charges.
          - -₹2,000 emergency loss threshold is GROSS and triggers immediate MARKET exit/day lock.
          - Multyfi early-sell behavior retained.

          VALIDATION
          - MASTER/CHILD unit tests, lint and release builds pass in CI.
          - MASTER cold launch/hard-OFF validated on Android 16 emulator.
          - CHILD cold launch/hard-OFF validated on Android 10 emulator.
          - Physical S24-hotspot-to-LG-G7 connectivity still requires a real-device check after install.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: Multyfi-AutoBuy-v2.4.2-HOTSPOT-RELAY-VALIDATED-UNSIGNED
          path: |
            android-stable/v242/
            apply-v242.log
            build-v242.log
            android-stable/app/build/reports/tests/testDebugUnitTest/
            android-stable/child/build/reports/tests/testDebugUnitTest/
          if-no-files-found: error
