name: Build Multyfi v2.3.4 Fast Early Exit

on:
  push:
    branches: [multyfi-v2.3.4-fast-early-exit]
  workflow_dispatch:

jobs:
  build-test-android16:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools" "emulator" "system-images;android-36;google_apis;x86_64"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Apply v2.3.4 source update
        shell: bash
        run: |
          set -euo pipefail
          python3 hotfix/run_v234.py | tee apply-v234.log

      - name: Unit tests, lint and builds
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --console=plain -p android-stable \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug \
            :app:assembleRelease | tee build-v234.log

      - name: Verify fast-exit safety contracts
        shell: bash
        run: |
          set -euo pipefail
          ROOT=android-stable/app/src/main/java/com/suhas/multyfiautobuy/stable
          TEST=android-stable/app/src/test/java/com/suhas/multyfiautobuy/stable
          grep -q "versionCode 234" android-stable/app/build.gradle
          grep -q "versionName '2.3.4'" android-stable/app/build.gradle
          grep -q "convertOpenMisStopToMarketSell" "$ROOT/GrowwClient.java"
          grep -q 'API_BASE + "/order/modify"' "$ROOT/GrowwClient.java"
          grep -q 'body.put("order_type", "MARKET")' "$ROOT/GrowwClient.java"
          grep -q 'body.put("groww_order_id"' "$ROOT/GrowwClient.java"
          ! sed -n '/convertOpenMisStopToMarketSell/,/placeTargetMarketSell/p' "$ROOT/GrowwClient.java" | grep -q 'body.put("trigger_price"'
          grep -q "MULTYFI EARLY EXIT FAST SUBMITTED" "$ROOT/StrategyMonitorService.java"
          grep -q "MULTYFI FAST EXIT FALLBACK" "$ROOT/StrategyMonitorService.java"
          grep -q "tryImmediateTrackedEarlyExit" "$ROOT/StrategyMonitorService.java"
          grep -q "gspcropCompleteProtectedTradeUsesImmediateOneRequestPath" "$TEST/FastEarlyExitPolicyTest.java"
          grep -q "MULTYFI EARLY EXIT WAITING — STOP CANCEL NOT CONFIRMED" "$ROOT/StrategyMonitorService.java"
          grep -q "queueEarlyExit(earlyExit)" "$ROOT/ProductionNotificationService.java"
          grep -q "acceptsUnlabelledNewEquityTradeAsMis" "$TEST/IntradayOnlyPolicyTest.java"

      - name: Stage release and generated source
        shell: bash
        run: |
          set -euo pipefail
          FINAL=android-stable/app/build/outputs/apk/v234
          mkdir -p "$FINAL"
          cp android-stable/app/build/outputs/apk/debug/app-debug.apk \
            "$FINAL/Multyfi-AutoBuy-Pro-S24-Android16-v2.3.4-VALIDATION.apk"
          UNSIGNED=$(find android-stable/app/build/outputs/apk/release -maxdepth 1 -type f -name '*unsigned*.apk' | head -n 1)
          test -n "$UNSIGNED"
          cp "$UNSIGNED" "$FINAL/Multyfi-AutoBuy-Pro-S24-Android16-v2.3.4-UNSIGNED.apk"
          cp -R android-stable/app/src/main "$FINAL/generated-main-source"
          cp -R android-stable/app/src/test "$FINAL/generated-test-source"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 16 install and two cold launches
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          FINAL=android-stable/app/build/outputs/apk/v234
          APK="$FINAL/Multyfi-AutoBuy-Pro-S24-Android16-v2.3.4-VALIDATION.apk"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          export ANDROID_SDK_HOME="$RUNNER_TEMP/android-sdk-home"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_SDK_HOME/.android"
          echo no | avdmanager create avd --force --name s24_v234 \
            --package 'system-images;android-36;google_apis;x86_64' \
            --device 'pixel_8_pro' --path "$ANDROID_AVD_HOME/s24_v234.avd"
          "$ANDROID_HOME/emulator/emulator" -avd s24_v234 -no-window \
            -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim \
            -camera-back none > "$FINAL/emulator-v234.log" 2>&1 &
          EMULATOR_PID=$!
          trap 'timeout 15 adb emu kill >/dev/null 2>&1 || true; kill "$EMULATOR_PID" >/dev/null 2>&1 || true' EXIT
          timeout 240 adb wait-for-device
          booted=0
          for i in $(seq 1 100); do
            state=$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$state" = "1" ]; then booted=1; break; fi
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then break; fi
            sleep 4
          done
          test "$booted" = "1"
          adb install -r "$APK" | tee "$FINAL/install-v234.txt"
          grep -q Success "$FINAL/install-v234.txt"
          adb shell pm grant com.suhas.multyfiautobuy.stable android.permission.POST_NOTIFICATIONS
          adb logcat -c
          for n in 1 2; do
            adb shell am force-stop com.suhas.multyfiautobuy.stable
            sleep 2
            adb shell am start -W -n com.suhas.multyfiautobuy.stable/.MainActivity \
              | tee "$FINAL/cold-launch-v234-$n.txt"
            sleep 8
            adb shell pidof com.suhas.multyfiautobuy.stable \
              | tee "$FINAL/pid-v234-$n.txt"
            test -s "$FINAL/pid-v234-$n.txt"
          done
          adb shell uiautomator dump /sdcard/v234-ui.xml
          adb pull /sdcard/v234-ui.xml "$FINAL/ui-v234.xml"
          grep -q 'Multyfi AutoBuy Pro' "$FINAL/ui-v234.xml"
          grep -q '2.3.4' "$FINAL/ui-v234.xml"
          adb exec-out screencap -p > "$FINAL/startup-v234.png"
          adb logcat -d -v threadtime > "$FINAL/logcat-v234.txt"
          if grep -E 'FATAL EXCEPTION|Process: com.suhas.multyfiautobuy.stable|ClassNotFoundException.*com.suhas.multyfiautobuy.stable' "$FINAL/logcat-v234.txt"; then exit 1; fi

      - name: Create release files
        shell: bash
        run: |
          set -euo pipefail
          FINAL=android-stable/app/build/outputs/apk/v234
          SHA=$(sha256sum "$FINAL/Multyfi-AutoBuy-Pro-S24-Android16-v2.3.4-UNSIGNED.apk" | awk '{print $1}')
          cat > "$FINAL/RELEASE-NOTES-v2.3.4.txt" <<'EOF'
          MULTYFI AUTOBUY PRO v2.3.4 — IMMEDIATE AUTHORITATIVE EARLY EXIT

          - For one completely filled and protected MIS trade, the existing
            full-quantity stop-loss is changed directly to MARKET using one Groww
            modify request as soon as the Multyfi early-exit instruction is processed.
          - The common fast path performs no pre-status lookup, position lookup,
            stop cancellation, cancellation polling, quote request or second order create.
          - It exits the complete quantity of the matching Multyfi stock only; it does
            not close unrelated manual or other-symbol account positions.
          - If the one-request conversion is unavailable or rejected, v2.3.3's
            broker-verified cancel-then-market fallback runs immediately.
          - Free, Swing and Multibagger entry notifications remain blocked.
          - Early-exit intent remains persisted until Groww confirms zero position.
          EOF
          cat > "$FINAL/VALIDATION-v2.3.4.json" <<EOF
          {
            "version": "2.3.4",
            "version_code": 234,
            "package": "com.suhas.multyfiautobuy.stable",
            "unsigned_release_sha256": "$SHA",
            "unit_tests": "PASS",
            "lint": "PASS",
            "android_16_install": "PASS",
            "cold_launch_1": "PASS",
            "cold_launch_2": "PASS",
            "fast_exit": "one immediate regular-order modify from full MIS SL to MARKET",
            "fast_path_pre_status_lookup": false,
            "fast_path_cancel_request": false,
            "fast_path_position_lookup": false,
            "fallback": "verified stop cancel then MARKET sell",
            "account_wide_exit": false,
            "matching_symbol_complete_quantity_exit": true,
            "live_groww_execution_test": false
          }
          EOF

      - name: Upload v2.3.4 build package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Multyfi-AutoBuy-Pro-S24-Android16-v2.3.4-BUILD
          path: |
            apply-v234.log
            build-v234.log
            android-stable/app/build/outputs/apk/v234/
            android-stable/app/build/reports/tests/testDebugUnitTest/
            android-stable/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
