name: Global Edge AI Trader v1.5.4 Global Flow Build

on:
  push:
    paths:
      - '.github/workflows/global-edge-v154-build.yml'
      - 'fresh-global-edge/v154/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - name: Prepare exact v1.5.3 source and apply Global flow state machine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v154
          unzip -q fresh-global-edge/v153/release/Global-Edge-AI-Trader-v1.5.3-source.zip -d /tmp/v154
          SRC=/tmp/v154/Global-Edge-AI-Trader-v1.5.0-source
          python "$GITHUB_WORKSPACE/fresh-global-edge/v154/fix_v154_global_flow.py" "$SRC"

          cd "$SRC"
          grep -q 'versionCode = 154' app/build.gradle.kts
          grep -q 'versionName = "1.5.4"' app/build.gradle.kts
          grep -q 'enforceGlobalLiveOnlyFlow' app/src/main/java/com/suhas/ucsentinel/data/local/AppPreferences.kt
          grep -q 'NEXT is research only' app/src/main/java/com/suhas/ucsentinel/data/repository/UCSentinelRepository.kt
          grep -q 'call.bucket!=TradeCallBucket.LIVE' app/src/main/java/com/suhas/ucsentinel/data/repository/UCSentinelRepository.kt
          grep -q 'it.bucket==TradeCallBucket.LIVE' app/src/main/java/com/suhas/ucsentinel/ui/CompactMarketScreens.kt
          if grep -q 'RESEARCH WATCH' app/src/main/java/com/suhas/ucsentinel/ui/CompactMarketScreens.kt; then
            echo "Research Watch must remain backend-only"; exit 1
          fi
          grep -q 'EARLY-OPEN' app/src/main/java/com/suhas/ucsentinel/domain/engine/TradingStrategyEngine.kt
          grep -q 'UC_LIVE_READY' app/src/main/java/com/suhas/ucsentinel/domain/engine/ScannerEngine.kt
          echo "v1.5.4 Global state-machine verification passed"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unit tests and release APK
        working-directory: /tmp/v154/Global-Edge-AI-Trader-v1.5.0-source
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out
          gradle --no-daemon --console=plain clean testDebugUnitTest assembleRelease 2>&1 | tee out/GRADLE-BUILD-TEST.log
          echo "Unit tests + assembleRelease: PASS" > out/TEST-RESULT-SUMMARY.txt

      - name: Recover preserved signing material
        uses: actions/download-artifact@v4
        with:
          name: Global-Edge-AI-Trader-v1.5.0-FINAL
          repository: SuhasSrinivasa1/AI-Trader
          run-id: 36146076154
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/v150-artifact

      - name: Sign and verify preserved update certificate
        working-directory: /tmp/v154/Global-Edge-AI-Trader-v1.5.0-source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out /tmp/signing
          BACKUP=$(find /tmp/v150-artifact -type f -name 'Global-Edge-AI-Trader-v1.5.0-SIGNING-BACKUP.zip' | head -n1)
          unzip -q "$BACKUP" -d /tmp/signing
          KEYSTORE=/tmp/signing/global-edge-v1.5.0.keystore
          INFO=/tmp/signing/SIGNING-INFO.txt
          STORE_PASS=$(grep '^store_password=' "$INFO" | cut -d= -f2-)
          KEY_PASS=$(grep '^key_password=' "$INFO" | cut -d= -f2-)
          UNSIGNED=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*release*.apk' | head -n1)
          OUT=out/Global-Edge-AI-Trader-v1.5.4.apk

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$KEYSTORE" --ks-pass pass:"$STORE_PASS" --key-pass pass:"$KEY_PASS" --ks-key-alias globaledge --out "$OUT" "$UNSIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$OUT" | tee out/APK-SIGNATURE-VERIFY.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$OUT" | tee out/APK-BADGING.txt
          grep -q "package: name='com.suhas.globaledgeai'" out/APK-BADGING.txt
          grep -q "versionCode='154'" out/APK-BADGING.txt
          grep -q "versionName='1.5.4'" out/APK-BADGING.txt
          CERT_SHA=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$OUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)
          test "$CERT_SHA" = "31ffa51c23b76f450cf099d00b254870bf8eacc5ce79aee4458070a0fab783d7"
          sha256sum "$OUT" | tee out/SHA256.txt
          {
            echo "build=SUCCESS"
            echo "package=com.suhas.globaledgeai"
            echo "versionCode=154"
            echo "versionName=1.5.4"
            echo "signer_sha256=$CERT_SHA"
            echo "manual_order_only=true"
            echo "global_flow=NEXT_RESEARCH_ONLY_TO_LIVE_TO_DONE"
            echo "research_watch=BACKEND_ONLY"
            echo "done_filter=GLOBAL_LIVE_ORIGIN_ONLY"
            echo "migration=archive legacy GLOBAL non-LIVE calls and rebuild Global learning from LIVE-only outcomes"
          } > out/BUILD-STATUS.txt

      - name: Package source and logs
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/v154/Global-Edge-AI-Trader-v1.5.0-source
          cd /tmp/v154
          zip -qr "$SRC/out/Global-Edge-AI-Trader-v1.5.4-source.zip" Global-Edge-AI-Trader-v1.5.0-source -x '*/.gradle/*' '*/build/*' '*/out/*' '*.keystore' '*.jks'
          cd "$SRC/out"
          zip -q Global-Edge-AI-Trader-v1.5.4-build-logs.zip APK-SIGNATURE-VERIFY.txt APK-BADGING.txt SHA256.txt BUILD-STATUS.txt TEST-RESULT-SUMMARY.txt GRADLE-BUILD-TEST.log

      - name: Upload final v1.5.4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Global-Edge-AI-Trader-v1.5.4-FINAL
          retention-days: 90
          if-no-files-found: error
          path: |
            /tmp/v154/Global-Edge-AI-Trader-v1.5.0-source/out/Global-Edge-AI-Trader-v1.5.4.apk
            /tmp/v154/Global-Edge-AI-Trader-v1.5.0-source/out/Global-Edge-AI-Trader-v1.5.4-source.zip
            /tmp/v154/Global-Edge-AI-Trader-v1.5.0-source/out/Global-Edge-AI-Trader-v1.5.4-build-logs.zip
            /tmp/v154/Global-Edge-AI-Trader-v1.5.0-source/out/BUILD-STATUS.txt

      - name: Publish v1.5.4 release files
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/v154/Global-Edge-AI-Trader-v1.5.0-source/out
          DEST=fresh-global-edge/v154/release
          mkdir -p "$DEST"
          cp "$SRC/Global-Edge-AI-Trader-v1.5.4.apk" "$DEST/"
          cp "$SRC/Global-Edge-AI-Trader-v1.5.4-source.zip" "$DEST/"
          cp "$SRC/Global-Edge-AI-Trader-v1.5.4-build-logs.zip" "$DEST/"
          cp "$SRC/BUILD-STATUS.txt" "$DEST/"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$DEST"
          git commit -m 'Publish Global Edge AI Trader v1.5.4 Global flow release [skip ci]'
          git push
