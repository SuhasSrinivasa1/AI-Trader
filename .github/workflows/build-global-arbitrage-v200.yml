name: Build Global Arbitrage AI Trader v2.0.0

on:
  push:
    branches: [main]
    paths:
      - 'builds/global-arbitrage-v200/**'
      - '.github/workflows/build-global-arbitrage-v200.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Bootstrap Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/android-cmdline.zip
          unzip -q /tmp/android-cmdline.zip -d /tmp/android-cmdline
          mv /tmp/android-cmdline/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          printf "y\\n%.0s" {1..50} | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare v2 source from latest stable base
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/arbv2
          mkdir -p /tmp/arbv2
          unzip -q fresh-global-edge/v160/release/Global-Edge-AI-Trader-v1.6.0-source.zip -d /tmp/arbv2
          ROOT=$(find /tmp/arbv2 -name settings.gradle.kts -printf '%h\n' | head -1)
          test -n "$ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          sed -i 's/versionCode = [0-9][0-9]*/versionCode = 200/' "$ROOT/app/build.gradle.kts"
          sed -i 's/versionName = "[^"]*"/versionName = "2.0.0"/' "$ROOT/app/build.gradle.kts"
          cp builds/global-arbitrage-v200/AppNavigation.kt "$ROOT/app/src/main/java/com/suhas/ucsentinel/ui/AppNavigation.kt"
          cp builds/global-arbitrage-v200/QuantV2Screen.kt "$ROOT/app/src/main/java/com/suhas/ucsentinel/ui/QuantV2Screen.kt"
          sed -i 's/Global Edge AI Trader/Global Arbitrage AI Trader/g' "$ROOT/app/src/main/res/values/strings.xml"
          grep -n 'versionCode\|versionName' "$ROOT/app/build.gradle.kts"

      - name: Unit tests and lint
        run: gradle --no-daemon --console=plain -p "$ROOT" :app:testDebugUnitTest :app:lintDebug

      - name: Build installable APK
        run: |
          gradle --no-daemon --console=plain -p "$ROOT" :app:assembleDebug
          OUT="$ROOT/app/build/outputs/apk/debug"
          cp "$OUT/app-debug.apk" "$OUT/Global-Arbitrage-AI-Trader-v2.0.0-S24-Android16.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$OUT/Global-Arbitrage-AI-Trader-v2.0.0-S24-Android16.apk" > "$OUT/signature.txt"
          sha256sum "$OUT/Global-Arbitrage-AI-Trader-v2.0.0-S24-Android16.apk" > "$OUT/SHA256.txt"

      - name: Package source snapshot
        run: |
          cd "$ROOT/.."
          zip -qr Global-Arbitrage-AI-Trader-v2.0.0-source.zip "$(basename "$ROOT")"
          cp Global-Arbitrage-AI-Trader-v2.0.0-source.zip "$ROOT/app/build/outputs/apk/debug/"

      - name: Upload v2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Global-Arbitrage-AI-Trader-v2.0.0-S24
          path: |
            ${{ env.ROOT }}/app/build/outputs/apk/debug/Global-Arbitrage-AI-Trader-v2.0.0-S24-Android16.apk
            ${{ env.ROOT }}/app/build/outputs/apk/debug/SHA256.txt
            ${{ env.ROOT }}/app/build/outputs/apk/debug/signature.txt
            ${{ env.ROOT }}/app/build/outputs/apk/debug/Global-Arbitrage-AI-Trader-v2.0.0-source.zip
            ${{ env.ROOT }}/app/build/reports/tests/testDebugUnitTest/
            ${{ env.ROOT }}/app/build/reports/lint-results-debug.html
          if-no-files-found: error
