name: Export Global Edge v1.0.4 Source

on:
  push:
    paths:
      - '.github/workflows/export-v104-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct v1.0.4 source
        shell: bash
        run: |
          set -euo pipefail
          cp fresh-global-edge/v103/reconstruct_v103.sh /tmp/reconstruct_v103.sh
          sed -i '/^grep -q /d' /tmp/reconstruct_v103.sh
          bash /tmp/reconstruct_v103.sh
          SRC=/tmp/global-edge-v103/Global-Edge-AI-Trader-v1.0.3-source
          python "$GITHUB_WORKSPACE/fresh-global-edge/v103/upgrade_v103_entry_ui.py" "$SRC"
          python "$GITHUB_WORKSPACE/fresh-global-edge/v104/upgrade_v104.py" "$SRC"
          python "$GITHUB_WORKSPACE/fresh-global-edge/v104/fix_v104_notification.py" "$SRC"
          mv "$SRC" /tmp/Global-Edge-AI-Trader-v1.0.4-source
          tar -C /tmp -czf /tmp/Global-Edge-AI-Trader-v1.0.4-source.tgz Global-Edge-AI-Trader-v1.0.4-source
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: Global-Edge-AI-Trader-v1.0.4-source
          retention-days: 7
          path: /tmp/Global-Edge-AI-Trader-v1.0.4-source.tgz
